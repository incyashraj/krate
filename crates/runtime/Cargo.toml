[package]
name = "krate-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Native dialogs exist on the three desktop systems only. On Android and
# iOS the platform document picker is a different mechanism (mobile plan,
# M3); until it is wired, dialog calls there answer as cancelled -- the
# same honest degradation headless runs use.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd.workspace = true

[features]
# Speech is OPT-IN. It is the only thing in the tree that needs a C++
# toolchain, bindgen and cmake, and it has blocked three platforms on its own
# (K-149). The release workflow enables it, so shipped binaries transcribe;
# an ordinary build needs nothing but rustup.
default = ["phase2-bindings"]
phase2-bindings = []
speech = ["dep:whisper-rs"]

[dependencies]
# HTTPS for guest apps. Same TLS stack the CLI and bundle crates already use,
# so there is one certificate story in the workspace rather than two.
ureq.workspace = true
tungstenite.workspace = true
rusqlite.workspace = true
sha2 = "0.10.9"
# Encoding a window frame to a PNG for `krate shoot` and headless verification.
png = "0.18.1"
# vector-text so a headless screenshot renders with the same antialiased vello
# text the Windows and Linux windows use -- a screenshot has to look like the
# real thing to be worth taking.
krate-adapter-common = { path = "../adapter-common", features = ["vector-text"] }
krate-layout = { path = "../layout" }
krate-manifest = { path = "../manifest" }
krate-policy = { path = "../policy" }
libc.workspace = true
# The usability report check-app reads back after a driven run.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmtime.workspace = true
cpal = "0.18.1"
whisper-rs = { version = "0.16.0", optional = true }
# Gamepads. Pulls libudev-sys on Linux, which is why every Linux build got the
# udev headers in the change before this one.
gilrs = "0.11.0"

[target.'cfg(target_os = "android")'.dependencies]
krate-adapter-android = { path = "../adapter-android" }

[target.'cfg(target_os = "ios")'.dependencies]
krate-adapter-ios = { path = "../adapter-ios" }

[target.'cfg(target_os = "linux")'.dependencies]
krate-adapter-linux = { path = "../adapter-linux" }
# Camera capture through V4L2. Needs the kernel headers (libv4l-dev) at build
# time, which is why this cannot be cross-checked from a Mac.
nokhwa = { version = "0.10", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
krate-adapter-macos = { path = "../adapter-macos" }
# Camera capture. Same objc2 family the macOS window adapter already uses, so
# there is one Objective-C runtime in the tree rather than two. Only the
# classes the camera path touches are enabled.
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVCaptureInput", "AVCaptureOutput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat", "block2", "dispatch2", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["CMBase", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelFormatDescription", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSDictionary", "NSString", "NSValue", "NSObject", "objc2-core-foundation"] }
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
# The completion block macOS calls with the person's answer to the camera prompt.
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
krate-adapter-windows = { path = "../adapter-windows" }
# Camera capture through Media Foundation. macOS has its own AVFoundation
# backend because it needs the platform permission dance; Windows and Linux do
# not, and nokhwa wraps both their native APIs behind one interface, so one
# file closes both gaps instead of two bodies of unsafe code.
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }

[dev-dependencies]
tempfile = "3.27.0"
criterion.workspace = true
wit-parser.workspace = true

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "uapi_dispatch"
harness = false

[[bench]]
name = "native_comparison"
harness = false

[[bench]]
name = "scene3d"
harness = false
