[package]
name = "krate-player-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "krate-player-ios"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.10"

[dependencies]
krate-manifest = { path = "../manifest" }
krate-policy = { path = "../policy" }
krate-bundle = { path = "../bundle" }
# Which publisher an app's synced data is kept under, and the sync toggles
# (IC-981): the same rules on a phone as on a computer.
krate-accountsync = { path = "../accountsync" }
# An organisation's private apps (K-1171): the check-in, the lease, this
# phone's organisation key, its team data and connections -- the computer's
# own code, over the Player's private storage.
krate-orgaccess = { path = "../orgaccess" }
krate-runtime = { path = "../runtime", default-features = false, features = [
    "phase2-bindings",
] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
krate-accountsync = { path = "../accountsync", features = ["agent"] }
serde_json.workspace = true
# sync_home.rs (shared from player-android) proves a row conflict's card
# on a real database (IC-981 S4).
krate-appsql = { path = "../appsql" }
# run_config.rs (shared from player-android) tests the output card against
# the runtime's own argument rule.
krate-runtime = { path = "../runtime", default-features = false, features = [
    "phase2-bindings",
] }

[target.'cfg(target_os = "ios")'.dependencies]
# Sync on Krate's home (IC-981 S2): asking the hub how this phone stands,
# approving a device, the recovery code.
krate-accountsync = { path = "../accountsync", features = ["agent"] }
# Speech stays off, same as Android: whisper.cpp on phones is its own
# project and the capability degrades honestly.
krate-runtime = { path = "../runtime", default-features = false, features = [
    "phase2-bindings",
] }
krate-adapter-ios = { path = "../adapter-ios" }
objc2 = "0.6.4"
libc = "0.2"
block2 = "0.6"
dispatch2 = "0.3"
# The audio session: sound plays with the silent switch on, as a music
# app's does.
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionTypes",
] }
# The store: the hub's catalogue and apps over TLS, its screenshots decoded.
ureq.workspace = true
serde_json.workspace = true
png = "0.17"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSURL",
    "NSDictionary",
    "NSArray",
    "NSSet",
    "NSEnumerator",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "UIApplication",
    "UIResponder",
    "UIAlertController",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
    "UIScene",
    "UIView",
    "UIDocumentPickerViewController",
    # The profile tab: the phone's name.
    "UIDevice",
    "block2",
] }
