[package]
name = "krate-validator-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The bundle validator as a WebAssembly module, so the hub's door runs the same code the CLI does"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
krate-bundle = { path = "../bundle", default-features = false }
serde_json = { workspace = true }
# The browser Player's judgement names each core module of the judged
# component by digest (IC-956).
sha2 = "0.10.9"
wasmparser.workspace = true
# ring pulls getrandom, which on wasm32-unknown-unknown wants either a
# JavaScript backend (wasm-bindgen imports the Worker cannot satisfy) or a
# custom one. Verification never draws randomness, so the custom backend
# below refuses, and the module has no imports at all.
getrandom = { version = "0.2", features = ["custom"] }
# The organisation keyring and signing ring, for a browser tab that is an
# owner's device (IC-958): the same sealing the CLI does, not a JavaScript
# copy of it. Without its `agent` feature it has no network code.
krate-orgkeys = { path = "../orgkeys" }
# A browser tab's team data (store.org, G1): the device's copy, the merge and
# the sealing, the same crate krate-runtime's org_store is built on.
krate-orgdata = { path = "../orgdata" }
zeroize = "1.8"

# The keyring's HPKE draws its randomness through getrandom 0.3. In the
# module that comes from the page that calls it (crypto.getRandomValues),
# handed in with each call; the hub's door never asks for any. The build
# script selects this backend with `--cfg getrandom_backend="custom"`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom3 = { package = "getrandom", version = "=0.3.4" }
