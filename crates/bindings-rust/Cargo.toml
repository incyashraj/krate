[package]
name = "krate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust guest SDK for Krate UAPI components."
readme = "README.md"
homepage = "https://incyashraj.github.io/krate/"
documentation = "https://docs.rs/krate"
keywords = ["krate", "wasm", "component", "uapi", "sdk"]
categories = ["api-bindings", "wasm"]
include = [
    "Cargo.toml",
    "README.md",
    "src/**/*.rs",
]

[features]
# Off by default so a guest links no `std` (and cannot leak std's latent
# `wasi:*` imports). Host builds — this crate's unit tests, docs — enable it to
# get the `std::error::Error` impls. Guests never turn it on.
default = []
std = []
# Provide the getrandom custom backend so ordinary crates that pull getrandom
# (rand, uuid, and much of the ecosystem) work on Krate without the app writing
# any wiring. Entropy is routed to `krate:random/bytes`, so an app that turns
# this on must declare the `random.bytes` capability. Off by default: it adds a
# dependency and forces `--cfg getrandom_backend="custom"`, which only an app
# that actually pulls getrandom should take on.
getrandom-backend = ["dep:getrandom"]

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
# Only pulled in when an app opts into the getrandom backend. `custom` is the
# feature that lets a downstream register its own source; the `--cfg
# getrandom_backend="custom"` flag (set by the app's build) is what activates it.
getrandom = { version = "0.3", default-features = false, optional = true }
# The global allocator for a `no_std` guest. This is the same allocator `std`
# uses on wasm32-wasip1, so it is a known-good, no-surprises choice; the guest
# gets `alloc` (Vec/String) with zero boilerplate and the SDK owns the wiring so
# no app has to. Only linked into the wasm guest.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
