[package]
name = "krate-adapter-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
krate-adapter-common = { path = "../adapter-common", features = [
    "vector-text",
] }

# Unconditional, deliberately: the runtime only pulls this crate on Windows
# targets, so production binaries elsewhere are untouched -- but the dev
# machine now COMPILES the real windowing and GPU path instead of a stub
# that proved nothing (see dev-anyos below).
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# CPU framebuffer for the first drawn-widget pass; the Windows backend needs
# no feature flags. Vello/wgpu replaces the presenter later (plan 7.5).
softbuffer = { version = "0.4", default-features = false }
# The GPU presenter (Plan/GPU-Presenter.md S2): vello scenes on a wgpu
# surface when a usable adapter initializes; softbuffer stays as the
# fallback that never blocks an app.
krate-presenter-gpu = { path = "../presenter-gpu" }
pollster = "0.4"
# OS clipboard for the drawn path's Cut/Copy/Paste. Text-only (no image-data),
# so it pulls only the Win32 clipboard backend.
arboard.workspace = true

# Toasts (IC-271): WinRT's ToastNotificationManager under a per-app
# AppUserModelID registered in HKCU. Already in the dependency tree at this
# version (wgpu-hal, cpal, gilrs), so this is a direct edge to a crate that
# was being built anyway. Windows only: the bindings do not link elsewhere.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
] }

[features]
# Compile the real winit+GPU path on any OS, for local dev proof.
dev-anyos = []

[[example]]
name = "gpu_window"
required-features = ["dev-anyos"]

# The canvas-churn harness drives GpuPresent directly, which only exists on
# Windows targets or under dev-anyos; everywhere else the example must not
# even be compiled.
[[example]]
name = "canvas_churn"
required-features = ["dev-anyos"]
