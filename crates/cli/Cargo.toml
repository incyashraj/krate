[package]
name = "krate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "krate"
path = "src/main.rs"

# The Windows double-click handler. A separate binary because it is built for
# the "windows" subsystem, which is what stops a console appearing beside a
# double-clicked app -- and that subsystem is wrong for `krate` itself, which
# has to print in a terminal.
[[bin]]
name = "krate-open"
path = "src/bin/krate-open.rs"

[features]
# Speech is on by default and can be dropped for a platform whose toolchain
# cannot build whisper.cpp. Kept as a passthrough so `cargo build -p krate-cli
# --no-default-features` reaches the runtime rather than silently keeping it.
default = ["speech"]
speech = ["krate-runtime/speech"]

[dependencies]
# Native consent fallback where no terminal exists (Windows dialog).
rfd.workspace = true
anyhow.workspace = true
clap.workspace = true
krate-manifest = { path = "../manifest", version = "0.1.0-dev" }
krate-policy = { path = "../policy", version = "0.1.0-dev" }
krate-bundle = { path = "../bundle", version = "0.1.0-dev" }
krate-runtime = { path = "../runtime", version = "0.1.0-dev", default-features = false, features = ["phase2-bindings"] }
krate-author = { path = "../author", version = "0.1.0-dev" }
krate-mcp = { path = "../mcp", version = "0.1.0-dev" }
krate-port = { path = "../port", version = "0.1.0-dev" }
# For the widget list in the generated agent reference, so a widget cannot be
# added to the system and stay missing from the page the agent reads.
krate-adapter-common = { path = "../adapter-common", version = "0.1.0-dev" }
tempfile = "3.27.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
ureq.workspace = true
tracing-subscriber.workspace = true

# The native consent window is macOS-only today (P3-OPEN-01). Gated by target
# so the AppKit crate never enters Linux or Windows CLI builds; those platforms
# fall back to the terminal consent prompt.
[target.'cfg(target_os = "macos")'.dependencies]
krate-adapter-macos = { path = "../adapter-macos", version = "0.1.0-dev" }

# Doctor's graphics probe: name the GPU adapter apps will draw on, or say
# plainly that they will draw on the CPU. Same crate the window presenters
# use, so doctor's answer and the real path cannot disagree.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
krate-presenter-gpu = { path = "../presenter-gpu", version = "0.1.0-dev" }

[dev-dependencies]
tempfile = "3.27.0"

# For ignoring SIGINT while a child app runs, so Ctrl-C ends the app rather
# than the menu that launched it. Unix only: Windows has no SIGINT to ignore.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The exe icon. Evaluated against the HOST, which is fine: Windows binaries
# are built on Windows runners for both x64 and arm64.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Detaching the console a double-click hands us; see detach_owned_console.
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
