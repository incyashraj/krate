[package]
name = "krate-player-android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# A cdylib: the player's NativeActivity loads this as libkrate_player.so and
# calls android_main. Its only Java is KrateActivity (android/java), for the
# answers Android gives an activity alone.
[lib]
name = "krate_player"
crate-type = ["cdylib", "rlib"]

[dependencies]
krate-manifest = { path = "../manifest" }
krate-policy = { path = "../policy" }
krate-bundle = { path = "../bundle" }

[dev-dependencies]
# The host tests hold the output card to the runtime's own argument rule.
krate-runtime = { path = "../runtime", default-features = false, features = [
    "phase2-bindings",
] }

[target.'cfg(target_os = "android")'.dependencies]
# Speech stays off: whisper.cpp on Android is its own project, and the
# player degrades the capability honestly, the same as arm64 Linux did.
krate-runtime = { path = "../runtime", default-features = false, features = [
    "phase2-bindings",
] }
krate-adapter-android = { path = "../adapter-android" }
log = "0.4"
android_logger = "0.15"
# Reading the launch intent and content:// streams from the Java side.
# android-activity fills ndk-context with the VM and activity for us.
jni = "0.21"
# Fetching a tapped krate.tech link from the hub. rustls underneath, so
# no OpenSSL cross-compilation.
ureq.workspace = true
# Krate's home screen: the hub's catalogue, and its screenshots decoded
# (the iPhone's hub code, shared).
serde_json.workspace = true
png = "0.17"
