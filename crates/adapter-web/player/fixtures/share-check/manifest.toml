[app]
id = "dev.krate.share-check"
name = "Share Check"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_share_check.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the window"
required = true

[[capabilities]]
cap = "store.shared"
rationale = "Share a shopping list with whoever has the code"
required = true

[[capabilities]]
cap = "store.secret"
rationale = "Keep a sign-in token"
required = true
