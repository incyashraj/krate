[package]
name = "krate-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
krate-manifest = { path = "../manifest" }
# Ed25519 for publisher signatures (IC-015). Same reasoning as the runtime's
# use of it for AEAD: audited, maintained, and already compiled in this tree
# through the TLS stack, so signing adds no new supply-chain surface. Signing
# is the one place where rolling our own is indefensible.
ring = "0.17"
# The signature envelope is stored as JSON inside the bundle. Only the
# envelope: the STATEMENT is never parsed from the file, it is recomputed
# from the bundle's own bytes at verify time, so a hand-written parser can
# never disagree with canonical_bytes() about what was signed.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
tempfile.workspace = true
thiserror.workspace = true
ureq.workspace = true
wasmparser.workspace = true
zip.workspace = true

[dev-dependencies]
