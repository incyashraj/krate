[package]
name = "krate-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
krate-manifest = { path = "../manifest" }
# Ed25519 for publisher signatures (IC-015). Same reasoning as the runtime's
# use of it for AEAD: audited, maintained, and already compiled in this tree
# through the TLS stack, so signing adds no new supply-chain surface. Signing
# is the one place where rolling our own is indefensible.
ring = "0.17"
# The signature envelope is stored as JSON inside the bundle. Only the
# envelope: the STATEMENT is never parsed from the file, it is recomputed
# from the bundle's own bytes at verify time, so a hand-written parser can
# never disagree with canonical_bytes() about what was signed.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
tempfile.workspace = true
thiserror.workspace = true
ureq.workspace = true
wasmparser.workspace = true
zip.workspace = true

[build-dependencies]
# The WIT digest the validator reports (IC-210). Same crate the library
# already uses for content identities.
sha2 = "0.10.9"

[dev-dependencies]
# Hand-written components for the validator's refusal matrix: a component
# importing an interface Krate never defined, or exporting nothing, cannot
# be built with cargo-component -- the SDK would not compile it -- so the
# tests write them in the text format instead. Already in the tree through
# wasmtime, so no new supply-chain surface.
wat = "1"
