[package]
name = "krate-presenter-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
# Like every other crate in this workspace. It was the one that did not say so,
# and it depends on a sibling by path, so it could not be published anyway.
publish = false

# The GPU presenter (Plan/GPU-Presenter.md): the shared placement contract
# rendered by vello on wgpu, so a Krate app on Windows feels like the same
# app on the Mac beside it. Same vello line as adapter-ios, which is the
# in-repo proof this path works; the two must move versions together.

[dependencies]
krate-adapter-common = { path = "../adapter-common" }
vello = "0.9"
parley = "0.11"
pollster = "0.4"

[dev-dependencies]
png = "0.17"
# The CPU vector path is the visual reference for text: same parley, so
# shaping is shared and only the rasterizer differs.
krate-adapter-common = { path = "../adapter-common", features = ["vector-text"] }
