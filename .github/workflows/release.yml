name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          # Missing from every release so far, and the reason is now known
          # rather than guessed at.
          #
          # It was blamed on libclang 3.8 for two releases. That was real but
          # only the first layer: rc6 installed clang 9 from LLVM's archive,
          # bindgen ran, and the build got further and then failed on
          # whisper.cpp using `if constexpr` -- C++17 -- against the container's
          # g++ 5.4, which reaches only C++14. Ubuntu 16.04 is a decade old and
          # no amount of apt fixes that.
          #
          # So speech-to-text is now optional, and this target builds without
          # it: everything else works, and one capability is missing on one
          # platform instead of the whole platform being missing.
          #
          # Still `optional: true` for this release because it cannot be
          # reproduced locally without a Docker daemon, and a release that
          # blocks on an unverified container fix helps nobody. If rc7 builds,
          # this flag comes off.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            cross: true
            optional: true
            # Everything except speech-to-text. See the note in the build step.
            no-speech: true
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          # Windows on ARM. Anybody running a Windows VM on an Apple Silicon
          # Mac gets this, which is the ordinary way to test Windows without
          # owning a Windows machine -- so it is not a niche target, it is the
          # one a reviewer is most likely to hit. The installer refused with
          # "unsupported architecture: ARM64" until this existed.
          #
          # Cross-compiled from the x86_64 runner, which the MSVC toolchain
          # supports directly; GitHub has no ARM Windows runner.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: zip
            # Same reason as arm64 Linux: whisper.cpp is built through CMake
            # and does not cross-compile to this target from the x86_64 runner.
            # Ship everything else rather than nothing.
            no-speech: true
            # No ARM Windows runner means no way to run what it builds, so
            # treat a failure as "not this release" rather than blocking the
            # other five.
            optional: true

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux audio development files
        if: matrix.os == 'ubuntu-latest' && matrix.cross != true
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build release binary
        shell: bash
        env:
          # Stamp the release tag (without the leading v) into the binary so
          # `krate --version` reports the real version rather than the crate's
          # 0.1.0-dev placeholder.
          KRATE_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # Some targets cannot build every feature. Speech compiles
          # whisper.cpp, which needs a C++17 compiler, and the arm64 Linux
          # cross container is Ubuntu 16.04 with g++ 5.4 -- C++14 only. That
          # single dependency is why that platform has been missing from every
          # release. Dropping it there ships a Krate that does everything
          # except transcribe audio, which beats shipping nothing.
          # krate-cli's only feature is `speech`, so "everything but speech" is
          # plain --no-default-features. Naming a runtime feature here instead
          # failed rc7 with "the package 'krate-cli' does not contain this
          # feature", which is why this is a boolean rather than a feature list.
          if [[ "${{ matrix.no-speech }}" == "true" ]]; then
            echo "building without speech-to-text"
            FEATURE_ARGS=(--no-default-features)
          else
            FEATURE_ARGS=()
          fi
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" -p krate-cli "${FEATURE_ARGS[@]}"
          else
            cargo build --release --target "${{ matrix.target }}" -p krate-cli "${FEATURE_ARGS[@]}"
          fi

      # Building an app needs cargo-component, and upstream publishes no
      # binaries for it -- every user compiles it from source, which is three to
      # six minutes of the wait before their first app exists. We already have a
      # cross-compiling matrix for exactly these targets, so build it once here
      # and ship it beside the runtime. A download replaces the compile.
      - name: Build cargo-component for this target
        shell: bash
        continue-on-error: true
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross install cargo-component --locked --version 0.21.1 \
              --target "${{ matrix.target }}" --root "$PWD/tooling" || exit 0
          else
            cargo install cargo-component --locked --version 0.21.1 \
              --target "${{ matrix.target }}" --root "$PWD/tooling" || exit 0
          fi
          ls -la "$PWD/tooling/bin" || true

      - name: Package
        shell: bash
        env:
          KRATE_VERSION: ${{ github.ref_name }}
        run: scripts/package.sh "${{ matrix.target }}" "${{ matrix.ext }}"

      - name: Assemble Krate.app (macOS double-click entry point)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          KRATE_VERSION: ${{ github.ref_name }}
        run: |
          # Pillow renders the app icon; ship without an icon rather than fail.
          python3 -m pip install --quiet pillow || true
          KRATE_BINARY="target/${{ matrix.target }}/release/krate"             scripts/make-macos-app.sh dist
          version="${KRATE_VERSION#v}"
          (cd dist && zip -qry "krate-app-${version}-${{ matrix.target }}.zip" Krate.app)

      # Sign and notarize, so Gatekeeper lets a downloaded build open without
      # a right-click workaround. Ad-hoc signing plus curl setting no
      # quarantine flag meant Gatekeeper never looked at all -- an install path
      # that steps around the exact guarantee Krate sells. Skipped, loudly,
      # when the secrets are absent, so a fork still builds.
      - name: Sign and notarize Krate.app
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          KRATE_VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No Apple signing secrets; shipping ad-hoc signed."
            echo "Gatekeeper will warn on download. Set APPLE_CERT_P12,"
            echo "APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID and"
            echo "APPLE_APP_PASSWORD to sign properly."
            exit 0
          fi

          # A throwaway keychain, so the runner's default one is untouched.
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN" >/dev/null
          rm -f /tmp/cert.p12

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application certificate in the p12."
            echo "An 'Apple Development' certificate is for local testing only."
            exit 1
          fi
          echo "signing with: $IDENTITY"

          # The nested CLI is signed before the bundle that contains it;
          # codesign refuses to seal a bundle whose contents change afterwards.
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" dist/Krate.app/Contents/MacOS/krate-cli
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" dist/Krate.app
          codesign --verify --deep --strict --verbose=2 dist/Krate.app

          # The bare CLI is downloaded and run directly, so it needs signing too.
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "target/${{ matrix.target }}/release/krate"

          version="${KRATE_VERSION#v}"
          zip_name="krate-app-${version}-${{ matrix.target }}.zip"
          (cd dist && rm -f "$zip_name" && zip -qry "$zip_name" Krate.app)

          xcrun notarytool submit "dist/$zip_name" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          # Staple the ticket so the app opens offline as well.
          xcrun stapler staple dist/Krate.app
          (cd dist && rm -f "$zip_name" && zip -qry "$zip_name" Krate.app)
          echo "notarized and stapled"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: krate-${{ matrix.target }}
          path: |
            dist/krate-*.${{ matrix.ext }}
            dist/krate-app-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          # Bare filenames, not build paths. Downloaded release assets sit in one
          # flat folder, so a line like `dist/krate-aarch64-apple-darwin/krate-...
          # .tar.gz` names a path that does not exist next to the download, and
          # `shasum -a 256 -c SHA256SUMS` skips every line and reports "no file
          # was verified". Compute the hashes with full paths, then strip every
          # directory so each line is `<hash>  <basename>` -- checkable by hand
          # next to the downloaded asset, which is the whole point of the file.
          # Assets from different target dirs never share a basename, so this
          # cannot make two lines collide.
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#(^[0-9a-f]+  ).*/#\1#' > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            SHA256SUMS
          generate_release_notes: true
