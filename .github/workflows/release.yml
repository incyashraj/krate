name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger, because a tag push does not always create a run.
  # v0.1.0 was tagged, the tag reached the remote, the workflow was active at
  # that tag -- and no run was ever created. A manually dispatched build on the
  # same repository started a runner immediately, so Actions and minutes were
  # both fine; the push event simply never fired. Without this the release was
  # blocked on retrying a push and hoping.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # CI is not a user. Without this every replayed app and cold-install walk
  # pings the usage endpoint -- polluting the numbers and, on 2026-08-10,
  # helping exhaust the KV quota that publishes depended on.
  KRATE_NO_USAGE: "1"
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          # Missing from every release so far, and the reason is now known
          # rather than guessed at.
          #
          # It was blamed on libclang 3.8 for two releases. That was real but
          # only the first layer: rc6 installed clang 9 from LLVM's archive,
          # bindgen ran, and the build got further and then failed on
          # whisper.cpp using `if constexpr` -- C++17 -- against the container's
          # g++ 5.4, which reaches only C++14. Ubuntu 16.04 is a decade old and
          # no amount of apt fixes that.
          #
          # So speech-to-text is now optional, and this target builds without
          # it: everything else works, and one capability is missing on one
          # platform instead of the whole platform being missing.
          #
          # Still `optional: true` for this release because it cannot be
          # reproduced locally without a Docker daemon, and a release that
          # blocks on an unverified container fix helps nobody. If rc7 builds,
          # this flag comes off.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            cross: true
            optional: true
            # Everything except speech-to-text. See the note in the build step.
            no-speech: true
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: zip
          # Windows on ARM. Anybody running a Windows VM on an Apple Silicon
          # Mac gets this, which is the ordinary way to test Windows without
          # owning a Windows machine -- so it is not a niche target, it is the
          # one a reviewer is most likely to hit. The installer refused with
          # "unsupported architecture: ARM64" until this existed.
          #
          # Cross-compiled from the x86_64 runner, which the MSVC toolchain
          # supports directly; GitHub has no ARM Windows runner.
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            ext: zip
            # Same reason as arm64 Linux: whisper.cpp is built through CMake
            # and does not cross-compile to this target from the x86_64 runner.
            # Ship everything else rather than nothing.
            no-speech: true
            # No ARM Windows runner means no way to run what it builds, so
            # treat a failure as "not this release" rather than blocking the
            # other five.
            optional: true

    steps:
      - uses: actions/checkout@v5
        with:
          # A dispatch defaults to the branch; build the tag being released.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux audio development files
        if: matrix.os == 'ubuntu-latest' && matrix.cross != true
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build release binary
        shell: bash
        env:
          # Stamp the release tag (without the leading v) into the binary so
          # `krate --version` reports the real version rather than the crate's
          # 0.1.0-dev placeholder.
          KRATE_RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          # Some targets cannot build every feature. Speech compiles
          # whisper.cpp, which needs a C++17 compiler, and the arm64 Linux
          # cross container is Ubuntu 16.04 with g++ 5.4 -- C++14 only. That
          # single dependency is why that platform has been missing from every
          # release. Dropping it there ships a Krate that does everything
          # except transcribe audio, which beats shipping nothing.
          # krate-cli's only feature is `speech`, so "everything but speech" is
          # plain --no-default-features. Naming a runtime feature here instead
          # failed rc7 with "the package 'krate-cli' does not contain this
          # feature", which is why this is a boolean rather than a feature list.
          if [[ "${{ matrix.no-speech }}" == "true" ]]; then
            echo "building without speech-to-text"
            FEATURE_ARGS=(--no-default-features)
          else
            FEATURE_ARGS=()
          fi
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" -p krate-cli "${FEATURE_ARGS[@]}"
          else
            cargo build --release --target "${{ matrix.target }}" -p krate-cli "${FEATURE_ARGS[@]}"
          fi

      # Building an app needs cargo-component, and upstream publishes no
      # binaries for it -- every user compiles it from source, which is three to
      # six minutes of the wait before their first app exists. We already have a
      # cross-compiling matrix for exactly these targets, so build it once here
      # and ship it beside the runtime. A download replaces the compile.
      - name: Build cargo-component for this target
        shell: bash
        continue-on-error: true
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross install cargo-component --locked --version 0.21.1 \
              --target "${{ matrix.target }}" --root "$PWD/tooling" || exit 0
          else
            cargo install cargo-component --locked --version 0.21.1 \
              --target "${{ matrix.target }}" --root "$PWD/tooling" || exit 0
          fi
          ls -la "$PWD/tooling/bin" || true

      # The Windows archive carries KrateDoc.ico, which Explorer draws for a
      # .krate. Generating it needs Pillow, and v0.1.0 shipped without the icon
      # because the only pip install in this workflow was in the macOS-only
      # app-bundle step -- which runs after packaging and never on Windows. The
      # package script warns and continues rather than failing, so the release
      # went out with blank-page icons and nothing stopped it.
      - name: Install Pillow (Windows document icon)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: python3 -m pip install --quiet pillow

      - name: Package
        shell: bash
        env:
          KRATE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: scripts/package.sh "${{ matrix.target }}" "${{ matrix.ext }}"

      - name: Assemble Krate.app (macOS double-click entry point)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          KRATE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          # Pillow renders the app icon; ship without an icon rather than fail.
          python3 -m pip install --quiet pillow || true
          KRATE_BINARY="target/${{ matrix.target }}/release/krate"             scripts/make-macos-app.sh dist
          version="${KRATE_VERSION#v}"
          (cd dist && zip -qry "krate-app-${version}-${{ matrix.target }}.zip" "Krate Player.app")

      # Krate Studio: the window around the engine, shipped as a .dmg so
      # someone who has never opened a terminal can drag it to Applications
      # and be finished. The engine is staged inside the bundle, so the .dmg
      # carries everything -- there is no second thing to install.
      #
      # `continue-on-error`: the studio is pre-beta and the runtime release
      # must not fail because a pre-beta GUI did. A missing .dmg makes the
      # site's studio links say "coming", which is the honest outcome.
      # Built once, universal, on the arm64 runner only.
      #
      # Two architecture-specific downloads made the visitor guess their own
      # chip, and picking wrong is silent: an Apple-silicon build simply does
      # not launch on an Intel Mac. One universal .dmg removes the decision --
      # and the wrong-download failure mode with it.
      - name: Build Krate Studio (.dmg)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          KRATE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${KRATE_VERSION#v}"
          npm install -g @tauri-apps/cli@^2
          mkdir -p studio/bin
          cp "target/${{ matrix.target }}/release/krate" studio/bin/krate
          # Build the .app only. The .dmg is made later, AFTER the real
          # Developer ID signing below, because packaging it here would seal
          # an unsigned bundle inside the thing people download.
          #
          # --no-sign: Tauri's own ad-hoc signing would have to be replaced
          # anyway, and an ad-hoc signature left in the bundle is precisely
          # what the notary service rejects.
          # Both slices are needed for a universal binary, and the engine
          # inside the bundle has to be universal too or the app is fat while
          # the thing it runs is not.
          # Stamp the release version into the bundle.
          #
          # tauri.conf.json carries 0.1.0 and never changed, so every studio
          # ever shipped reported "0.1.0" in Finder and in its own Info.plist.
          # Nobody -- including us -- could tell which build a person had,
          # which makes a remote failure report almost useless.
          python3 -c 'import json,sys,pathlib; p=pathlib.Path("studio/tauri.conf.json"); d=json.loads(p.read_text()); d["version"]=sys.argv[1]; p.write_text(json.dumps(d,indent=2)+"\n")' "$version"

          # The engine inside the bundle must be universal too, or an Intel
          # Mac installs a studio that cannot build anything.
          #
          # Each runner builds only its own target, so the x86_64 slice does
          # not exist here and has to be cross-built -- macOS compiles its own
          # other architecture natively, this is just a second cargo build.
          # `lipo -create` then fails LOUDLY if either slice is missing. The
          # earlier version fell back silently to the arm64-only copy and
          # shipped it; the release gate caught exactly that (engine archs
          # came back "arm64" on a dmg named universal).
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release -p krate-cli --target x86_64-apple-darwin
          lipo -create -output studio/bin/krate \
            "target/aarch64-apple-darwin/release/krate" \
            "target/x86_64-apple-darwin/release/krate"
          echo "engine slices: $(lipo -archs studio/bin/krate)"
          (cd studio && tauri build --bundles app --no-sign --target universal-apple-darwin)

      # Krate for Windows: the same studio, as an NSIS installer. Unsigned
      # until there is a Windows certificate, so SmartScreen warns on first
      # run -- stated on the site rather than hidden. continue-on-error for
      # the same reason as the macOS studio: pre-beta must not sink a runtime
      # release; a missing installer makes the site say "coming".
      - name: Build Krate Studio (Windows installer)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          KRATE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${KRATE_VERSION#v}"
          npm install -g @tauri-apps/cli@^2
          python3 -c 'import json,sys,pathlib; p=pathlib.Path("studio/tauri.conf.json"); d=json.loads(p.read_text()); d["version"]=sys.argv[1]; p.write_text(json.dumps(d,indent=2)+"\n")' "$version"
          mkdir -p studio/bin
          cp "target/${{ matrix.target }}/release/krate.exe" studio/bin/krate.exe
          (cd studio && tauri build --bundles nsis --target ${{ matrix.target }})
          mkdir -p dist
          src=$(find studio/target -name '*-setup.exe' -print -quit)
          if [ -n "$src" ]; then
            cp "$src" "dist/krate-studio-${version}-windows-x64-setup.exe"
          fi

      # Krate for Linux: an AppImage, the one Linux format that is a single
      # downloadable file with no package manager in the way.
      - name: Build Krate Studio (Linux AppImage)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          KRATE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${KRATE_VERSION#v}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev patchelf
          npm install -g @tauri-apps/cli@^2
          python3 -c 'import json,sys,pathlib; p=pathlib.Path("studio/tauri.conf.json"); d=json.loads(p.read_text()); d["version"]=sys.argv[1]; p.write_text(json.dumps(d,indent=2)+"\n")' "$version"
          mkdir -p studio/bin
          cp "target/${{ matrix.target }}/release/krate" studio/bin/krate
          (cd studio && tauri build --bundles appimage --target ${{ matrix.target }})
          mkdir -p dist
          src=$(find studio/target -name '*.AppImage' -print -quit)
          if [ -n "$src" ]; then
            cp "$src" "dist/krate-studio-${version}-linux-x86_64.AppImage"
          fi

      # Sign and notarize, so Gatekeeper lets a downloaded build open without
      # a right-click workaround. Ad-hoc signing plus curl setting no
      # quarantine flag meant Gatekeeper never looked at all -- an install path
      # that steps around the exact guarantee Krate sells. Skipped, loudly,
      # when the secrets are absent, so a fork still builds.
      - name: Sign and notarize Krate.app
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          KRATE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No Apple signing secrets; shipping ad-hoc signed."
            echo "Gatekeeper will warn on download. Set APPLE_CERT_P12,"
            echo "APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID and"
            echo "APPLE_APP_PASSWORD to sign properly."
            # A fork with no secrets still gets a usable studio .dmg. Ad-hoc,
            # so macOS will say it cannot verify it -- but a COHERENT ad-hoc
            # signature, which is the difference between "Apple could not
            # verify" and the "damaged, move it to the Bin" that a
            # linker-signed bundle produces.
            version="${KRATE_VERSION#v}"
            app="studio/target/universal-apple-darwin/release/bundle/macos/Krate.app"
            if [ -d "$app" ]; then
              codesign --force --sign - "$app/Contents/Resources/bin/krate" || true
              codesign --force --sign - --entitlements studio/Entitlements.plist "$app" || true
              # hdiutil, not tauri: a dmg build re-bundles the app and would
              # discard the signature applied a moment ago.
              mkdir -p dist /tmp/dmgroot
              rm -rf /tmp/dmgroot/*
              cp -R "$app" /tmp/dmgroot/
              ln -s /Applications /tmp/dmgroot/Applications
              hdiutil create -volname "Krate" -srcfolder /tmp/dmgroot \
                -ov -format UDZO "dist/krate-studio-${version}-${{ matrix.target }}.dmg" || true
            fi
            exit 0
          fi

          # A throwaway keychain, so the runner's default one is untouched.
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN" >/dev/null
          rm -f /tmp/cert.p12

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application certificate in the p12."
            echo "An 'Apple Development' certificate is for local testing only."
            exit 1
          fi
          echo "signing with: $IDENTITY"

          # Every executable inside the bundle, innermost first: codesign
          # refuses to seal a bundle whose contents change afterwards.
          #
          # There are two. The launcher `Krate` is a shell script that execs
          # `krate-cli`, and signing only the latter is why notarization came
          # back Invalid with "not signed with a valid Developer ID
          # certificate" -- the notary service checks every Mach-O and script
          # in Contents/MacOS, not just the one named in the plist.
          # --entitlements is not optional here. Hardened runtime forbids
          # writable-executable memory, and wasmtime JIT-compiles every
          # component it runs, so a signed-but-unentitled build is killed by
          # the kernel the moment somebody opens an app:
          #
          #     SIGKILL (Code Signature Invalid)
          #     CODESIGNING / Invalid Page
          #
          # It passes spctl, passes notarization, and crashes on every launch
          # -- silently, because a double-clicked app has no terminal.
          ENTITLEMENTS=scripts/krate.entitlements
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$IDENTITY" "dist/Krate Player.app/Contents/MacOS/krate-cli"
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "dist/Krate Player.app/Contents/MacOS/Krate"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$IDENTITY" "dist/Krate Player.app"
          codesign --verify --deep --strict --verbose=2 "dist/Krate Player.app"

          # Fail here rather than after a notarization round trip. An ad-hoc
          # signature left anywhere inside the bundle is exactly what the
          # notary service rejects, and it costs minutes to find out that way.
          for exe in "dist/Krate Player.app/Contents/MacOS/"*; do
            if codesign -dvvv "$exe" 2>&1 | grep -q "adhoc"; then
              echo "::error::$exe is still ad-hoc signed; notarization would fail."
              exit 1
            fi
          done

          # Krate Studio, signed with the same Developer ID.
          #
          # It was shipping ad-hoc signed, which is why a downloaded copy was
          # called "damaged" and then, once that was fixed, still refused with
          # "Apple could not verify". There was never a missing certificate --
          # this project has had a Developer ID all along and the runtime is
          # notarized with it. The studio simply was not being given it.
          #
          # Same entitlements as the runtime: the studio spawns the engine,
          # which JIT-compiles every component, and hardened runtime without
          # the JIT entitlements is what killed double-clicked apps in K-063.
          STUDIO_APP="studio/target/universal-apple-darwin/release/bundle/macos/Krate.app"
          if [ -d "$STUDIO_APP" ]; then
            codesign --force --options runtime --timestamp \
              --entitlements "$ENTITLEMENTS" \
              --sign "$IDENTITY" "$STUDIO_APP/Contents/Resources/bin/krate"
            codesign --force --options runtime --timestamp \
              --entitlements studio/Entitlements.plist \
              --sign "$IDENTITY" "$STUDIO_APP"
            codesign --verify --deep --strict --verbose=2 "$STUDIO_APP"
          fi

          # The bare CLI is downloaded and run directly, so it needs signing too
          # -- and it JITs exactly like the one in the bundle, so it needs the
          # same entitlements. `--options runtime` without them is the precise
          # combination that made a double-clicked Krate.app die with
          # "Code Signature Invalid" (K-063); the only reason nobody hit it here
          # first is that the bundle is what people open.
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$IDENTITY" "target/${{ matrix.target }}/release/krate"

          # Repack the CLI tarball. Package ran before this step, so the
          # tarball in dist/ still carries the unsigned binary -- v0.1.2
          # shipped exactly that way (K-068): the signing above was applied
          # to a file nothing ever read again. package.sh only rebuilds its
          # own directory, so Krate.app in dist/ is untouched.
          bash scripts/package.sh "${{ matrix.target }}" tar.gz

          version="${KRATE_VERSION#v}"
          zip_name="krate-app-${version}-${{ matrix.target }}.zip"
          (cd dist && rm -f "$zip_name" && zip -qry "$zip_name" "Krate Player.app")

          # Notarization is the step most likely to fail on credentials, and
          # its 401 says nothing about which of the three is wrong. Signing has
          # already succeeded by this point, so a failure here should not throw
          # away a working signed build -- warn, ship signed, and say exactly
          # what to check.
          # Trim whitespace. The same credentials that authenticate from a
          # terminal returned 401 from CI, and the difference between a
          # working value and a broken one is usually a newline picked up
          # when the secret was pasted -- invisible in the GitHub UI and
          # impossible to spot in a log, since the value is masked.
          APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '[:space:]')"
          APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          APPLE_APP_PASSWORD="$(printf '%s' "$APPLE_APP_PASSWORD" | tr -d '[:space:]')"

          # Report the shapes, never the values. An app-specific password is
          # always 19 characters as xxxx-xxxx-xxxx-xxxx, and a team id is
          # always 10, so a wrong length localises the problem immediately
          # without printing a secret.
          echo "apple-id length: ${#APPLE_ID}, team-id length: ${#APPLE_TEAM_ID}," \
               "password length: ${#APPLE_APP_PASSWORD} (expect 19)"

          if ! xcrun notarytool submit "dist/$zip_name" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait; then
            echo "::warning::Notarization failed. The build is signed but not"
            echo "notarized, so Gatekeeper will still warn on download."
            echo ""
            echo "A 401 here does NOT always mean the credentials are wrong."
            echo "The most common cause with correct credentials is an"
            echo "unaccepted agreement: after creating a Developer ID"
            echo "certificate, Apple requires the updated Developer Program"
            echo "License Agreement to be accepted before the notary service"
            echo "will authenticate you. Until then it answers 401."
            echo ""
            echo "Check, in order:"
            echo "  1. developer.apple.com/account -- accept any pending"
            echo "     agreement banner, then re-run this release."
            echo "  2. APPLE_ID is the Apple ID email, not a username."
            echo "  3. APPLE_APP_PASSWORD is app-specific, xxxx-xxxx-xxxx-xxxx,"
            echo "     generated at appleid.apple.com, not the account password."
            echo "  4. APPLE_TEAM_ID matches the certificate: run"
            echo "     security find-identity -v -p codesigning"
            exit 0
          fi
          # Staple the ticket so the app opens offline as well.
          xcrun stapler staple "dist/Krate Player.app" || true
          (cd dist && rm -f "$zip_name" && zip -qry "$zip_name" "Krate Player.app")
          echo "notarized and stapled"

          # Krate Studio: notarize the signed bundle, then package the .dmg
          # around it. This order matters -- a .dmg built before notarization
          # carries an un-stapled app, and the person who downloads it is
          # stopped by Gatekeeper exactly as if it were never notarized.
          if [ -d "$STUDIO_APP" ]; then
            studio_zip="krate-studio-${version}-universal.zip"
            (cd "$(dirname "$STUDIO_APP")" && zip -qry "/tmp/$studio_zip" "Krate.app")
            if xcrun notarytool submit "/tmp/$studio_zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait; then
              xcrun stapler staple "$STUDIO_APP" || true
              echo "studio notarized and stapled"
            else
              echo "::warning::Studio notarization failed; it is signed but"
              echo "Gatekeeper will still warn. The runtime is unaffected."
            fi
            # The .dmg, built by hand from the signed and stapled bundle.
            #
            # NOT `tauri build --bundles dmg`: that re-runs the app bundling
            # and overwrites the bundle, throwing away the Developer ID
            # signature and the notarization ticket that were just applied.
            # Measured -- the notary service returned Accepted, the staple
            # succeeded, and the .dmg still contained an unsigned rebuild that
            # macOS called damaged. hdiutil packages what is actually there.
            mkdir -p dist
            out="dist/krate-studio-${version}-universal.dmg"
            bash scripts/make-styled-dmg.sh "$STUDIO_APP" "Krate" "$out"
            # Sign the disk image, then notarize the IMAGE and staple the
            # ticket to it.
            #
            # Stapling a .dmg that was never itself submitted fails with
            # "Record not found ... The staple and validate action failed!
            # Error 65" -- the app inside was notarized, but a ticket belongs
            # to the thing that was submitted, and the disk image is a
            # separate artifact. The app is already stapled, so this is
            # belt-and-braces: it lets Gatekeeper clear the image before it is
            # even mounted.
            codesign --force --timestamp --sign "$IDENTITY" "$out" || true
            if xcrun notarytool submit "$out" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait; then
              xcrun stapler staple "$out" || true
            else
              echo "::warning::the .dmg itself was not notarized; the app"
              echo "inside it is, so it still opens."
            fi
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: krate-${{ matrix.target }}
          path: |
            dist/krate-*.${{ matrix.ext }}
            dist/krate-app-*.zip
            dist/krate-studio-*.dmg
            dist/krate-studio-*.exe
            dist/krate-studio-*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          # Bare filenames, not build paths. Downloaded release assets sit in one
          # flat folder, so a line like `dist/krate-aarch64-apple-darwin/krate-...
          # .tar.gz` names a path that does not exist next to the download, and
          # `shasum -a 256 -c SHA256SUMS` skips every line and reports "no file
          # was verified". Compute the hashes with full paths, then strip every
          # directory so each line is `<hash>  <basename>` -- checkable by hand
          # next to the downloaded asset, which is the whole point of the file.
          # Assets from different target dirs never share a basename, so this
          # cannot make two lines collide.
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#(^[0-9a-f]+  ).*/#\1#' > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly: on a manual dispatch github.ref_name is the
          # branch, so the release would be created against `main` rather than
          # the tag being published.
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-rc') }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            SHA256SUMS
          generate_release_notes: true

  # ---------------------------------------------------------------- the gate
  #
  # Every release defect this project has shipped got through because the
  # thing verified was the build, not the download: K-058 (no Windows icon in
  # the zip), K-063 (bundle signed without the JIT entitlement, so every
  # double-click died), K-068 (the tarball packaged before signing ran, so
  # the signed binary was never in it). All three were found by a person
  # afterwards, and all three are checkable in seconds against the published
  # asset.
  #
  # So: after publishing, download what the public downloads and behave like
  # somebody who just got it. A failure here does not unpublish anything --
  # it cannot, the assets are already up -- but it turns a silent bad release
  # into a loud one, before anybody is told to install it.
  verify:
    name: Verify the published assets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          version="${TAG#v}"
          case "${{ matrix.target }}" in
            *windows*) archive="krate-${version}-${{ matrix.target }}.zip" ;;
            *)         archive="krate-${version}-${{ matrix.target }}.tar.gz" ;;
          esac
          gh release download "$TAG" -R "${{ github.repository }}" \
            -p "$archive" -p SHA256SUMS
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: The checksum a careful person would check
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          if command -v shasum >/dev/null; then
            shasum -a 256 -c SHA256SUMS --ignore-missing
          else
            grep " $archive\$" SHA256SUMS | sha256sum -c -
          fi

      - name: Unpack, and prove the binary is the version on the tin
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd verify
          case "$archive" in
            # -j flattens, because releases up to v0.1.3 were zipped by
            # Compress-Archive, which writes backslash separators the ZIP
            # spec forbids (K-074). Flattening makes this step test the
            # binary rather than trip over the layout; the layout itself is
            # checked separately below, so the defect is still caught.
            # `|| true` because unzip exits 1 on the backslash *warning*
            # even though extraction succeeded -- with set -e that killed
            # this step and hid every check after it. The extraction is
            # verified by the ls below instead of by the exit code.
            *.zip) unzip -q -j "$archive" -d unpacked || true ;;
            *)     tar xzf "$archive" ;;
          esac
          case "$archive" in
            *.zip) dir="unpacked" ;;
            *)     dir="krate-${TAG#v}-${{ matrix.target }}" ;;
          esac
          # unzip's exit code is untrustworthy here, so confirm the unpack
          # by looking at what it produced.
          test -d "$dir" || { echo "::error::archive did not unpack"; exit 1; }
          ls "$dir"
          case "${{ matrix.target }}" in
            *windows*) bin="$dir/krate.exe" ;;
            *)         bin="$dir/krate" ;;
          esac
          # A stale binary in a fresh archive is the failure that shipped
          # twice by hand; compare content, never timestamps.
          reported="$("$bin" --version)"
          echo "reported: $reported"
          case "$reported" in
            *"${TAG#v}"*) ;;
            *) echo "::error::published binary reports '$reported', tag is $TAG"; exit 1 ;;
          esac
          echo "bin=$bin" >> "$GITHUB_ENV"

      - name: The archive unpacks into a folder, not backslash-named files
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          case "$archive" in
            *.zip) ;;
            *) echo "not a zip, nothing to check"; exit 0 ;;
          esac
          # ZIP entry names must use forward slashes (APPNOTE 4.4.17).
          # Compress-Archive writes backslashes: Explorer copes, every
          # spec-compliant tool extracts a pile of backslash-named files
          # with no folder. Every Windows release through v0.1.3 shipped
          # that way, and nothing noticed until this gate existed.
          python3 - "$archive" <<'PY'
          import sys, zipfile
          bad = [n for n in zipfile.ZipFile(sys.argv[1]).namelist() if "\\" in n]
          if bad:
              print("::error::zip entries use backslash separators; "
                    "spec-compliant tools mis-extract this archive")
              for n in bad[:5]:
                  print("  " + n)
              sys.exit(1)
          print("entry names use forward slashes")
          PY

      - name: cargo-component ships beside it
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          dir="$(dirname "$bin")"
          # Without this the first app somebody makes compiles 378 crates
          # first. It has silently gone missing on Windows before.
          ls "$dir" | grep -i cargo-component \
            || { echo "::error::cargo-component missing from the archive"; exit 1; }

      - name: The Windows document icon (K-058 shipped without it)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          dir="$(dirname "$bin")"
          ls "$dir" | grep -i 'KrateDoc.ico' \
            || { echo "::error::KrateDoc.ico missing -- .krate files get no icon"; exit 1; }
          ls "$dir" | grep -i 'krate-open.exe' \
            || { echo "::error::krate-open.exe missing -- double-click flashes a console"; exit 1; }

      - name: macOS signing, entitlements, and Gatekeeper (K-063, K-068)
        if: contains(matrix.target, 'apple')
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # This step downloads the app bundle with gh, and gh without a
          # token is an anonymous API caller on a shared runner address --
          # which is how the v0.1.5 gate failed with "rate limit exceeded"
          # while every signature it exists to check was fine. A gate that
          # fails for the wrong reason teaches nothing (the unzip lesson,
          # again). Every step in this job that runs gh carries the token.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd verify
          # The bare CLI: signed, hardened, and entitled. It JITs, so
          # `--options runtime` without allow-jit is the combination the
          # kernel kills on launch.
          if codesign -dvv "$bin" 2>&1 | grep -q adhoc; then
            echo "::error::the published CLI is ad-hoc signed, not Developer ID"; exit 1
          fi
          codesign -d --entitlements - "$bin" 2>&1 | grep -q allow-jit \
            || { echo "::error::published CLI has no allow-jit entitlement"; exit 1; }

          # The app bundle: the thing a double-click actually runs.
          gh release download "$TAG" -R "${{ github.repository }}" \
            -p "krate-app-${TAG#v}-${{ matrix.target }}.zip"
          unzip -q "krate-app-${TAG#v}-${{ matrix.target }}.zip"
          codesign -d --entitlements - "Krate Player.app/Contents/MacOS/krate-cli" 2>&1 \
            | grep -q allow-jit \
            || { echo "::error::the player has no allow-jit -- double-click will die"; exit 1; }
          spctl --assess --type execute -v "Krate Player.app"

      # Krate Studio, checked on the published .dmg -- the file a person
      # actually downloads, not the bundle the build produced.
      #
      # This gate exists because all three faults that made the studio
      # unusable were invisible to every check we had: they were in the
      # handover from build to download. A real person got "Krate is damaged
      # and can't be opened", and nothing in CI noticed.
      - name: The studio .dmg installs and opens (the download, not the build)
        if: contains(matrix.target, 'apple')
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd verify
          dmg="krate-studio-${TAG#v}-universal.dmg"
          if ! gh release download "$TAG" -R "${{ github.repository }}" -p "$dmg"; then
            echo "::warning::no studio .dmg in this release; skipping"
            exit 0
          fi

          # Quarantine, as every browser sets on a download. Without this the
          # test is easier than reality and proves nothing -- the "damaged"
          # failure only appears on a quarantined copy.
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "$dmg"

          mp="$(hdiutil attach "$dmg" -nobrowse | tail -1 | sed 's/^.*\(\/Volumes\/.*\)$/\1/')"
          app="$mp/Krate.app"
          test -d "$app" || { echo "::error::no 'Krate.app' in the dmg"; hdiutil detach "$mp"; exit 1; }

          # 1. The signature must be COHERENT. A linker-signed bundle claims
          #    no resources, and once the engine and icon are inside, macOS
          #    calls the whole thing damaged.
          if ! codesign --verify --strict --verbose=2 "$app" 2>&1; then
            echo "::error::the studio signature is not coherent -- macOS will call it damaged"
            hdiutil detach "$mp"; exit 1
          fi

          # 2. The engine must be inside. Without it the studio installs
          #    cleanly and cannot build anything.
          test -f "$app/Contents/Resources/bin/krate" \
            || { echo "::error::the studio ships no engine"; hdiutil detach "$mp"; exit 1; }

          # 3. It MUST claim .krate. Krate is the one app now -- it makes
          #    apps and it opens them -- so a bundle that does not declare the
          #    type ships a machine where double-clicking a .krate does
          #    nothing. (This check used to assert the opposite, when the
          #    opener was a separate app; the gate has to follow the design.)
          if ! plutil -p "$app/Contents/Info.plist" | grep -q CFBundleDocumentTypes; then
            echo "::error::Krate.app does not claim .krate; double-click would be dead"
            hdiutil detach "$mp"; exit 1
          fi

          # 4. It must not be named Krate.app, or it replaces the runtime in
          #    /Applications.
          if [ -d "$mp/Krate Studio.app" ]; then
            echo "::error::an old-name bundle is in the dmg"
            hdiutil detach "$mp"; exit 1
          fi

          # Universal in fact, not only in the filename. A single-slice build
          # published under this name would silently fail to launch for
          # everyone on the other architecture -- which is exactly the failure
          # that is impossible to debug remotely.
          # The executable's file name comes from the crate (krate-studio),
          # not the product name -- read it from the plist rather than
          # guessing, which is what made this check fail with "archs: " on a
          # bundle that was actually universal.
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          for bin in "$exe" "$app/Contents/Resources/bin/krate"; do
            archs="$(lipo -archs "$bin" 2>/dev/null || echo '')"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$bin is not universal (archs: $archs)"; hdiutil detach "$mp"; exit 1 ;;
            esac
          done

          echo "studio dmg: signature coherent, engine present, no type collision, universal"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Signature|flags" || true
          hdiutil detach "$mp" >/dev/null

      - name: Build an app with the published binary, and run it headless
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          # The whole product in one line: the published runtime packs a real
          # example and paints a frame with it. Uses the repo's own example so
          # this needs no AI and no network beyond the download above.
          "$bin" check-app ../apps/krate-bounce --no-run \
            || { echo "::error::the published binary cannot build an app"; exit 1; }

      - name: The permission wall still refuses without grants
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          set +e
          out="$("$bin" run --headless https://krate.tech/notes.krate 2>&1)"
          code=$?
          set -e
          # 5 is "refused for want of permission". A release that opens an
          # app without asking is the worst possible regression, so it is
          # checked on the shipped artifact, not only in unit tests.
          if [ "$code" -ne 5 ]; then
            echo "::error::expected exit 5 without grants, got $code: $out"; exit 1
          fi
          case "$out" in
            *"needs permission"*) ;;
            *) echo "::error::the refusal did not explain itself: $out"; exit 1 ;;
          esac
