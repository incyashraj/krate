name: Fuzz Nightly

# Runs on GitHub's own Linux machines since 2026-11-15 (K-1269). The file
# keeps its old name because ci.yml's freshness check and
# scripts/release-decision.py read this workflow's history by file name.
#
# It used to run on the founder's laptop (the krate-local runner), and the
# laptop was the failure every time: asleep on battery mid-fuzz in July,
# its registration deleted by GitHub after days offline in June and again
# in November, and a closed lid on 2026-11-15 at 10:12 IST -- caffeinate -i
# stops idle sleep, not clamshell sleep -- so GitHub dropped the job ten
# minutes later. No nightly passed from 2026-11-08 on. A public repository
# runs on hosted machines at no cost, and a hosted machine does not sleep.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      fuzz_max_total_time:
        description: Per-target fuzz duration in seconds
        required: false
        type: string
        default: "2400"
      seed_corpus:
        description: Once only -- copy the corpus the laptop runner kept into the cache, and fuzz nothing
        required: false
        type: boolean
        default: false

concurrency:
  group: self-hosted-fuzz-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The campaign so far (730 MB, 187k inputs) lives in ~/krate-fuzz-corpus
  # on the laptop. Run once, from main, while the laptop is awake: it puts
  # that corpus in the cache the nightly restores from, so the move to a
  # hosted machine continues the campaign instead of starting it again.
  seed-corpus:
    name: Seed the corpus from the laptop
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_corpus }}
    runs-on: [self-hosted, krate-local]
    timeout-minutes: 60
    steps:
      - name: Copy the kept corpus into place
        shell: bash
        run: |
          mkdir -p fuzz/corpus
          cp -R "$HOME/krate-fuzz-corpus/." fuzz/corpus/
          for d in fuzz/corpus/*/; do
            echo "seeding $(ls "$d" | wc -l | tr -d ' ') inputs from $d"
          done
      - name: Save it to the cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

  fuzz-nightly:
    name: Fuzz nightly
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.seed_corpus) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Four targets at 2400 s is 2 h 40 m of fuzzing, well inside the
    # 360-minute ceiling. The corpus carries over, so each night continues
    # the campaign rather than repeating it.
    env:
      KRATE_FUZZ_MAX_TOTAL_TIME: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_max_total_time || '2400' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3920daf79df8fb8df1dbef6e64563e2901a73745 # 1.91.1
        with:
          targets: wasm32-wasip1

      - name: Install fuzz tools
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked

      # A campaign is the corpus (K-244): without it every night explores
      # from scratch. The newest saved corpus is restored by prefix, and
      # tonight's is saved under its own key at the end, so a night that
      # dies halfway still leaves yesterday's corpus to start from.
      - name: Restore the corpus
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Count the corpus
        shell: bash
        run: |
          mkdir -p fuzz/corpus
          for d in fuzz/corpus/*/; do
            [ -d "$d" ] && echo "restored $(ls "$d" | wc -l | tr -d ' ') inputs into $d"
          done || true

      # The network is only needed here; the fuzz itself then runs offline.
      - name: Fetch dependencies (with retries), then go offline
        env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "120"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --manifest-path fuzz/Cargo.toml --locked; then
              exit 0
            fi
            echo "fetch attempt $attempt failed; waiting before retrying"
            sleep 30
          done
          echo "::error::could not fetch fuzz dependencies after 3 attempts"
          exit 1

      - name: Run fuzz targets
        env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_NET_OFFLINE: "true"
        run: scripts/run-phase2-fuzz-smoke.sh

      # What tonight's run learned, so tomorrow starts where tonight stopped.
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      # The campaign's evidence: per-target logs and the corpus counts, kept
      # with the run rather than lost with the terminal (IC-163).
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-nightly-evidence
          path: target/fuzz-nightly/
          if-no-files-found: warn

      # Any crash cargo-fuzz wrote is the single most valuable output of the
      # whole night. Kept even when -- especially when -- the job fails.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
