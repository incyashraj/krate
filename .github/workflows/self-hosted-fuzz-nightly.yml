name: Self-hosted Fuzz Nightly

on:
  # Schedule restored 2026-07-02: the krate-local runner is re-registered and
  # now runs as a LaunchAgent service, so it survives reboots.
  # (It had been offline since 2026-06-24 because it only ran in a foreground
  # terminal; GitHub then deleted the stale registration.)
  # Moved 2026-07-20 from 02:00Z: the runner is a laptop, and 02:00Z is
  # mid-morning Singapore where it was repeatedly asleep on battery, which
  # cancelled runs mid-fuzz. 13:00Z = 21:00 SGT, when the machine is
  # reliably awake; the fuzz step also holds it awake via caffeinate.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      fuzz_max_total_time:
        description: Per-target fuzz duration in seconds
        required: false
        type: string
        default: "4800"

concurrency:
  group: self-hosted-fuzz-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fuzz-nightly:
    name: Fuzz nightly
    runs-on: [self-hosted, krate-local]
    timeout-minutes: 360
    env:
      KRATE_FUZZ_MAX_TOTAL_TIME: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_max_total_time || '4800' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3920daf79df8fb8df1dbef6e64563e2901a73745 # 1.91.1
        with:
          targets: wasm32-wasip1

      - name: Install fuzz tools
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install cargo-fuzz --locked
          fi
          if ! rustup toolchain list | grep -q "^nightly"; then
            rustup toolchain install nightly --profile minimal
          fi

      # The corpus lives OUTSIDE the workspace. actions/checkout defaults to
      # clean=true (git clean -ffdx), which deleted the untracked fuzz/corpus
      # directory on every nightly checkout -- so ten weeks of "nightly
      # fuzzing" explored from scratch every night (K-244). A campaign is the
      # corpus; without it this was a smoke test wearing a campaign's name.
      - name: Restore the corpus
        shell: bash
        run: |
          mkdir -p "$HOME/krate-fuzz-corpus"
          mkdir -p fuzz/corpus
          cp -R "$HOME/krate-fuzz-corpus/." fuzz/corpus/ 2>/dev/null || true
          for d in fuzz/corpus/*/; do
            [ -d "$d" ] && echo "restored $(ls "$d" | wc -l | tr -d ' ') inputs into $d"
          done || true

      # The network is only needed here. Five straight nightlies died on
      # "transfer too slow" from this machine to crates.io before a single
      # input ran (K-244) -- so the fetch retries hard, and the fuzz itself
      # then runs offline, where a flaky network cannot reach it.
      - name: Fetch dependencies (with retries), then go offline
        env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "120"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --manifest-path fuzz/Cargo.toml --locked; then
              exit 0
            fi
            echo "fetch attempt $attempt failed; waiting before retrying"
            sleep 30
          done
          echo "::error::could not fetch fuzz dependencies after 3 attempts"
          exit 1

      - name: Run fuzz targets
        env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_NET_OFFLINE: "true"
        # caffeinate -i keeps this macOS laptop from idle-sleeping mid-fuzz
        # (the exact failure mode of the 2026-07-19/20 cancelled runs).
        run: caffeinate -i scripts/run-phase2-fuzz-smoke.sh

      # What tonight's run learned goes back outside the workspace, so
      # tomorrow starts where tonight stopped.
      - name: Save the corpus
        if: always()
        shell: bash
        run: |
          mkdir -p "$HOME/krate-fuzz-corpus"
          [ -d fuzz/corpus ] && cp -R fuzz/corpus/. "$HOME/krate-fuzz-corpus/" || true

      # The campaign's evidence: per-target logs and the corpus counts, kept
      # with the run rather than lost with the terminal (IC-163).
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-nightly-evidence
          path: target/fuzz-nightly/
          if-no-files-found: warn

      # Any crash cargo-fuzz wrote is the single most valuable output of the
      # whole night. Kept even when -- especially when -- the job fails.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
