name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # Every source the site is assembled from. Missing one means editing that
      # page changes nothing on the live site and nothing says so -- which is
      # exactly what happened to docs/open and docs/cloud.
      - "docs/book/**"
      - "docs/landing/**"
      - "docs/open/**"
      - "docs/cloud/**"
      - "docs/pages/**"
      - "docs/answers/**"
      # The Krate Mode prompt, served at the site root. Without this a
      # regenerated prompt would sit in the repo while the live URL kept
      # handing models the old API.
      - "docs/krate-mode.md"
      - "scripts/build-store.sh"
      - "scripts/store-listing.py"
      - "scripts/build-answer-pages.py"
      - "scripts/fingerprint-css.py"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      # The site build runs `krate` to read each bundle's listing, so a change
      # to the CLI can break the deploy without touching a single page. That
      # is not hypothetical: a first-run notice printed into the JSON the
      # build parses, the deploy failed, and no page had changed.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install Linux audio development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Install mdBook
        run: |
          mkdir -p ~/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory ~/bin
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Build docs
        run: mdbook build docs/book
      - name: Assemble site — landing page at root, docs under /docs/
        run: |
          # The published site root is the landing page; the mdBook lives at
          # /docs/ (its site-url is set to /docs/ to match). Assemble both
          # into one directory to upload.
          rm -rf _site
          mkdir -p _site
          cp docs/landing/index.html _site/index.html
          cp docs/landing/krate.css _site/krate.css
          # One page per question people actually search, generated from one
          # template so they cannot drift the way four copies of a stylesheet did.
          python3 scripts/build-answer-pages.py
          cp docs/answers/*.html _site/
          cp docs/landing/faq.html _site/faq.html
          # Publish an app from the browser: sign in, attach a .krate, go.
          mkdir -p _site/publish _site/contact
          cp docs/landing/publish/index.html _site/publish/index.html
          # Where to report a bug or ask a question, all of it in the open.
          cp docs/landing/contact/index.html _site/contact/index.html
          # Regenerated on every deploy so the published numbers are the
          # repository's, not whatever was true when someone last edited HTML.
          python3 scripts/build-progress-page.py
          mkdir -p _site/progress
          cp docs/landing/progress.html _site/progress/index.html
          python3 scripts/build-reports-page.py
          mkdir -p _site/reports
          cp docs/landing/reports.html _site/reports/index.html
          cp docs/landing/*.png _site/
          # Screenshots of the real apps the AI built, shown on the
          # make-an-app-with-AI page (which references them at /app-shots/).
          mkdir -p _site/app-shots
          cp docs/landing/app-shots/*.png _site/app-shots/ 2>/dev/null || true
          cp -R docs/book/book _site/docs
          # Standalone doc pages that the landing page links to at
          # /docs/pages/: build-an-app (the "I want to build one" destination,
          # MCP first), make-an-app-with-AI (the command builder), and
          # krate-mode (the paste-in prompt). The glob copies all of them, so a
          # new page here needs no change to this step -- but it does need
          # docs/pages/** to stay in the paths: trigger above, or editing it
          # changes nothing on the live site. Copied after the book so the book
          # output does not clobber the pages dir. Without this the link from
          # the landing page 404s.
          #
          # These pages reference the logo at /krate-glyph-blue.png and the
          # favicon at /krate-favicon.png; both land at the site root via the
          # `cp docs/landing/*.png _site/` step above.
          mkdir -p _site/docs/pages
          cp docs/pages/*.html _site/docs/pages/ 2>/dev/null || true
          # Krate Mode: the paste-in prompt, served from the site root so the
          # copy button on /docs/pages/krate-mode.html can fetch it same-origin
          # and so the download link is a short, retypable URL. Generated from
          # the Krate source and checked in; a CLI test fails if it goes stale.
          cp docs/krate-mode.md _site/krate-mode.md
          # The custom domain lives in the built artifact, not in the branch, so
          # it has to be copied on every deploy. Without it Pages forgets the
          # domain and krate.tech stops resolving to this site.
          cp docs/landing/CNAME _site/CNAME
          # Crawlers only read robots.txt and sitemap.xml from the site root.
          # mdBook emits them under /docs/, where nothing looks for them, and
          # robots.txt itself advertises the sitemap at the root -- so without
          # this copy that link is a 404 and the sitemap goes unread.
          cp docs/book/book/robots.txt _site/robots.txt
          cp docs/book/book/sitemap.xml _site/sitemap.xml
          # Serve the installers from the domain, so the command someone pastes
          # into a terminal is `curl -fsSL https://krate.tech/install.sh | sh`
          # rather than a raw.githubusercontent URL with a branch name in it.
          # Same file either way; the short one is the one people can retype.
          # The app the installer tells a new person to open. Served from the
          # domain so the first command is short: krate.tech/notes.krate
          #
          # Always the published release, never a local copy: a stale file here
          # is the first thing a new person would run, and an old bundle fails
          # to instantiate against the current runtime.
          curl -fsSL -o _site/notes.krate \
            https://github.com/incyashraj/krate/releases/download/notes-v0.1.0/notes.krate
          # Every other app, straight from the repository, so `krate run
          # krate.tech/cubes.krate` works the same way notes does. These are the
          # same bundles the nightly replay runs on all three systems, so a file
          # served here is one that is known to work rather than one that was
          # built once and forgotten.
          #
          # The 3D app is the point of this: somebody who has just installed
          # Krate can see a lit, textured, spinning scene render on the CPU in
          # one command, without downloading anything first.
          for bundle in evidence/ported/*.krate; do
            cp "$bundle" "_site/$(basename "$bundle")"
          done
          # The curated store apps -- the polished, usable ones a person would
          # actually download and run (notes, checklist, paint, a couple of
          # games), packed by scripts/pack-store-apps.sh and committed like the
          # ported bundles. They join the same store shelf below.
          for bundle in evidence/store/*.krate; do
            cp "$bundle" "_site/$(basename "$bundle")"
          done
          # Krate Cloud, served under /cloud/. Listings are generated from the
          # .krate files themselves, so a listing cannot describe an app
          # differently from what the file actually asks for.
          # The page a non-technical person lands on after "I received one".
          mkdir -p _site/open
          cp docs/open/index.html _site/open/index.html
          mkdir -p _site/cloud _site/cloud/app
          cp docs/cloud/index.html _site/cloud/index.html
          # One page per app, filled in from the hub by its id.
          cp docs/cloud/app/index.html _site/cloud/app/index.html
          cp docs/landing/*.png _site/cloud/ 2>/dev/null || true
          # The store card thumbnails: each GUI app's rendered first frame, so a
          # card shows what the app looks like instead of a bare icon. CLI apps
          # (no window) have no shot and fall back to a lettered tile in the page.
          mkdir -p _site/cloud/shots
          cp docs/cloud/shots/*.png _site/cloud/shots/ 2>/dev/null || true
          # Built from this commit, not from the last release: the store shows
          # each app's content identity, and that only exists in builds after
          # rc4. An older binary silently produced an empty shelf.
          #
          # eo2, mdview, and savings now ship as rebuilt krate-* store apps
          # with modern canvas UIs; their old ported bundles stay served (the
          # nightly replay and short URLs depend on them) but are left off the
          # shelf so the store does not list the same app twice.
          cargo build --release -p krate-cli
          shelf_bundles=""
          for b in _site/*.krate; do
            case "$(basename "$b")" in
              eo2.krate|mdview.krate|savings.krate|notes.krate) ;;
              *) shelf_bundles="$shelf_bundles $b" ;;
            esac
          done
          KRATE_BIN=target/release/krate \
            sh scripts/build-store.sh _site/cloud $shelf_bundles
          cp scripts/install.sh _site/install.sh
          cp scripts/install.ps1 _site/install.ps1
          # A trailing-slash-free alias, so `krate.tech/install` works too.
          cp scripts/install.sh _site/install
          # Last, once every page is in place: name the stylesheet after a hash
          # of its contents and repoint every reference at it. Pages serves CSS
          # with max-age=600, so a deploy that changed the stylesheet shipped
          # new HTML against whatever copy the visitor already had -- the page
          # rendered unstyled and nothing on the server was wrong.
          python3 scripts/fingerprint-css.py _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub's Pages backend intermittently fails deployments server-side
      # ("Deployment failed, try again later") — observed three times on
      # 2026-07-03 with an identical artifact succeeding in between. Wait and
      # retry once before failing the workflow.
      - name: Wait before retrying a flaky Pages deployment
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 90
      - name: Retry Pages deployment
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
