# Write the adoption numbers into the repository once a week.
#
# Cloudflare's Analytics Engine keeps 90 days and a dashboard only ever shows
# what is true now. Outreach needs the shape of the line over months -- what
# the numbers were when the first conversations started, and what they are
# now -- and that record only exists if something writes it down on a
# schedule. This is that something.
#
# Runs on Mondays so a week's row lands at the same point each week, and can
# be triggered by hand before a conversation where the current number
# matters.

name: Record adoption numbers

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    name: Snapshot the numbers into evidence/adoption
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Read the hub and append a row
        run: bash scripts/record-adoption.sh

      - name: Open a pull request with the new row
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- evidence/adoption/history.tsv; then
            echo "no change since the last run"
            exit 0
          fi
          # main requires a pull request, so this cannot push directly --
          # a direct push is rejected with "Changes must be made through a
          # pull request", which is how the first run of this workflow
          # failed. One branch per date keeps re-runs idempotent.
          row="$(tail -1 evidence/adoption/history.tsv)"
          day="$(echo "$row" | cut -f1)"
          branch="adoption/$day"

          git config user.name  "Yashraj Pardeshi"
          git config user.email "incyashraj@gmail.com"
          git checkout -b "$branch"
          git add evidence/adoption/history.tsv
          # The row itself in the message, so `git log` alone tells the
          # story without opening the file.
          git commit -m "Adoption numbers: $day" -m "$row"
          git push -f origin "$branch"

          if gh pr list --head "$branch" --state open --json number -q '.[0].number' | grep -q .; then
            echo "pull request already open for $branch"
          else
            gh pr create --head "$branch" --base main \
              --title "Adoption numbers: $day" \
              --body "$(printf 'Weekly snapshot of the adoption record.\n\n```\n%s\n%s\n```\n\nSee evidence/adoption/README.md for what each column counts, and which two mislead if quoted raw.' "$(head -1 evidence/adoption/history.tsv)" "$row")"
          fi
