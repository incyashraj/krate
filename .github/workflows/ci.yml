            --allow-blocked-curl

  # ──────────────────────────────────────────────
  # 13. Documentation build
  # ──────────────────────────────────────────────
  docs:
    name: Docs (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          mkdir -p ~/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory ~/bin
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Build docs
        run: mdbook build docs/book
      - name: Check TypeScript SDK shape
        run: npm --prefix packages/sdk-ts run check:shape
      # The installers print an example command when GitHub's API is rate
      # limited, and that example pins a version. It suggested rc4 for two
      # releases after rc5 shipped, so the one instruction offered to somebody
      # already having a bad time installed something old. Nothing else catches
      # this: the installers are not compiled and that line only runs on a
      # rate-limited network.
      - name: Fetch tags for the installer version check
        run: git fetch --tags --force --depth=1
      - name: Check the installers do not suggest a stale version
        run: sh scripts/check-installer-versions.sh
      # Both winit adapters created windows hidden, assuming apps call
      # window.show. No sample app does, so on Windows and Linux a person ran
      # a 3D app and saw a frame count with no window. Every test passed: they
      # check a window was created, never that it is visible.
      - name: Check native windows are visible when created
        run: sh scripts/check-windows-are-visible.sh
      # install.ps1 is the first thing a Windows user runs, so a parse error in
      # it breaks every Windows install at once. The full cold-install walk
      # covers this properly but only runs on a schedule or with [full-ci], so
      # check the syntax on every change -- it costs a second and needs no
      # network, no release and no Windows runner.
      - name: Check the Windows installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "install.ps1 has $($errors.Count) syntax error(s)"
          }
          Write-Host "install.ps1 parses cleanly"
      - name: Check Go SDK shape
        run: node packages/sdk-go/scripts/check-shape.mjs

  # ──────────────────────────────────────────────
  # 14. Benchmark smoke + warning-only regression check
  # ──────────────────────────────────────────────
  benchmarks:
    name: Benchmarks (Phase 2 baseline, warning only)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-wasip1, wasm32-wasip2
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-component
        run: cargo install cargo-component --locked --version 0.21.1
      - name: Build Phase 1 benchmark components
        shell: bash
        run: scripts/build-phase1-components.sh
      - name: Build Phase 2 benchmark components
        shell: bash
        run: |
          scripts/build-phase2-smoke-component.sh
          scripts/build-krate-clock-component.sh
      - name: Run runtime startup benchmarks
        run: cargo bench -p krate-runtime --bench startup
      - name: Run Phase 2 UAPI dispatch benchmarks
        run: cargo bench -p krate-runtime --bench uapi_dispatch
      - name: Check against recorded baseline
        if: always()
        env:
          BENCH_BASELINE_FILES: ${{ github.workspace }}/docs/book/src/phase2/benchmark-baseline.json
          BENCH_REGRESSION_MODE: warn
          BENCH_REGRESSION_THRESHOLD_PCT: "10"
        run: scripts/check-benchmark-regression.sh

  # ──────────────────────────────────────────────
  # 15. Dependency audit (cargo-deny)
  # ──────────────────────────────────────────────
  deny:
    name: Dependency audit (cargo-deny)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.4
      - name: Run cargo-deny
        run: scripts/check-dependencies.sh
