name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The cross-host proofs, the evidence comparisons, and the dependency audit
  # are gated behind a `[full-ci]` commit tag. That tag has been typed once in
  # this repository's history, so those nine jobs did not run for four weeks --
  # long enough for seven projects to break and a security advisory in the
  # engine to go unnoticed. A verification that only runs when someone
  # remembers it is not a verification.
  #
  # 03:00 UTC, two hours off the nightly fuzz run so the two do not queue
  # against each other for runners.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run full cross-host CI, benchmarks, and dependency audit
        required: false
        type: boolean
        default: false
      language_variants_mode:
        description: Language-variant fixture mode (optional, any, both, go, ts)
        required: false
        type: string
        default: optional

concurrency:
  # Keyed on the event, not only the branch. A push should cancel the previous
  # push's quick lanes -- that is the point -- but it must not cancel a nightly
  # or a manually dispatched full run, which takes forty minutes and is the only
  # thing that exercises three operating systems. That happened three times in
  # one afternoon: every push threw away the run that was proving the product's
  # core claim, and the claim went unverified because someone kept working.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI is not a user. Without this every replayed app and cold-install walk
  # pings the usage endpoint -- polluting the numbers and, on 2026-08-10,
  # helping exhaust the KV quota that publishes depended on.
  KRATE_NO_USAGE: "1"
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ──────────────────────────────────────────────
  # 1. Format check
  # ──────────────────────────────────────────────
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ──────────────────────────────────────────────
  # 2. Lint
  # ──────────────────────────────────────────────
  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # --all-features never exercises a feature being absent, and the arm64
      # Linux release ships exactly that build: no speech, because its cross
      # container cannot compile whisper.cpp. Without this, a change that only
      # compiles with the engine present would pass every check here and break
      # that platform at release time, which is where it is most expensive.
      - name: Run clippy without speech, the way arm64 Linux ships
        run: |
          cargo clippy -p krate-runtime --all-targets \
            --no-default-features --features phase2-bindings -- -D warnings
          cargo clippy -p krate-cli --all-targets --no-default-features -- -D warnings

  # ──────────────────────────────────────────────
  # 3. Phase 2 binding checkpoint
  # ──────────────────────────────────────────────
  phase2-bindings:
    name: Phase 2 bindings
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-phase2-bindings-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate and test Phase 2 Rust host bindings
        run: cargo test -p krate-runtime --features phase2-bindings

  # ──────────────────────────────────────────────
  # 4. Fast Linux workspace test
  # ──────────────────────────────────────────────
  quick-test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-wasip1, wasm32-wasip2, wasm32-unknown-unknown
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-component (the port tests build a real component)
        run: cargo install cargo-component --locked --version 0.21.1
      - name: Warm the cargo cache for the offline port tests
        run: |
          # The port tests build a guest with CARGO_NET_OFFLINE so they
          # never reach the network mid-test. That only works if the guest
          # SDK's wasm32 dependencies are already in the cache, so fetch
          # them once here rather than loosening the tests.
          tmp="$(mktemp -d)/krate-port-cache-warm"
          cargo new --lib "$tmp" >/dev/null
          {
            printf '[target.'"'"'cfg(target_arch = "wasm32")'"'"'.dependencies]\n'
            printf 'dlmalloc = { version = "0.2", features = ["global"] }\n'
          } >> "$tmp/Cargo.toml"
          cargo fetch --manifest-path "$tmp/Cargo.toml" --target wasm32-wasip1
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: krate create fails clearly when build tools are missing
        shell: bash
        run: |
          # A first user without the Rust build tools must get a clear, actionable
          # message and a non-zero exit, not a raw cargo error mid-build.
          #
          # Stripping PATH is not enough to simulate that machine, and this step
          # failed for several releases because of it: `resolve_tool` also looks
          # in CARGO_HOME and ~/.cargo/bin on purpose, so that a shell with a
          # badly ordered PATH still finds the toolchain. Passing the real HOME
          # through let create find cargo there and succeed, which failed the
          # assertion below and looked like a product regression. It was the
          # test's premise that was stale.
          #
          # So point HOME at an empty directory as well, and clear CARGO_HOME
          # (the workflow sets it), which is what a machine with no Rust
          # actually looks like.
          cargo build -q -p krate-cli
          bin="$PWD/target/debug/krate"
          empty_home="$(mktemp -d)"
          set +e
          out="$(env -i HOME="$empty_home" PATH=/usr/bin:/bin "$bin" \
            create "make a checklist" --output /tmp/x.krate </dev/null 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "expected a non-zero exit when the toolchain is missing" >&2
            exit 1
          fi
          # Assert the properties, not the phrasing: someone stuck here needs
          # to know how long it takes and get a command they can actually paste.
          echo "$out" | grep -q "needs a compiler" \
            || { echo "expected the message to say what is needed" >&2; exit 1; }
          echo "$out" | grep -q "five minutes" \
            || { echo "expected the message to bound the wait" >&2; exit 1; }
          echo "$out" | grep -q "sh.rustup.rs | sh" \
            || { echo "the printed install command must be pasteable" >&2; exit 1; }
          echo "$out" | grep -q "krate doctor" \
            || { echo "expected a pointer to krate doctor" >&2; exit 1; }
          echo "create preflight failed clearly with the toolchain missing"

  # ──────────────────────────────────────────────
  # 4b. The library tests, on every system we claim to run on
  # ──────────────────────────────────────────────
  #
  # `cargo test --workspace` above runs on Ubuntu only, so every capability
  # host was verified on one operating system while the product claims three.
  # That is the wrong way round for the parts that are written per-platform:
  # `random_host` reads /dev/urandom on Unix and calls RtlGenRandom on Windows,
  # and a mistake in the Windows branch is a weak random source rather than a
  # crash -- the kind of bug that passes a Linux CI forever.
  #
  # Deliberately narrower than the Ubuntu job: `--lib` only, no cargo-component
  # install and no port tests, because those are slow and are not what differs
  # between systems.
  cross-platform-lib-tests:
    name: Library tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          # `target/` is in this cache and the key used to be Cargo.lock
          # alone, so a `whisper-rs-sys` object built under an older MSVC
          # image could be restored forever -- the lockfile never changes, so
          # the cache never rotated. `whisper-rs-sys` is C++ compiled by
          # CMake, so its output depends on the toolchain, not just on the
          # lockfile. Including the image label rotates the cache when the
          # image does. No `restore-keys`: falling back to an older key is
          # how a stale object would come back.
          #
          # **This is hygiene, not the K-071 fix.** It was tried as the fix
          # and it is not: a run with this key missed the cache, compiled
          # whisper-rs-sys from source, and failed on the same 23 symbols.
          # See the bug entry -- the real cause is that `libucrt.lib` is
          # absent from the link line, and no cache key can add it.
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-cargo-libtest-${{ hashFiles('**/Cargo.lock') }}
      - name: Run the library tests
        # Windows runs the release profile. The workspace mandates a static
        # CRT (K-037: without it, krate.exe silently fails to start on clean
        # Windows 11), and whisper's cmake objects only agree with that CRT
        # in release -- the debug test link has been failing on unresolved
        # __imp_ stdio symbols for as long as this job has existed, while
        # every release Windows build links the same code fine. Same tests,
        # the profile that actually links.
        run: cargo test --workspace --lib ${{ matrix.os == 'windows-2022' && '--release' || '' }}

  # ──────────────────────────────────────────────
  # 5. Rust SDK package dry-run
  # ──────────────────────────────────────────────
  rust-sdk-package:
    name: Rust SDK package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-wasip1
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-sdk-package-${{ hashFiles('**/Cargo.lock') }}
      - name: Record Rust SDK evidence
        run: |
          mkdir -p krate-evidence
          scripts/record-phase2-rust-sdk-evidence.sh \
            --strict \
            --output krate-evidence/rust-sdk-evidence.md
      - name: Upload Rust SDK evidence
        uses: actions/upload-artifact@v7
        with:
          name: rust-sdk-evidence
          path: krate-evidence/rust-sdk-evidence.md
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 6. UAPI contract and generated reference freshness
  # ──────────────────────────────────────────────
  uapi-reference:
    name: UAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-uapi-reference-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked
      - name: Check Phase 2 UAPI contract
        run: sh scripts/check-uapi.sh
      - name: Check Phase 3 UAPI draft
        run: sh scripts/check-phase3-uapi.sh
      - name: Check Phase 3 design docs
        run: sh scripts/check-phase3-design-docs.sh
      - name: Regenerate UAPI reference
        run: sh scripts/generate-uapi-reference.sh
      - name: Check generated UAPI reference is current
        run: git diff --exit-code -- docs/book/src/reference/uapi/index.md
      - name: Regenerate the widget parity table
        run: cargo run -p krate-tools --bin check-widget-parity -- --write
      - name: Check the widget parity table is current
        run: git diff --exit-code -- docs/book/src/reference/widget-parity.md
      # The widget table was guarded and the interface table was not, so adding
      # krate:ui/image left the published page claiming one fewer interface
      # than the runtime has. Both are generated; both are checked now.
      - name: Regenerate the interface parity table
        run: cargo run -p krate-tools --bin check-interface-parity -- --write
      - name: Check the interface parity table is current
        run: git diff --exit-code -- docs/book/src/reference/interface-parity.md
      - name: Regenerate UAPI freeze evidence
        run: sh scripts/generate-uapi-freeze-evidence.sh
      - name: Check generated UAPI freeze evidence is current
        run: git diff --exit-code -- docs/book/src/phase2/uapi-freeze-evidence.md
      - name: Regenerate UAPI freeze lock
        run: sh scripts/generate-uapi-freeze-lock.sh
      - name: Check generated UAPI freeze lock is current
        run: git diff --exit-code -- docs/book/src/phase2/uapi-freeze-lock.md
      - name: Check runtime adapter boundary
        run: sh scripts/check-adapter-boundary.sh
      - name: Check Phase 2 exit evidence
        run: sh scripts/check-phase2-exit-evidence.sh
      - name: Check Phase 2 UAPI freeze decision packet
        run: sh scripts/check-phase2-freeze-decision.sh
      - name: Check Phase 2 closeout docs
        run: sh scripts/check-phase2-closeout-docs.sh

  # ──────────────────────────────────────────────
  # 7. Shared component fixtures
  # ──────────────────────────────────────────────
  hello-fixture:
    name: Build shared component fixtures
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-wasip1, wasm32-wasip2
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-fixture-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-component
        run: cargo install cargo-component --locked --version 0.21.1
      - name: Build hello fixture once
        id: build
        shell: bash
        run: |
          wasm_path="$(scripts/build-hello-component.sh)"
          mkdir -p krate-fixture
          cp "$wasm_path" krate-fixture/hello_world.wasm
      - name: Build Phase 2 smoke fixture once
        shell: bash
        run: |
          wasm_path="$(scripts/build-phase2-smoke-component.sh)"
          cp "$wasm_path" krate-fixture/phase2_smoke.wasm
      - name: Build krate-clock fixture once
        shell: bash
        run: |
          wasm_path="$(scripts/build-krate-clock-component.sh)"
          cp "$wasm_path" krate-fixture/krate_clock.wasm
      - name: Build krate-cat fixture once
        shell: bash
        run: |
          wasm_path="$(scripts/build-krate-cat-component.sh)"
          cp "$wasm_path" krate-fixture/krate_cat.wasm
      - name: Build krate-curl fixture once
        shell: bash
        run: |
          wasm_path="$(scripts/build-krate-curl-component.sh)"
          cp "$wasm_path" krate-fixture/krate_curl.wasm
      - name: Build krate-hello-gui fixture once
        shell: bash
        run: |
          wasm_path="$(scripts/build-krate-hello-gui-component.sh)"
          cp "$wasm_path" krate-fixture/krate_hello_gui.wasm
      - name: Build krate-notes fixture once
        shell: bash
        run: |
          wasm_path="$(scripts/build-krate-notes-component.sh)"
          cp "$wasm_path" krate-fixture/krate_notes.wasm
      - name: Check Phase 2 fixture imports
        shell: bash
        run: |
          scripts/check-component-imports.sh \
            krate-fixture/phase2_smoke.wasm \
            krate-fixture/krate_clock.wasm \
            krate-fixture/krate_cat.wasm \
            krate-fixture/krate_curl.wasm \
            krate-fixture/krate_hello_gui.wasm
      - name: Record fixture hash
        id: hash
        shell: bash
        run: |
          sha256="$(sha256sum krate-fixture/hello_world.wasm | awk '{print $1}')"
          printf '%s\n' "$sha256" > krate-fixture/hello_world.wasm.sha256
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "hello fixture sha256: $sha256"
      - name: Upload component fixtures
        uses: actions/upload-artifact@v7
        with:
          name: phase-component-fixtures
          path: krate-fixture/
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 8. Full test matrix — Linux, macOS, Windows
  # ──────────────────────────────────────────────
  full-test:
    name: Full test (${{ matrix.os }})
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ${{ matrix.os }}
    needs: hello-fixture
    # A stuck runner (a hung evidence step, a stalled GUI proof) must fail the
    # lane, not sit at GitHub's 6-hour default. Ubuntu/macOS finish in ~25 min,
    # but the Windows lane legitimately takes ~53 (slower runner + cache save),
    # so 75 leaves margin while still catching a real hang.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux audio and window-system development files
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-wasip1, wasm32-wasip2, wasm32-unknown-unknown
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          # Same stale-object trap as the library-tests job (K-071): this one
          # also caches `target/` across a matrix that includes Windows, and
          # builds the workspace with speech on.
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace
      - name: Build release binary
        run: cargo build --release --workspace
      - name: Download shared component fixtures
        uses: actions/download-artifact@v8
        with:
          name: phase-component-fixtures
          path: krate-fixture
      - name: Install fixtures at sample manifest entries
        shell: bash
        run: |
          mkdir -p \
            apps/krate-clock/target/wasm32-wasip1/release \
            apps/krate-cat/target/wasm32-wasip1/release \
            apps/krate-curl/target/wasm32-wasip1/release
          cp krate-fixture/krate_clock.wasm \
            apps/krate-clock/target/wasm32-wasip1/release/krate_clock.wasm
          cp krate-fixture/krate_cat.wasm \
            apps/krate-cat/target/wasm32-wasip1/release/krate_cat.wasm
          cp krate-fixture/krate_curl.wasm \
            apps/krate-curl/target/wasm32-wasip1/release/krate_curl.wasm
          mkdir -p apps/krate-hello-gui/target/wasm32-wasip1/release
          cp krate-fixture/krate_hello_gui.wasm \
            apps/krate-hello-gui/target/wasm32-wasip1/release/krate_hello_gui.wasm
      # The authoring loop builds a fresh app from generated source, so it needs
      # the component toolchain (the sample fixtures above were prebuilt).
      - name: Install cargo-component (for the authoring loop)
        run: cargo install cargo-component --locked --version 0.21.1
      - name: Run the AI authoring loop (author -> build -> pack -> permission wall)
        shell: bash
        run: |
          # An agent-authored .krate, proven on this OS: the generator writes a
          # word-frequency app, it builds to a krate:*-only component, packs to
          # one .krate, runs with fs.read (exit 0) and refuses without it (exit
          # 5). The transcript records the code.wasm sha256 so the same authored
          # bytecode can be compared across the Linux, macOS, and Windows lanes.
          bash scripts/author-krate.sh --evidence "$RUNNER_TEMP/authoring-$RUNNER_OS"
          echo "---- transcript ($RUNNER_OS) ----"
          cat "$RUNNER_TEMP/authoring-$RUNNER_OS/transcript.json"
      - name: Upload authoring-loop evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authoring-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/authoring-${{ runner.os }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Create the checklist app with `krate create` (self-service path)
        shell: bash
        run: |
          # The self-service product path, proven STANDALONE on this OS: the
          # binary is copied outside the repo and run with no KRATE_SDK_ROOT, so
          # `krate create` must materialize its embedded SDK to build. It authors
          # a GUI checklist, builds it to a krate:*-only component, packs it, and
          # verifies its permission wall (runs with fs.write, refuses without).
          # Then the packed .krate is opened headlessly to prove it starts, and a
          # run without fs.write is confirmed to exit 5.
          exe=krate
          [ "$RUNNER_OS" = "Windows" ] && exe=krate.exe
          cargo build -p krate-cli
          # Copy the binary to a directory with no Krate checkout nearby.
          standalone="$RUNNER_TEMP/standalone-$RUNNER_OS"
          rm -rf "$standalone" && mkdir -p "$standalone"
          cp "$GITHUB_WORKSPACE/target/debug/$exe" "$standalone/$exe"
          bin="$standalone/$exe"
          out="$RUNNER_TEMP/checklist-$RUNNER_OS"
          rm -rf "$out" && mkdir -p "$out"
          # No KRATE_SDK_ROOT: the embedded SDK is the only source.
          ( cd "$out" && "$bin" create \
              "Make a checklist app that saves locally" \
              --output "checklist.krate" \
              --transcript "transcript.json" )
          echo "---- checklist transcript ($RUNNER_OS) ----"
          cat "$out/transcript.json"
          # Prove the packed .krate opens: run it headless with grants, then
          # confirm withholding store.kv refuses with exit 5.
          #
          # The app keeps its items in its own store rather than a folder, so
          # what is asserted is what it reports and that it leaves nothing
          # behind -- there is no file to stat, and that is the improvement: a
          # checklist needs no access to anyone's directories.
          saved="$( cd "$out" && "$bin" run checklist.krate --auto-grant -- quick \
            | sed -n 's/^items://p' )"
          if [ -z "$saved" ] || [ "$saved" -lt 1 ]; then
            echo "checklist should have saved its items after a granted run" >&2
            exit 1
          fi
          if [ -d "$out/checklist" ]; then
            echo "the checklist should not have created a directory to save into" >&2
            exit 1
          fi
          echo "checklist.krate opened, ran, and saved on $RUNNER_OS"
          set +e
          ( cd "$out" && "$bin" run checklist.krate \
              --grant ui.window:create --grant io.stdout --grant io.args \
              -- quick ) >/dev/null 2>&1
          denied=$?
          set -e
          if [ "$denied" != "5" ]; then
            echo "withholding store.kv should refuse the checklist (exit 5), got $denied" >&2
            exit 1
          fi
          echo "withholding fs.write stopped the checklist before it ran (exit 5)"
      - name: Upload checklist create evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checklist-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/checklist-${{ runner.os }}/
          if-no-files-found: warn
          retention-days: 14
      # The bundle itself, not just the evidence about it. Every lane so far
      # builds a .krate on one operating system and opens it on that same one,
      # so "one file, any computer" -- the single most repeated sentence about
      # this product -- has never actually been tested. Uploading the artifact
      # is what lets the job below open each OS's bundle on every other OS.
      - name: Upload the checklist bundle for cross-system opening
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: ${{ runner.temp }}/checklist-${{ runner.os }}/checklist.krate
          if-no-files-found: error
          retention-days: 7
      - name: Create a microphone-aware voice prompter on this host
        shell: bash
        run: |
          exe=krate
          [ "$RUNNER_OS" = "Windows" ] && exe=krate.exe
          bin="$GITHUB_WORKSPACE/target/debug/$exe"
          out="$RUNNER_TEMP/voice-prompter-$RUNNER_OS"
          rm -rf "$out" && mkdir -p "$out"
          ( cd "$out" && "$bin" create \
              "Make a voice prompter that listens to my voice and advances the script" \
              --kind voice-prompter \
              --output "voice-prompter.krate" \
              --transcript "transcript.json" )
          # The quick path is deliberately headless and deterministic. It
          # proves the authored component and package on every host; native
          # microphone hardware is exercised separately on a real machine.
          ( cd "$out" && "$bin" run voice-prompter.krate --auto-grant -- quick )
          set +e
          ( cd "$out" && "$bin" run voice-prompter.krate \
              --grant ui.window:create --grant io.stdout --grant io.args \
              -- quick ) >/dev/null 2>&1
          denied=$?
          set -e
          if [ "$denied" != "5" ]; then
            echo "withholding audio.capture should refuse the voice prompter (exit 5), got $denied" >&2
            exit 1
          fi
          echo "voice-prompter.krate built and enforced microphone consent on $RUNNER_OS"
      - name: Upload voice prompter create evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voice-prompter-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/voice-prompter-${{ runner.os }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Run Phase 3 GUI component headless on this host
        shell: bash
        run: |
          cargo build -p krate-cli
          bin=target/debug/krate
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin=target/debug/krate.exe
          fi
          set +e
          "$bin" run \
            --auto-grant \
            --manifest apps/krate-hello-gui/manifest.toml \
            apps/krate-hello-gui/target/wasm32-wasip1/release/krate_hello_gui.wasm \
            -- quick
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "expected headless clean exit 1 from the GUI component on $RUNNER_OS, got $code" >&2
            exit 1
          fi
          echo "same GUI artifact ran headless on $RUNNER_OS (clean bounded exit)"
      - name: Run Linux winit native window proof (Xvfb)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -q
          # xvfb provides the display server; libxkbcommon-x11 is dlopen'd by
          # winit's X11 keyboard path and absent on minimal runners.
          # x11-apps (xwd) + imagemagick capture the drawn window as evidence.
          sudo apt-get install -y -q xvfb libxkbcommon-x11-0 xdotool \
            x11-apps imagemagick
          # 1. Adapter-level native smoke: real winit window round trip.
          KRATE_WINIT_NATIVE_SMOKE=1 KRATE_WINIT_ANY_THREAD=1 xvfb-run -a \
            cargo test -p krate-adapter-linux --lib -- --ignored \
            winit_prototype_native_window_smoke
          # 2. The slice's definition of done: the portable hello-gui
          #    component opens a real window on a Linux host.
          set +e
          xvfb-run -a target/debug/krate run \
            --auto-grant \
            --native-window \
            --manifest apps/krate-hello-gui/manifest.toml \
            apps/krate-hello-gui/target/wasm32-wasip1/release/krate_hello_gui.wasm \
            -- quick
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "expected clean bounded exit 1 from the native Linux window run, got $code" >&2
            exit 1
          fi
          echo "hello-gui opened a real winit window on Linux (Xvfb) and exited cleanly"
          # 3. Synthetic click round trip: xdotool presses the drawn button
          #    and the component must observe it (exit 0).
          set +e
          KRATE_XVFB_SCREENSHOT="$RUNNER_TEMP/hello-gui-linux.png" \
          KRATE_EXPECT_TYPED="hi krate" \
          KRATE_EXPECT_SELECTED="pick beta" \
            xvfb-run -a bash scripts/xvfb-click-hello-gui.sh
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "expected exit 0 from the synthetic input round trip, got $code" >&2
            exit 1
          fi
          echo "synthetic typing + click reached the component on Linux (exit 0, typed text echoed)"
          # 4. The same proof, delivered as one downloadable file. Packs
          #    hello-gui into a .krate, serves it over local HTTP, runs it by
          #    URL, and asserts the identical round trip. Delivering an app as
          #    a link must change nothing about how it behaves.
          set +e
          KRATE_BUNDLE_URL_PROOF=1 \
          KRATE_XVFB_SCREENSHOT="$RUNNER_TEMP/hello-gui-linux-bundle.png" \
          KRATE_EXPECT_TYPED="hi krate" \
          KRATE_EXPECT_SELECTED="pick beta" \
            xvfb-run -a bash scripts/xvfb-click-hello-gui.sh
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "expected exit 0 running hello-gui from a .krate URL, got $code" >&2
            exit 1
          fi
          echo "the same app, fetched from a URL as one .krate file, passed the identical round trip"
          # 5. The flagship, packed and run as one file. What matters here is
          #    not another screenshot but that a real app persists to the
          #    directory it was granted, and cannot start without that grant.
          set +e
          notes_dir="$RUNNER_TEMP/notes-demo"
          rm -rf "$notes_dir" && mkdir -p "$notes_dir/notes"
          cp krate-fixture/krate_notes.wasm "$notes_dir/code.wasm"
          cp apps/krate-notes/manifest.toml "$notes_dir/manifest.toml"
          # Requirement #10: the SAME bytecode runs on every OS. The notes wasm
          # is built once in the hello-fixture job and downloaded here, so its
          # hash must match across the Linux, macOS, and Windows lanes. Record
          # it in the log on each lane; a mismatch means the shared artifact was
          # not what ran.
          if command -v sha256sum >/dev/null 2>&1; then
            code_sha="$(sha256sum "$notes_dir/code.wasm" | awk '{print $1}')"
          else
            code_sha="$(shasum -a 256 "$notes_dir/code.wasm" | awk '{print $1}')"
          fi
          echo "notes code.wasm sha256 on $RUNNER_OS: $code_sha"
          target/debug/krate pack "$notes_dir/code.wasm" \
            --manifest "$notes_dir/manifest.toml" \
            -o "$notes_dir/notes.krate" || exit 1
          ( cd "$notes_dir" && "$GITHUB_WORKSPACE/target/debug/krate" run notes.krate \
              --auto-grant -- quick )
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "expected krate-notes to run cleanly from its bundle, got $code" >&2
            exit 1
          fi
          if [ ! -s "$notes_dir/notes/first.txt" ]; then
            echo "krate-notes should have saved a note into the granted directory" >&2
            exit 1
          fi
          echo "krate-notes ran from a .krate and saved into the directory it was granted"
          # The wall: without fs.write the app must refuse to start at all.
          set +e
          ( cd "$notes_dir" && "$GITHUB_WORKSPACE/target/debug/krate" run notes.krate \
              --grant "fs.read:./notes/**" --grant ui.window:create \
              --grant io.stdout --grant io.args -- quick )
          denied=$?
          set -e
          if [ "$denied" != "5" ]; then
            echo "expected exit 5 when fs.write is withheld, got $denied" >&2
            exit 1
          fi
          echo "withholding fs.write stopped krate-notes before it ran (exit 5)"
          # Consent path (P3-OPEN-01). The native window is macOS-only; on Linux
          # --consent falls back to the terminal prompt, so this proves the
          # consent semantics: allowing grants exactly what was requested and the
          # app runs, and refusing yields the same structured denial (exit 5) as
          # a withheld --grant. The two paths must agree on the grant set.
          consent_dir="$RUNNER_TEMP/notes-consent"
          rm -rf "$consent_dir" && mkdir -p "$consent_dir/notes"
          cp "$notes_dir/notes.krate" "$consent_dir/notes.krate"
          # Allow all: pipe "A" to the fallback prompt. The app should run and
          # save, proving consent granted the same caps a direct --grant would.
          ( cd "$consent_dir" && printf 'A\n' | "$GITHUB_WORKSPACE/target/debug/krate" \
              run notes.krate --consent -- quick ) || {
            echo "expected --consent (allow all) to run krate-notes" >&2
            exit 1
          }
          if [ ! -s "$consent_dir/notes/first.txt" ]; then
            echo "consent (allow all) should have saved a note" >&2
            exit 1
          fi
          echo "consent allow-all granted the requested caps and the app saved"
          # Refuse: pipe "N". The app must not run and must exit 5, the same
          # denial a withheld grant produces.
          rm -rf "$consent_dir/notes" && mkdir -p "$consent_dir/notes"
          set +e
          ( cd "$consent_dir" && printf 'N\n' | "$GITHUB_WORKSPACE/target/debug/krate" \
              run notes.krate --consent -- quick )
          consent_denied=$?
          set -e
          if [ "$consent_denied" != "5" ]; then
            echo "expected exit 5 when consent is refused, got $consent_denied" >&2
            exit 1
          fi
          if [ -s "$consent_dir/notes/first.txt" ]; then
            echo "refused consent must not have let the app write" >&2
            exit 1
          fi
          echo "refusing consent stopped krate-notes before it ran (exit 5)"
      - name: Upload Linux drawn-window screenshot
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: hello-gui-linux-screenshot
          path: |
            ${{ runner.temp }}/hello-gui-linux.png
            ${{ runner.temp }}/hello-gui-linux-bundle.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Run macOS AppKit native input proof
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # macOS had no native-input proof, and that is exactly where a real
          # bug shipped: windows showed, closed, and drew, but no keypress ever
          # reached a game, because AppKit hands key events to a responder
          # chain a drawn canvas is not part of. This posts a synthetic Space
          # into the process's own AppKit queue, pumps the production path, and
          # requires the sample to come out the runtime side with the portable
          # name apps hard-code. No accessibility permission: it is our own
          # queue, not synthesized global input.
          cargo run -p krate-adapter-macos --example key_capture_probe

      - name: Run Windows winit native window proof
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          # 1. Adapter-level native smoke: real winit window round trip.
          KRATE_WINIT_NATIVE_SMOKE=1 KRATE_WINIT_ANY_THREAD=1 \
            cargo test -p krate-adapter-windows --lib -- --ignored \
            winit_prototype_native_window_smoke
          # 2. The portable hello-gui component opens a real window on a
          #    Windows host.
          set +e
          target/debug/krate.exe run \
            --auto-grant \
            --native-window \
            --manifest apps/krate-hello-gui/manifest.toml \
            apps/krate-hello-gui/target/wasm32-wasip1/release/krate_hello_gui.wasm \
            -- quick
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "expected clean bounded exit 1 from the native Windows window run, got $code" >&2
            exit 1
          fi
          echo "hello-gui opened a real winit window on Windows and exited cleanly"
      - name: Warm the cargo cache for the offline port tests
        shell: bash
        run: |
          # Same reason as the quick lane: the port tests build a guest
          # with CARGO_NET_OFFLINE, so the guest SDK's wasm32 deps have to
          # already be cached. Windows hit this first because its cache
          # starts cold more often.
          tmp="$(mktemp -d)/krate-port-cache-warm"
          cargo new --lib "$tmp" >/dev/null
          {
            printf '[target.'"'"'cfg(target_arch = "wasm32")'"'"'.dependencies]\n'
            printf 'dlmalloc = { version = "0.2", features = ["global"] }\n'
          } >> "$tmp/Cargo.toml"
          cargo fetch --manifest-path "$tmp/Cargo.toml" --target wasm32-wasip1
      - name: Run Phase 1 tests
        shell: bash
        env:
          KRATE_HELLO_WASM: krate-fixture/hello_world.wasm
          KRATE_HELLO_SHA256: ${{ needs.hello-fixture.outputs.sha256 }}
          KRATE_PHASE2_SMOKE_WASM: krate-fixture/phase2_smoke.wasm
          KRATE_CLOCK_WASM: apps/krate-clock/target/wasm32-wasip1/release/krate_clock.wasm
          KRATE_CAT_WASM: apps/krate-cat/target/wasm32-wasip1/release/krate_cat.wasm
          KRATE_CURL_WASM: apps/krate-curl/target/wasm32-wasip1/release/krate_curl.wasm
        run: scripts/test-phase1.sh
      - name: Set up Node.js for TypeScript fixture lane
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build Phase 2 language-variant fixtures
        shell: bash
        env:
          KRATE_LANGUAGE_VARIANTS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.language_variants_mode || 'ts' }}
          KRATE_ALLOW_NPX_INSTALL: "1"
        run: scripts/build-phase2-language-variant-fixtures.sh
      - name: Run Phase 2 language-variant runtime tests
        shell: bash
        env:
          KRATE_LANGUAGE_VARIANTS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.language_variants_mode || 'ts' }}
        run: scripts/test-phase2-language-variants.sh
      - name: Record Phase 2 language-variant evidence
        shell: bash
        env:
          KRATE_LANGUAGE_VARIANTS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.language_variants_mode || 'ts' }}
        run: |
          mkdir -p krate-evidence
          scripts/record-phase2-language-variant-evidence.sh \
            --mode "${KRATE_LANGUAGE_VARIANTS_MODE}" \
            --strict \
            --output "krate-evidence/language-variant-${{ matrix.os }}.md"
      - name: Upload language-variant evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-variant-evidence-${{ matrix.os }}
          path: krate-evidence/language-variant-${{ matrix.os }}.md
          if-no-files-found: error
      - name: Record Phase 2 UCap enforcement evidence
        shell: bash
        run: |
          mkdir -p krate-evidence
          scripts/record-phase2-ucap-evidence.sh \
            --strict \
            --output "krate-evidence/ucap-enforcement-${{ matrix.os }}.md"
      - name: Upload UCap enforcement evidence
        uses: actions/upload-artifact@v7
        with:
          name: ucap-enforcement-evidence-${{ matrix.os }}
          path: krate-evidence/ucap-enforcement-${{ matrix.os }}.md
          if-no-files-found: error
      - name: Record Phase 2 adapter evidence
        shell: bash
        run: |
          mkdir -p krate-evidence
          scripts/record-phase2-adapter-evidence.sh \
            --strict \
            --output "krate-evidence/adapter-evidence-${{ matrix.os }}.md"
      - name: Upload adapter evidence
        uses: actions/upload-artifact@v7
        with:
          name: adapter-evidence-${{ matrix.os }}
          path: krate-evidence/adapter-evidence-${{ matrix.os }}.md
          if-no-files-found: error
      - name: Record Phase 2 sample evidence
        shell: bash
        run: |
          mkdir -p krate-evidence
          scripts/record-phase2-sample-evidence.sh \
            "krate-evidence/sample-evidence-${{ matrix.os }}.md"
      - name: Upload sample evidence
        uses: actions/upload-artifact@v7
        with:
          name: sample-evidence-${{ matrix.os }}
          path: krate-evidence/sample-evidence-${{ matrix.os }}.md
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 9. Compare language-variant evidence across hosts
  # ──────────────────────────────────────────────
  # ──────────────────────────────────────────────
  # One file, three computers -- the actual claim
  # ──────────────────────────────────────────────
  #
  # Every other lane builds a .krate on an operating system and opens it on
  # that same operating system, which proves the toolchain works there and
  # says nothing at all about portability. This takes the bundle each lane
  # built and opens it on all three, so a bundle authored on Windows has to
  # run on macOS and Linux and produce the same answer.
  #
  # If this job is red, the sentence "one file, any computer" is not true and
  # nothing else on the board matters.
  cross-system-bundles:
    name: Open every bundle on ${{ matrix.os }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ${{ matrix.os }}
    needs: full-test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install Linux audio and window-system development files
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-crossbundle-${{ hashFiles('**/Cargo.lock') }}
      - name: Build the runtime
        run: cargo build --release -p krate-cli
      - name: Download every operating system's bundle
        uses: actions/download-artifact@v6
        with:
          pattern: bundle-*
          path: bundles
      - name: Open each bundle on this system
        shell: bash
        run: |
          set -eu
          exe=target/release/krate
          [ "$RUNNER_OS" = "Windows" ] && exe=target/release/krate.exe

          found=0
          # Fresh each run: a leftover file from a retry would make the
          # identity count disagree with the bundles actually opened.
          : > "$RUNNER_TEMP/identities.txt"
          for dir in bundles/bundle-*; do
            [ -d "$dir" ] || continue
            bundle="$dir/checklist.krate"
            [ -f "$bundle" ] || { echo "no bundle in $dir" >&2; exit 1; }
            origin="$(basename "$dir" | sed 's/^bundle-//')"
            found=$((found + 1))

            work="$RUNNER_TEMP/open-$origin"
            rm -rf "$work" && mkdir -p "$work"
            cp "$bundle" "$work/app.krate"

            # A bundle built elsewhere has to run here, with its grants, and
            # produce the same answer it produces at home.
            out="$( cd "$work" && "$GITHUB_WORKSPACE/$exe" run app.krate --auto-grant -- quick 2>&1 )" || {
              echo "bundle from $origin FAILED to open on $RUNNER_OS:" >&2
              echo "$out" >&2
              exit 1
            }
            case "$out" in
              *saved*) echo "bundle from $origin opened and saved on $RUNNER_OS" ;;
              *) echo "bundle from $origin ran on $RUNNER_OS but did not save: $out" >&2; exit 1 ;;
            esac

            # The same bundle must have the same identity on every system. A
            # digest that changes with the reader means the file was rewritten
            # in transit, and then it is not the same app any more.
            id="$( cd "$work" && "$GITHUB_WORKSPACE/$exe" run app.krate --dump-caps \
              | grep -A 1 '^Identity' | tail -1 | tr -d ' -' )"
            if [ -z "$id" ]; then
              echo "bundle from $origin reported no identity on $RUNNER_OS" >&2
              exit 1
            fi
            echo "$origin $id" >> "$RUNNER_TEMP/identities.txt"
            echo "  identity: $id"
          done

          if [ "$found" -lt 3 ]; then
            echo "expected three bundles (one per operating system), found $found" >&2
            exit 1
          fi

          # Three distinct bundles, so three distinct identities is expected --
          # what would be wrong is two bundles reporting the same digest, which
          # would mean the identity is not actually derived from the contents.
          distinct="$(cut -d' ' -f2 "$RUNNER_TEMP/identities.txt" | sort -u | wc -l | tr -d ' ')"
          if [ "$distinct" -ne "$found" ]; then
            echo "expected $found distinct identities, got $distinct:" >&2
            cat "$RUNNER_TEMP/identities.txt" >&2
            exit 1
          fi
          echo "all $found bundles opened on $RUNNER_OS, each with its own identity"

  # ──────────────────────────────────────────────
  # The path a stranger walks, using only what is published
  # ──────────────────────────────────────────────
  #
  # Nothing tested this. The installer was copied to the site and never run, so
  # the first command a new person types had no coverage -- and it depends on
  # things outside this repository: the release assets, the domain, the GitHub
  # API, the app file served from the site. Any of those can break without a
  # commit, and nothing here would notice.
  #
  # Uses the published URLs on purpose. Building from source proves the source
  # works; it does not prove that what a person can download works.
  # ──────────────────────────────────────────────
  # The ports that already worked must keep working
  # ──────────────────────────────────────────────
  #
  # Three real third-party programs were ported by hand and the results written
  # down, and nothing re-ran them -- so a change that broke porting would have
  # been found by a user rather than by us. This clones each at a pinned commit,
  # ports it with the real pipeline, and checks it still builds, packs, runs,
  # and prints what it printed before.
  #
  # Nightly rather than per-push: it clones, drives an AI agent, and builds
  # three components, so it is minutes rather than seconds.
  # ──────────────────────────────────────────────
  # Every app we have ported must keep working
  # ──────────────────────────────────────────────
  #
  # The full port regression needs an AI agent to redo the transform and a
  # runner does not have one, so that job skips and verifies nothing. This is
  # the half that runs anywhere: the ported bundles are committed, so a runtime
  # or bundle-format change that would break every existing app is caught the
  # day it lands, on all three systems.
  replay-ported-apps:
    name: Replay ported apps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install Linux audio and window-system development files
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-replay-${{ hashFiles('**/Cargo.lock') }}
      - name: Build the runtime
        run: cargo build --release -p krate-cli
      - name: Replay every ported app
        shell: bash
        run: sh scripts/replay-ported-apps.sh
      # The website's numbers come from these bundles, and the fastest way to
      # make a public claim wrong is to improve the code. Printed on every run
      # so a stale claim is visible before it reaches a pitch deck.
      - name: Print the numbers behind the public claims
        shell: bash
        run: sh scripts/check-claims.sh
      # The contract tells the porting agent which crates to use, and untested
      # advice sent one port into four repair attempts against a dependency
      # that could never build. This compiles each recommended crate the way a
      # guest does and inspects the module for wasi imports.
      - name: Check the crates the contract recommends
        shell: bash
        run: |
          rustup target add wasm32-wasip1
          command -v wasm-tools >/dev/null || cargo install wasm-tools --locked
          sh scripts/check-recommended-crates.sh

  # The one target no other job builds. It compiles inside a `cross` container
  # that does not inherit the runner's packages, so a dependency needing a
  # system library fails there and nowhere else -- which is how an rc5 release
  # got as far as tagging before whisper-rs-sys reported no libclang. Nightly
  # rather than per-push: it is slow, and the failure it catches arrives with a
  # new dependency rather than with ordinary edits.
  cross-build-arm64-linux:
    name: Cross-build (aarch64 Linux)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install cross
        run: cargo install cross --locked
      - name: Build the release binary the way the release does
        run: cross build --release --target aarch64-unknown-linux-gnu -p krate-cli

  port-regression:
    name: Re-port the proven programs
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-wasip1
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-portregression-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-component
        run: cargo install cargo-component --locked --version 0.21.1
      - name: Build the runtime
        run: cargo build --release -p krate-cli
      - name: Re-port every proven program
        run: sh scripts/port-regression.sh "$RUNNER_TEMP/port-regression"

  cold-install:
    name: Cold install from krate.tech (${{ matrix.os }})
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is missing on purpose, not by oversight: it installs through
        # install.ps1, which is a different script and needs its own walk. That
        # is a real gap in this gate and it is written down in
        # Plan/Portable-Definition-Of-Done-2026-08-01.md rather than hidden by
        # a matrix that looks complete.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Walk the published install path
        shell: bash
        run: sh scripts/test-cold-install.sh "$RUNNER_TEMP/cold-install"

  # Windows installs through install.ps1, a different script with its own
  # release lookup -- and the same GitHub rate limit that broke the Unix path.
  # Its own walk, because a shell script cannot test a PowerShell one.
  cold-install-windows:
    name: Cold install from krate.tech (windows)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Walk the published install path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'cold-install-win'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null
          $env:KRATE_INSTALL_DIR = Join-Path $work 'bin'

          Write-Host '1. fetching the installer from krate.tech'
          $script = Join-Path $work 'install.ps1'
          Invoke-WebRequest -Uri 'https://krate.tech/install.ps1' -OutFile $script -UseBasicParsing
          if (-not (Test-Path $script)) { throw 'COLD PATH BROKEN: installer did not download' }

          Write-Host '2. running it the way the website says to'
          # Dot-sourced, not `& pwsh -File`. A person pipes the installer into
          # their own session with `irm ... | iex`, so anything it does to that
          # session -- notably putting itself on PATH -- has to be tested in a
          # session, not in a child process that exits immediately afterwards.
          # Running it as a child is why a real first install came back
          # "krate is not recognized" with every check here green.
          . $script
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
            throw "COLD PATH BROKEN: installer exited $LASTEXITCODE"
          }

          $krate = Join-Path $env:KRATE_INSTALL_DIR 'krate.exe'
          if (-not (Test-Path $krate)) { throw "COLD PATH BROKEN: no krate.exe at $krate" }

          Write-Host '2b. calling it by name, in this same session'
          # The whole point of the installer touching PATH. Get-Command rather
          # than running it, so this fails as "not on PATH" rather than as
          # whatever the binary happens to print.
          $found = Get-Command krate -ErrorAction SilentlyContinue
          if (-not $found) {
            throw "COLD PATH BROKEN: krate installed but is not callable by name in the session that installed it"
          }
          Write-Host "   installed and on PATH: $(krate --version)"

          Write-Host '3. running the app it suggests, with no grants'
          Push-Location $work
          # --headless: this captures and compares output, so a window that
          # opens and waits to be closed would hang the job. The wall and the
          # app's answer are what is under test here, not the window.
          $out = krate run --headless 'https://krate.tech/notes.krate' 2>&1 | Out-String
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 5) { throw "COLD PATH BROKEN: expected exit 5 without grants, got $code" }
          if ($out -notmatch 'needs permission') { throw "COLD PATH BROKEN: refusal did not explain itself" }
          Write-Host '   refused, in plain words'

          Write-Host '4. running it with grants'
          Push-Location $work
          $out = krate run --headless --grant 'fs.read:notes/**' --grant 'fs.write:notes/**' 'https://krate.tech/notes.krate' 2>&1 | Out-String
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "COLD PATH BROKEN: the app failed with its grants: $out" }
          if ($out -notmatch 'note') { throw "COLD PATH BROKEN: app ran but produced nothing: $out" }
          Write-Host "   ran: $($out.Trim())"

          Write-Host '5. opening it the way Explorer does'
          # The double-click path, which nothing tested before: CI only
          # checked that krate-open.exe was present in the archive, never that
          # it opens anything (K-110's sibling). Explorer runs the ProgID's
          # open command, which is `krate-open.exe "%1"` -- so run exactly
          # that, with a real file, and require an app to actually run.
          $opener = Join-Path $env:KRATE_INSTALL_DIR 'krate-open.exe'
          if (-not (Test-Path $opener)) {
            throw "COLD PATH BROKEN: no krate-open.exe at $opener -- double-click would flash a console"
          }

          Write-Host '5a. registering the association, as the installer does'
          $assoc = Join-Path $work 'install-krate-desktop.ps1'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/incyashraj/krate/main/scripts/install-krate-desktop.ps1' -OutFile $assoc -UseBasicParsing
          & $assoc -KrateBinary $krate
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\dev.krate.bundle\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          if (-not $cmd) { throw 'COLD PATH BROKEN: .krate has no open command in the registry' }
          if ($cmd -notmatch 'krate-open\.exe') {
            throw "COLD PATH BROKEN: double-click would use a console binary: $cmd"
          }
          Write-Host "   Explorer will run: $cmd"

          Write-Host '5b. running that exact command on a real file'
          # A GUI app would wait for its window to be closed, so use the app
          # the steps above already proved runs headlessly, and give the
          # grants it needs. What is under test is that the double-click
          # binary starts the app at all -- the failure this catches is
          # krate-open exiting without running anything.
          $bundle = Join-Path $work 'notes.krate'
          Invoke-WebRequest -Uri 'https://krate.tech/notes.krate' -OutFile $bundle -UseBasicParsing
          $log = Join-Path $work 'open.log'
          $proc = Start-Process -FilePath $opener -ArgumentList "`"$bundle`"" -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          if (-not $proc.WaitForExit(120000)) {
            $proc.Kill()
            throw 'COLD PATH BROKEN: double-click never finished'
          }
          # Exit 5 is the wall refusing without grants, which still proves the
          # opener found krate.exe and started the app. Anything else -- and
          # especially a failure to start -- is the bug this step exists for.
          if ($proc.ExitCode -ne 5 -and $proc.ExitCode -ne 0) {
            $why = (Get-Content $log, "$log.err" -ErrorAction SilentlyContinue) -join ' '
            throw "COLD PATH BROKEN: double-click exited $($proc.ExitCode): $why"
          }
          Write-Host "   double-click started the app (exit $($proc.ExitCode))"

          Write-Host ''
          Write-Host 'the cold path works on Windows: install, refuse, grant, run, double-click'

  language-variant-evidence-compare:
    name: Language variant evidence compare
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]')) }}
    runs-on: ubuntu-latest
    needs: full-test
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install Linux audio and window-system development files
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Download Linux language-variant evidence
        uses: actions/download-artifact@v8
        with:
          name: language-variant-evidence-ubuntu-latest
          path: krate-evidence/linux
      - name: Download macOS language-variant evidence
        uses: actions/download-artifact@v8
        with:
          name: language-variant-evidence-macos-latest
          path: krate-evidence/macos
      - name: Download Windows language-variant evidence
        uses: actions/download-artifact@v8
        with:
          name: language-variant-evidence-windows-latest
          path: krate-evidence/windows
      - name: Compare language-variant evidence reports
        shell: bash
        run: |
          scripts/compare-phase2-language-variant-evidence.sh \
            krate-evidence/linux/language-variant-ubuntu-latest.md \
            krate-evidence/macos/language-variant-macos-latest.md \
            krate-evidence/windows/language-variant-windows-latest.md

  # ──────────────────────────────────────────────
