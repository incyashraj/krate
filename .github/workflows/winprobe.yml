name: Win probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: wasm32-wasip1
      - name: Build the fixed CLI
        shell: bash
        run: cargo build --release -p krate-cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: krate-grok-stream
          path: target/release/krate.exe
