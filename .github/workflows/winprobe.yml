name: Win probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Build the fixed CLI, borrow cargo-component from the release
        shell: bash
        run: |
          set -euo pipefail
          # The published archive ships cargo-component; reuse it so this tests
          # the toolchain probe and not my ability to install a helper.
          gh release download v0.1.45 -R incyashraj/krate \
            -p "krate-0.1.45-x86_64-pc-windows-msvc.zip" -D dl
          7z x dl/krate-0.1.45-x86_64-pc-windows-msvc.zip -ounpacked >/dev/null
          cc=$(find unpacked -name 'cargo-component.exe' | head -1)
          export PATH="$(cd "$(dirname "$cc")" && pwd):$PATH"
          cargo build --release -p krate-cli
          echo "=== BEFORE-fix binary (v0.1.45, published) ==="
          "$(find unpacked -name krate.exe | head -1)" check-app apps/krate-bounce --no-run \
            && echo "PUBLISHED=PASS" || echo "PUBLISHED=FAIL"
          echo "=== AFTER-fix binary (this commit) ==="
          ./target/release/krate.exe check-app apps/krate-bounce --no-run \
            && echo "FIXED=PASS" || echo "FIXED=FAIL"
        env:
          GH_TOKEN: ${{ github.token }}
