name: Win probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: wasm32-wasip1
      - name: Build the CLI with the two-part probe and run the verifier's check
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p krate-cli
          echo "=== the exact command the release verifier runs ==="
          ./target/release/krate.exe check-app apps/krate-bounce --no-run
