name: Win probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Probe each toolchain exactly as the code does
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kp/src && cd /tmp/kp
          printf '[package]\nname="krate-linkprobe"\nversion="0.0.0"\nedition="2021"\n\n[lib]\npath="src/lib.rs"\n' > Cargo.toml
          echo 'fn main() {}' > build.rs
          echo 'pub fn probe() -> u32 { 1 }' > src/lib.rs
          for TC in $(rustup toolchain list | awk '{print $1}'); do
            echo "=== $TC ==="
            rustup run "$TC" cargo build --quiet >/dev/null 2>&1 \
              && echo "  HOST=pass" || echo "  HOST=fail"
            rustup run "$TC" cargo build --quiet --target wasm32-wasip1 >/dev/null 2>&1 \
              && echo "  WASM=pass" || echo "  WASM=fail"
            SR=$(rustup run "$TC" rustc --print sysroot 2>/dev/null || echo none)
            echo "  sysroot=$SR"
            ls "$SR/bin/cargo.exe" >/dev/null 2>&1 && echo "  has_cargo=yes" || echo "  has_cargo=no"
          done
          echo "=== what does 'rustup which cargo' (the fallback) give? ==="
          rustup which cargo
