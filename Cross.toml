[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update",
  # The file picker (rfd) needs the window-system headers, not just audio.
  # Without them this target fails to build and the release publishes with one
  # platform missing -- which nobody notices until an arm64 Linux user asks.
  # libclang is for whisper-rs-sys (speech-to-text), which runs bindgen over
  # the whisper.cpp headers. It is a host tool, so it is installed for the
  # build machine's architecture rather than the target's -- asking for
  # libclang-dev:$CROSS_DEB_ARCH gets the wrong one and the build still fails.
  #
  # It has to come from LLVM's own archive, not Ubuntu's. The cross 0.2.5
  # image is Ubuntu 16.04, whose libclang-dev is 3.8, and bindgen calls
  # clang_getTranslationUnitTargetInfo which needs 9 or newer -- so installing
  # the distribution package succeeds and then panics at build time with
  # "a libclang function was called that is not supported by the loaded
  # libclang instance".
  #
  # SOLVED as of rc6: the LLVM repository loads and bindgen runs. What this
  # target now fails on is one layer deeper and is not fixable from here.
  # whisper-rs-sys compiles whisper.cpp, which uses `if constexpr` -- C++17 --
  # and Ubuntu 16.04 ships g++ 5.4, which only reaches C++14:
  #
  #   gguf.cpp:960:12: error: expected '(' before 'constexpr'
  #
  # Installing a newer g++ here is possible but means a third compiler in a
  # container already carrying two. The real answer is that a speech-to-text
  # model runtime should not be a mandatory dependency of every Krate build on
  # every platform. Making it optional is the fix; see Plan/.
  # libclang comes from Ubuntu's OWN archive, not apt.llvm.org.
  #
  # This used to add the LLVM project's repository and install clang 9 from
  # it. That host refuses connections from GitHub runners about half the
  # time -- measured across four consecutive full runs: fail, success, fail,
  # success -- and every one of those failures was an unbuildable arm64
  # Linux binary. A release target that works on a coin toss is not a
  # release target.
  #
  # Nothing needed clang 9. The function that started all of this,
  # `clang_getTranslationUnitTargetInfo`, is gated `#[cfg(feature =
  # "clang_5_0")]` in clang-sys 1.9.1 -- it needs 5.0 or newer, and the
  # "9 or newer" in the old comment was wrong. xenial-updates carries
  # libclang-8-dev, which is comfortably past that and comes from the same
  # archive the container already trusts. No third-party host, no key, no
  # add-apt-repository, and one less thing that can be down.
  "apt-get --assume-yes install libclang-8-dev clang-8",
  "ln -sf /usr/lib/llvm-8/lib/libclang.so.1 /usr/lib/libclang.so",
  # Fail here rather than three minutes later inside bindgen. This target has
  # failed a release three times, twice with an error that pointed at the
  # wrong thing: apt happily leaves Ubuntu's preinstalled libclang 3.8 in
  # place when the install does not happen, so the build proceeds and dies
  # later with "a libclang function was called that is not supported".
  # Checking the file exists turns that into a one-line failure naming the
  # cause.
  #
  # `if`, not `test ... || (...)`, and that is the whole point. cross joins
  # these lines into ONE eval with no `set -e`, so an `exit 1` inside a
  # subshell exits only the subshell. The guard printed FATAL, the next
  # pre-build line ran anyway, the layer reported DONE, and the lane died
  # three minutes later pointing at libclang 3.8 -- the downstream symptom,
  # not the cause (K-745). This form exits the shell the eval runs in, so the
  # build stops on the line that knows why. Measured after that fix: the lane
  # failed at 19.57s naming the cause, with no mention of v4l2 or libclang
  # 3.8 anywhere in the log.
  "if [ ! -e /usr/lib/llvm-8/lib/libclang.so.1 ]; then echo 'FATAL: libclang 8 did not install from xenial-updates. Ubuntu 16.04 preinstalls libclang 3.8, which bindgen cannot use.' >&2; exit 1; fi",

  # libudev is for gamepads (gilrs -> libudev-sys), and it is Linux-only:
  # udev is how Linux enumerates input devices, so there is no feature that
  # avoids it. Like the others it is a target-architecture package, found
  # through pkg-config rather than a hardcoded path.
  "apt-get --assume-yes install libasound2-dev:$CROSS_DEB_ARCH libwayland-dev:$CROSS_DEB_ARCH libxkbcommon-dev:$CROSS_DEB_ARCH libudev-dev:$CROSS_DEB_ARCH",
  # The camera headers, for nokhwa's v4l2 binding. Video4Linux is how Linux
  # enumerates cameras, so like libudev there is no feature that avoids it.
  "apt-get --assume-yes install libv4l-dev:$CROSS_DEB_ARCH",
]

# Which libclang bindgen loads, said once, for every crate that runs it.
#
# The symlink above was enough while whisper-rs-sys was the only bindgen user:
# it looks at /usr/lib/libclang.so. v4l2-sys-mit (nokhwa, the camera) searches
# the standard library directories itself and finds Ubuntu 16.04's preinstalled
# libclang 3.8 FIRST -- so clang 9 installed, the guard above passed, and the
# build still died three minutes later with "a libclang function was called
# that is not supported by the loaded libclang instance / loaded libclang
# instance = 3.8.x". That is what held v0.5.0's arm64 Linux target.
#
# LIBCLANG_PATH is not a search hint, it is the answer: clang-sys loads from
# this directory and does not go looking. Naming it removes the ordering
# question for every present and future bindgen dependency at once.
#
# The bare name forwards the value the workflow sets on the host, which is the
# form cross documents plainly; the value itself lives beside the build step in
# release.yml so the two cannot disagree about which LLVM was installed.
[target.aarch64-unknown-linux-gnu.env]
passthrough = ["LIBCLANG_PATH"]
