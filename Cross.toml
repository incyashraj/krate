[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update",
  # The file picker (rfd) needs the window-system headers, not just audio.
  # Without them this target fails to build and the release publishes with one
  # platform missing -- which nobody notices until an arm64 Linux user asks.
  # libclang is for whisper-rs-sys (speech-to-text), which runs bindgen over
  # the whisper.cpp headers. It is a host tool, so it is installed for the
  # build machine's architecture rather than the target's -- asking for
  # libclang-dev:$CROSS_DEB_ARCH gets the wrong one and the build still fails.
  #
  # It has to come from LLVM's own archive, not Ubuntu's. The cross 0.2.5
  # image is Ubuntu 16.04, whose libclang-dev is 3.8, and bindgen calls
  # clang_getTranslationUnitTargetInfo which needs 9 or newer -- so installing
  # the distribution package succeeds and then panics at build time with
  # "a libclang function was called that is not supported by the loaded
  # libclang instance".
  "apt-get --assume-yes install wget gnupg software-properties-common",
  "wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -",
  "add-apt-repository -y 'deb http://apt.llvm.org/xenial/ llvm-toolchain-xenial-9 main'",
  "apt-get update",
  "apt-get --assume-yes install libclang-9-dev clang-9",
  "ln -sf /usr/lib/llvm-9/lib/libclang.so.1 /usr/lib/libclang.so",
  "apt-get --assume-yes install libasound2-dev:$CROSS_DEB_ARCH libwayland-dev:$CROSS_DEB_ARCH libxkbcommon-dev:$CROSS_DEB_ARCH",
]
