# The Krate hub, as a Cloudflare Worker.
#
# Bundles live in R2 (blobs, content-addressed by SHA-256) and their metadata
# in KV (small, read on every page load). That split matters: R2 is cheap for
# bytes and KV is fast for the listing the cloud page renders.

name = "krate-hub"
main = "src/index.js"
compatibility_date = "2026-01-01"

# The bundle validator, compiled from crates/bundle to WebAssembly by
# scripts/build-hub-validator.sh (run it before deploying). The publish
# door judges every upload with it -- the same code `krate run` uses.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
account_id = "1ded170dc582113e578faac5034be4ce"

[[r2_buckets]]
binding = "BUNDLES"
bucket_name = "krate-bundles"

[[kv_namespaces]]
binding = "APPS"
id = "184313bf18694dff800e580de42b2cda"

# A developer's own name, alice.krate.tech (K-849).
#
# ONE route covers every developer -- Cloudflare matches `*.` against all
# subhosts, and the limit of 1000 routes per zone is irrelevant to a design
# that needs one. The DNS side is a single proxied wildcard record,
# `* -> krate-hub`, which has been available on every plan (including Free)
# since May 2022. Free Universal SSL then covers the apex and exactly one
# level of subdomain, which is why developerHost() refuses a second label:
# beta.alice.krate.tech would have no certificate.
#
# The ROUTE is live, created 2026-09-22 against the zone's API and declared
# here so a deploy keeps it rather than dropping it:
#   *.krate.tech/* -> krate-hub   (route id a4245035fe5440d9886aa8f3b3e43c25)
#
# The DNS half is NOT done and cannot be done from here. Wrangler's OAuth
# offers no DNS-write scope at all -- `wrangler login --scopes-list` lists
# `zone:read` and nothing more -- so the wildcard record is the founder's
# to add, once, in the dashboard:
#
#   Type CNAME, Name `*`, Target `hub.krate.tech`, Proxy status PROXIED
#
# Until that record exists the route matches nothing: `alice.krate.tech`
# does not resolve, so no request ever reaches it. The hub is unaffected
# either way -- `hub.krate.tech` is a Worker CUSTOM DOMAIN, which carries
# its own record, and a custom domain cannot be a wildcard, which is why
# this is a route plus a record rather than a second custom domain.
[[routes]]
pattern = "*.krate.tech/*"
zone_name = "krate.tech"

[vars]
PUBLIC_BASE = "https://hub.krate.tech"
# The account whose Analytics Engine dataset /stats reads. Not a secret --
# it is already in `account_id` above -- but the worker cannot see that field
# at runtime, so without this the SQL URL becomes /accounts/undefined/... and
# every query 404s.
CF_ACCOUNT_ID = "1ded170dc582113e578faac5034be4ce"
# Who may read support reports. Verified GitHub logins, never a header the
# caller sets. Everyone else gets 404 from /admin/* -- not 403, because a
# 403 tells a stranger the door exists.
KRATE_ADMINS = "incyashraj"

# Usage counting lives here, not in KV. Analytics Engine is unmetered at this
# scale and exists for exactly this shape of data; the day telemetry shared a
# KV budget with publishes, one busy day of counting returned 429s to every
# publish and sign-in (2026-08-10). The dataset is created on first write.
# The nightly scrub: inventory and reconciliation of R2 against the control
# records, without repairs; /health and /admin/scrub/last read the result
# (IC-852). Repairs are a deliberate POST /admin/scrub by an admin.
[triggers]
crons = ["17 3 * * *"]

[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "krate_usage"

# Live game rooms: one Durable Object per room code, holding the two
# players' sockets and relaying between them. SQLite-backed classes are the
# free-plan flavor; the room never actually touches storage.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1-rooms"
new_sqlite_classes = ["Room"]
