# krate.tech, served by Cloudflare static assets (IC-997).
#
# No code: the Worker is the built site and nothing else. scripts/ship-site.sh
# builds it into .site (exactly as the deploy does) and uploads only the files
# that changed, so a change is live within a minute instead of the 8 to 12 a
# GitHub Pages build takes.
#
# The same paths as GitHub Pages served: /faq and /faq/ both open faq/index.html,
# /about.html opens about.html.
name = "krate-site"
# Only for addresses ending .html (run_worker_first below): see site.js.
main = "site.js"
compatibility_date = "2026-11-01"
workers_dev = true
# The address people use (the founder moved krate.tech's DNS off GitHub
# Pages on 2026-11-22). www.krate.tech keeps its own redirect to here.
routes = [
  { pattern = "krate.tech", custom_domain = true },
]

[assets]
directory = ".site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
# /page.html is served as itself, never redirected to /page (site.js).
run_worker_first = ["/*.html"]
