[workspace]
resolver = "2"
members = [
    "crates/adapter-common",
    "crates/adapter-linux",
    "crates/adapter-macos",
    "crates/adapter-windows",
    "crates/bindings-rust",
    "crates/layout",
    "crates/bundle",
    "crates/manifest",
    "crates/policy",
    "crates/runtime",
    "crates/cli",
    "crates/tools",
    "crates/author",
    "crates/port",
]
exclude = [
    "apps/krate-curl",
    "apps/krate-cat",
    "apps/krate-clock",
    "apps/krate-hello-gui",
    "apps/krate-notes",
    "apps/krate-checklist",
    "test/integration/hello-world",
    "test/integration/phase2-smoke",
    "test/integration/print-loop",
]

[workspace.package]
edition = "2021"
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
repository = "https://github.com/incyashraj/krate"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.102"
# Cross-platform OS clipboard for the drawn path (Linux/Windows). macOS uses
# the native NSTextField's own Cut/Copy/Paste, so it needs no clipboard crate.
arboard = { version = "3.4", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
criterion = "0.8.2"
libc = "0.2.177"
# Bundled so SQLite compiles from source rather than linking whatever the host
# happens to have. That keeps the same database engine on all three operating
# systems and keeps cross-compiling to aarch64 Linux working, which a system
# library would not.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Native file dialogs on all three systems. Default features use the XDG
# portal on Linux rather than GTK, so no GTK development libraries are
# needed to build.
rfd = "0.17"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tempfile = "3.27.0"
taffy = "0.11.0-experimental-cache-fix.3"
toml = "0.9.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
wasmtime = { version = "43.0.2", features = ["component-model"] }
wasmparser = "0.244.0"
wit-parser = "0.244.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
