[workspace]
resolver = "2"
members = [
    "crates/adapter-common",
    "crates/presenter-gpu",
    "crates/adapter-android",
    "crates/adapter-ios",
    "crates/player-android",
    "crates/player-ios",
    "crates/adapter-linux",
    "crates/adapter-macos",
    "crates/adapter-web",
    "crates/adapter-windows",
    "crates/bindings-rust",
    "crates/layout",
    "crates/bundle",
    "crates/manifest",
    "crates/policy",
    "crates/runtime",
    "crates/cli",
    "crates/mcp",
    "crates/krate-hub",
    "crates/tools",
    "crates/author",
    "crates/port",
]
exclude = [
    "apps/krate-curl",
    "apps/krate-cat",
    "apps/krate-clock",
    "apps/krate-bounce",
    "apps/krate-cubes",
    "apps/krate-chart",
    "apps/krate-hello-gui",
    "apps/krate-notes",
    "apps/krate-checklist",
    "apps/krate-calc",
    "apps/krate-bigscroll",
    "apps/krate-keyvault",
    "apps/krate-fetch",
    "apps/krate-paint",
    "apps/krate-contacts",
    "apps/krate-settings",
    "apps/krate-nova",
    "apps/krate-spriteproof",
    "apps/krate-nova2",
    "apps/krate-nova2/art-gen",
    "apps/krate-filetree",
    "apps/krate-convert",
    "apps/krate-weather",
    "apps/krate-clip",
    "apps/krate-dashboard",
    "apps/krate-timer",
    "test/integration/hello-world",
    "test/integration/phase2-smoke",
    "test/integration/print-loop",
]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/incyashraj/krate"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0.102"
# Cross-platform OS clipboard for the drawn path (Linux/Windows). macOS uses
# the native NSTextField's own Cut/Copy/Paste, so it needs no clipboard crate.
arboard = { version = "3.4", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
criterion = "0.8.2"
libc = "0.2.177"
# Bundled so SQLite compiles from source rather than linking whatever the host
# happens to have. That keeps the same database engine on all three operating
# systems and keeps cross-compiling to aarch64 Linux working, which a system
# library would not.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Native file dialogs on all three systems. Default features use the XDG
# portal on Linux rather than GTK, so no GTK development libraries are
# needed to build.
rfd = "0.17"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# WebSocket framing for net.ws; TLS through the same rustls family ureq uses.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tempfile = "3.27.0"
taffy = "0.11.0-experimental-cache-fix.3"
toml = "0.9.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
# pulley: the portable interpreter backend, selected at engine init on
# iOS where executable pages are forbidden. Compiled in everywhere, used
# only where JIT cannot be.
wasmtime = { version = "46.0.3", features = ["component-model", "pulley"] }
wasmparser = "0.244.0"
wit-parser = "0.244.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
