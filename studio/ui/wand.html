<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Change this app</title>
<style>
  :root {
    --bg: #101116; --panel: #14151b; --line: rgba(255, 255, 255, 0.1);
    --text: #ffffff; --muted: rgba(255, 255, 255, 0.58);
    --faint: rgba(255, 255, 255, 0.34); --blue: #6291ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; }
  body {
    font: 13.5px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased;
    display: flex; align-items: stretch; padding: 10px;
  }
  .card {
    position: relative; flex: 1; display: flex; flex-direction: column;
    background: var(--bg); border: 1px solid var(--line); border-radius: 18px;
    padding: 15px 18px 14px; overflow: hidden;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  /* the twilight the rest of Krate lives in, kissing the card's floor */
  .card::after {
    content: ""; position: absolute; left: -20%; right: -20%; bottom: -55px;
    height: 90px; pointer-events: none; filter: blur(18px);
    background:
      radial-gradient(60% 100% at 50% 100%, rgba(124, 108, 255, 0.34), transparent 75%),
      radial-gradient(110% 100% at 50% 110%, rgba(74, 70, 216, 0.4), transparent 80%);
  }
  .card > * { position: relative; z-index: 1; }
  .drag { position: absolute; inset: 0 44px auto 0; height: 40px; z-index: 2; }
  .top { display: flex; align-items: center; gap: 9px; padding-right: 26px; }
  .top img { width: 16px; height: 16px; opacity: 0.9; }
  .top b { font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top span { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .x {
    position: absolute; top: 12px; right: 12px; width: 26px; height: 26px;
    display: grid; place-items: center; border: 0; background: none; z-index: 3;
    color: var(--faint); cursor: pointer; border-radius: 8px; font-size: 13px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .x:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
  .lead { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .row { display: flex; gap: 8px; margin-top: 11px; }
  input {
    flex: 1; min-width: 0; padding: 10px 13px; border-radius: 11px;
    border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35);
    color: var(--text); font: inherit; font-size: 13px; outline: none;
    transition: border-color 0.15s ease;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: rgba(98, 145, 255, 0.6); }
  button.go {
    flex: none; padding: 10px 16px; border-radius: 11px; border: 0;
    background: var(--text); color: #0a0a0a; font: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  button.go:hover { transform: translateY(-1px); }
  button.go:active { transform: none; }
  button.go:disabled { opacity: 0.4; cursor: default; transform: none; }
  .status { display: flex; align-items: center; gap: 8px; min-height: 18px;
    margin-top: 9px; font-size: 12px; color: var(--muted); }
  .status .words { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.err .words { color: #ff9aab; white-space: normal; }
  .status.ok .words { color: #7ee2a8; }
  .pulse { flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.2; } }
  .hidden { display: none !important; }
  .invite p { color: var(--muted); font-size: 12.5px; margin-top: 6px; line-height: 1.55; }
  .invite .row { margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="drag" data-tauri-drag-region></div>
  <button class="x" id="close" title="Close">&#10005;</button>

  <div id="wish">
    <div class="top">
      <img src="krate-glyph-white.png" alt="" />
      <b id="appName">This app</b><span>is yours to change</span>
    </div>
    <p class="lead">Tell it what you'd like different, in your own words.</p>
    <div class="row">
      <input id="box" placeholder="bigger text&hellip; a dark mode&hellip; split it by percentage&hellip;" maxlength="500" />
      <button class="go" id="go">Change it</button>
    </div>
    <p class="status" id="status"><span class="pulse hidden" id="dot"></span><span class="words" id="words"></span></p>
  </div>

  <div class="invite hidden" id="invite">
    <div class="top">
      <img src="krate-glyph-white.png" alt="" />
      <b id="appName2">This app</b><span>is yours to change</span>
    </div>
    <p>Changing an app needs an AI to do the writing. Krate Studio sets one
    up free -- then every app you're ever given listens to you.</p>
    <div class="row"><button class="go" id="openStudio">Open Krate Studio</button></div>
  </div>
</div>

<script>
const tauri = window.__TAURI__;
const invoke = (c, a) => tauri.core.invoke(c, a);
const $ = (id) => document.getElementById(id);
let target = null;
let busy = false;

function pretty(path) {
  const stem = (path.split(/[\\/]/).pop() || "").replace(/\.krate$/i, "");
  return stem.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()) || "This app";
}
function setStatus(kind, text, pulsing) {
  $("status").className = "status" + (kind ? " " + kind : "");
  $("words").textContent = text || "";
  $("dot").classList.toggle("hidden", !pulsing);
}

async function init() {
  target = await invoke("wand_target");
  const name = target ? pretty(target) : "This app";
  $("appName").textContent = name;
  $("appName2").textContent = name;
  try {
    const agents = await invoke("agents");
    const ready = (agents || []).some((a) => a.state !== "missing" && a.state !== "not-ready");
    if (!ready) {
      $("wish").classList.add("hidden");
      $("invite").classList.remove("hidden");
      return;
    }
  } catch (e) { /* if the probe fails, let them try; the error will say */ }
  $("box").focus();
}
init();

tauri.event.listen("wand-target", (ev) => {
  target = ev.payload;
  $("appName").textContent = pretty(target);
  $("appName2").textContent = pretty(target);
});
tauri.event.listen("wand-line", (ev) => {
  if (busy) setStatus("", String(ev.payload).slice(0, 90), true);
});

async function go() {
  const wish = $("box").value.trim();
  if (!wish || !target || busy) return;
  busy = true;
  $("go").disabled = true;
  $("box").disabled = true;
  setStatus("", "Making it yours -- a few minutes. Leave this open.", true);
  try {
    await invoke("wand_change", { path: target, wish });
    setStatus("ok", "Done -- opening the new version. Want more? Just say so.", false);
    $("box").value = "";
  } catch (err) {
    const words = String(err).split("\n").filter(Boolean).pop() || "that change did not take";
    setStatus("err", words.slice(0, 160) + " -- the app is untouched.", false);
  }
  busy = false;
  $("go").disabled = false;
  $("box").disabled = false;
  $("box").focus();
}
$("go").addEventListener("click", go);
$("box").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
$("openStudio").addEventListener("click", () => invoke("wand_open_studio"));
$("close").addEventListener("click", () => invoke("wand_close"));
</script>
</body>
</html>
