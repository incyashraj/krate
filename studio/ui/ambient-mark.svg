<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" aria-hidden="true">
  <!-- The Krate mark, as ambient light.

       Traced from krate-logo.png, not drawn from memory. The PNG was
       measured row by row and every number below comes from that:

         the mark is square    347 x 349 px, ratio 0.994
         roof                  apex at 0%, full width by 26%
         gap                   28%
         slab 1                top face 30%..44%, front face to 46%
         slab 2                48%..58%, front face to 60%
         slab 3                62%..74%, front face to 76%
         bottom point          76%..100%, tapering to the centre

       Colour sampled at the same landmarks: #a6a1ff at 18% down through
       #6d7fff at 45% to #1a1dff at 88%. Periwinkle to electric blue, which
       is what the logo does. Earlier versions guessed at violet and read
       grey on screen.

       Held quiet: this is the light behind what somebody came to read, so
       low alpha, a heavy blur, and a radial mask so it fades at its own
       edges instead of ending on a line. Both themes share the file and
       differ only in opacity. -->
  <defs>
    <linearGradient id="roof" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#b8b4ff"/>
      <stop offset="1" stop-color="#8a8dff"/>
    </linearGradient>
    <linearGradient id="tier1" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#9aa0ff"/>
      <stop offset="1" stop-color="#6d7fff"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6a7cff"/>
      <stop offset="1" stop-color="#4250fe"/>
    </linearGradient>
    <linearGradient id="tier3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3545ff"/>
      <stop offset="1" stop-color="#1a1dff"/>
    </linearGradient>
    <linearGradient id="face1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c6dff"/>
      <stop offset="1" stop-color="#3a44e8"/>
    </linearGradient>
    <linearGradient id="face2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4bf5"/>
      <stop offset="1" stop-color="#2029d8"/>
    </linearGradient>
    <linearGradient id="face3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2530f5"/>
      <stop offset="1" stop-color="#1216c8"/>
    </linearGradient>

    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>

    <radialGradient id="falloff" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="soften"><rect width="1000" height="1000" fill="url(#falloff)"/></mask>
  </defs>

  <g mask="url(#soften)" filter="url(#wash)">
    <!-- Roof: apex at the top, full width by 26%. -->
    <path d="M500 0 L1000 265 L0 265 Z" fill="url(#roof)"/>

    <!-- Slab 1: front face first, then the top face over it. -->
    <path d="M0 300 L500 432 L1000 300 L1000 432 L500 462 L0 432 Z" fill="url(#face1)"/>
    <path d="M0 300 L1000 300 L500 440 Z" fill="url(#tier1)"/>

    <!-- Slab 2. -->
    <path d="M0 498 L500 606 L1000 498 L1000 606 L500 636 L0 606 Z" fill="url(#face2)"/>
    <path d="M0 498 L1000 498 L500 606 Z" fill="url(#tier2)"/>

    <!-- Slab 3, its front face running down to the bottom point. -->
    <path d="M0 672 L500 780 L1000 672 L1000 790 L500 1000 L0 790 Z" fill="url(#face3)"/>
    <path d="M0 672 L1000 672 L500 780 Z" fill="url(#tier3)"/>
  </g>
</svg>
