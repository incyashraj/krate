<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" aria-hidden="true">
  <!-- The Krate mark, as the faintest wash of light.

       The mark is a STACK: a wide flat cap over three horizontal slabs,
       each slab a shallow diamond seen from slightly above, with a thin
       gap of background between them. Wider than it is tall. It is not a
       triangle, and an earlier version of this file drew it as one.

       Held deliberately quiet. This sits under everything a person came
       here to read, so it is a suggestion of the shape and its colour, not
       a picture of the logo: low alpha, generous blur, no bright edge
       anywhere to pull the eye. If it is the first thing noticed, it is
       wrong.

       One file for both themes; each sets its own opacity, because the same
       wash that reads on near-black is a smudge on off-white. -->
  <defs>
    <!-- The logo's own range: pale periwinkle at the lit top edge down to
         the deeper blue-violet of the slab fronts. -->
    <linearGradient id="slab" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b9b0ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7b6bf2" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4733d9" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="cap" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#cdc6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b6bf2" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Enough blur to lose every edge while keeping the silhouette. -->
    <filter id="wash" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <!-- Fades the whole stack out at its own edges, so nothing ends on a
         line: the wash meets the page instead of stopping against it. -->
    <radialGradient id="falloff" cx="0.5" cy="0.48" r="0.58">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="soften">
      <rect width="1400" height="1000" fill="url(#falloff)"/>
    </mask>
  </defs>

  <g mask="url(#soften)" filter="url(#wash)">
    <!-- The cap: a wide, shallow pyramid over the stack. -->
    <path d="M700 250 L1240 420 L160 420 Z" fill="url(#cap)"/>

    <!-- Three slabs, each a shallow diamond with a front face below it.
         The gaps between them are what makes the mark read as layers. -->
    <path d="M160 460 L700 700 L1240 460 L1240 520 L700 760 L160 520 Z" fill="url(#slab)"/>
    <path d="M160 590 L700 830 L1240 590 L1240 650 L700 890 L160 650 Z" fill="url(#slab)" opacity="0.75"/>
    <path d="M200 330 L700 555 L1200 330 L1200 380 L700 605 L200 380 Z" fill="url(#slab)" opacity="0.85"/>
  </g>
</svg>
