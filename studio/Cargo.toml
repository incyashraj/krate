# Krate Studio: the desktop shell around the krate engine.
#
# Deliberately NOT a member of the repo workspace. The studio pulls in Tauri
# and a webview stack that the runtime, the CLI, and CI have no reason to
# compile or lock against; keeping it standalone means `cargo test
# --workspace` at the root is exactly as heavy after the studio as before it.
#
# It is also deliberately thin. Every real operation -- detecting AIs,
# authoring, packing, verifying, publishing -- happens by spawning the same
# `krate` binary the terminal uses. One engine, two faces; the same reason
# krate-open.exe hands to krate.exe instead of reimplementing it.

[package]
name = "krate-studio"
version = "0.2.3"
edition = "2021"
description = "Describe an app, watch it become real, open it, share it."
# The open-core boundary: the player and format stay MIT/Apache, the
# product layer is BSL 1.1 (converts to Apache-2.0 on the Change Date).
license-file = "LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# The same dialog crate the runtime's own host pickers use.
rfd = "0.15"
libc = "0.2"
# Parsing the sign-in handoff fragment; tauri already depends on it.
url = "2"
# Reading Krate Cloud. Same version and features as the workspace's own hub
# client, so the studio and the engine speak to the hub identically.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
# Verifying the update we downloaded before running it.
sha2 = "0.10"
tauri-plugin-notification = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Detached from the repository workspace on purpose; see the header comment.
[workspace]

# The macOS share sheet: Send the file must put the card in AirDrop, Mail
# and Messages, not just a Finder window. Same objc2 versions the macOS
# adapter pins, so the two never fight over a symbol. This table sits BELOW
# [dependencies] on purpose: a target table opened mid-list once swallowed
# every dependency written after it -- serde through the notification
# plugin quietly became macOS-only, and the Linux studio died in CI on a
# missing notification permission while every Mac build stayed green.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSSharingService", "NSView", "NSWindow", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSGeometry", "NSObject", "NSString", "NSURL", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
