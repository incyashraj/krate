<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing B — Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  :root{
    --void:#08090b; --panel:#0f1114; --raised:#15181c;
    --line:#1d2126; --line-2:#2b3037;
    --text:#fff; --muted:rgba(255,255,255,.5); --faint:rgba(255,255,255,.28);
    --blue:#6291ff; --cyan:#6cf4d7;
    --sans:"Inter Tight",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--void);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  .win{height:100vh;display:grid;grid-template-columns:216px 1fr}

  /* left: a real sidebar — this is a workbench, not a search page */
  .side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:14px 12px}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;-webkit-app-region:drag}
  .brand .mk{width:16px;height:16px;border:1.5px solid rgba(255,255,255,.3);border-radius:5px;transform:rotate(45deg)}
  .brand span{font-size:11.5px;letter-spacing:.16em;color:var(--faint)}

  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:13.5px;
    color:var(--muted);background:none;border:0;padding:9px 10px;border-radius:9px;cursor:pointer;
    text-align:left;transition:background .15s,color .15s;position:relative}
  .nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .nav button.on{background:rgba(255,255,255,.07);color:var(--text);font-weight:500}
  .nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:2px;
    background:var(--blue);border-radius:2px}
  .nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
  .acct{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;cursor:pointer;transition:background .15s}
  .acct:hover{background:rgba(255,255,255,.04)}
  .acct .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#2b3a63,#1b2440);
    display:grid;place-items:center;font-size:11px;color:var(--blue);font-weight:600}
  .acct .who{font-size:12.5px}
  .acct .st{font-family:var(--mono);font-size:10px;color:var(--faint)}

  /* right: work surface */
  .main{display:flex;flex-direction:column;min-width:0}
  .top{height:52px;flex:none;display:flex;align-items:center;padding:0 20px;gap:9px;
    border-bottom:1px solid var(--line);-webkit-app-region:drag}
  .top .agent{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;
    color:var(--muted);background:var(--raised);border:1px solid var(--line);padding:5px 11px;
    border-radius:999px;cursor:pointer;-webkit-app-region:no-drag}
  .top .agent .d{width:6px;height:6px;border-radius:50%;background:var(--cyan)}

  .surface{flex:1;overflow:auto;padding:44px 40px 40px;display:flex;flex-direction:column}
  .lede{margin-bottom:26px}
  .lede h1{font-size:clamp(25px,3vw,31px);font-weight:500;letter-spacing:-.035em;margin:0 0 7px;
    opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.9,.3,1) .05s forwards}
  .lede p{color:var(--muted);margin:0;font-size:14px;
    opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.9,.3,1) .13s forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 11px;
    max-width:760px;transition:border-color .25s,box-shadow .25s;
    opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.9,.3,1) .2s forwards}
  .box:focus-within{border-color:rgba(98,145,255,.45);box-shadow:0 0 0 4px rgba(98,145,255,.06)}
  .box textarea{width:100%;background:none;border:0;outline:0;resize:none;color:var(--text);
    font-family:var(--sans);font-size:15px;line-height:1.5;padding:2px 2px 13px;max-height:130px}
  .box textarea::placeholder{color:var(--faint)}
  .row{display:flex;align-items:center;gap:8px}
  .tool{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;
    cursor:pointer;transition:color .15s,border-color .15s}
  .tool:hover{color:var(--text);border-color:var(--line-2)}
  .send{margin-left:auto;width:33px;height:33px;border-radius:50%;border:0;background:var(--blue);
    color:#04122e;cursor:pointer;display:grid;place-items:center;transition:transform .16s,filter .16s}
  .send:hover{filter:brightness(1.1);transform:scale(1.06)}

  /* continue where you left off — the workbench idea */
  .cont{margin-top:34px;max-width:760px;
    opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.9,.3,1) .3s forwards}
  .cont h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:0 0 12px;font-weight:400}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    cursor:pointer;transition:border-color .18s,transform .18s;display:flex;gap:11px;align-items:center}
  .card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .card .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#181b21,#101216);
    border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .card .ic i{width:13px;height:13px;border:1.4px solid rgba(255,255,255,.25);border-radius:4px;
    transform:rotate(45deg);display:block}
  .card .nm{font-size:13px;font-weight:500;letter-spacing:-.01em}
  .card .mt{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="win">
  <aside class="side">
    <div class="brand"><span class="mk"></span><span>KRATE</span></div>
    <nav class="nav">
      <button class="on">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        New app
      </button>
      <button>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 6.5h11" stroke="currentColor" stroke-width="1.3"/></svg>
        Your apps <span class="ct">12</span>
      </button>
      <button>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4.5 11.5a2.5 2.5 0 010-5 3.5 3.5 0 016.8-1.2A2.9 2.9 0 1112 11.5H4.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Cloud <span class="ct">3</span>
      </button>
      <button>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 2v1.6M8 12.4V14M2 8h1.6M12.4 8H14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Settings
      </button>
    </nav>
    <div class="side-foot">
      <div class="acct">
        <div class="av">Y</div>
        <div><div class="who">Yashraj</div><div class="st">signed in</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="agent"><span class="d"></span>Claude</button>
    </div>

    <div class="surface">
      <div class="lede">
        <h1>What should we make?</h1>
        <p>Describe it in plain words. A few minutes later it is a real app.</p>
      </div>

      <div class="box">
        <textarea rows="1" placeholder="A habit tracker that saves my streaks…"></textarea>
        <div class="row">
          <button class="tool">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M13 7.5l-4.9 4.9a3.2 3.2 0 01-4.5-4.5l5.3-5.3a2.1 2.1 0 013 3l-5.3 5.3a1 1 0 01-1.5-1.5L9.8 4.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Add a picture
          </button>
          <button class="tool">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 5.5A1.5 1.5 0 013.5 4h2.6l1.2 1.5h5.2A1.5 1.5 0 0114 7v4.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 11.5v-6z" stroke="currentColor" stroke-width="1.3"/></svg>
            Open a .krate
          </button>
          <button class="send" aria-label="Make it">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 13V3.5M8 3.5L3.8 7.7M8 3.5l4.2 4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="cont">
        <h2>Pick up where you left off</h2>
        <div class="cards">
          <div class="card"><div class="ic"><i></i></div><div><div class="nm">Habit Tracker</div><div class="mt">today · 34 KB</div></div></div>
          <div class="card"><div class="ic"><i></i></div><div><div class="nm">Tip Splitter</div><div class="mt">yesterday · 21 KB</div></div></div>
          <div class="card"><div class="ic"><i></i></div><div><div class="nm">Snake</div><div class="mt">2 days ago · 28 KB</div></div></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const ta=document.querySelector("textarea");
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,130)+"px"});
  document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}));
</script>
</body>
</html>
