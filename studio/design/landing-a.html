<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing A — Void</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  :root{
    --void:#050506; --panel:#0e0f12; --raised:#15171b;
    --line:#1c1f24; --line-2:#2a2e35;
    --text:#fff; --muted:rgba(255,255,255,.5); --faint:rgba(255,255,255,.28);
    --blue:#6291ff;
    --sans:"Inter Tight",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--void);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}

  .win{height:100vh;display:flex;flex-direction:column}

  /* titlebar: almost nothing */
  .tbar{height:52px;flex:none;display:flex;align-items:center;padding:0 16px;gap:11px;-webkit-app-region:drag}
  .lights{display:flex;gap:8px}
  .lights i{width:11px;height:11px;border-radius:50%;display:block}
  .lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
  .tright{margin-left:auto;display:flex;gap:7px;-webkit-app-region:no-drag}
  .tchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    background:transparent;border:1px solid var(--line);padding:5px 11px;border-radius:999px;
    cursor:pointer;transition:border-color .15s,color .15s}
  .tchip:hover{border-color:var(--line-2);color:var(--text)}
  .tchip .d{width:6px;height:6px;border-radius:50%;background:#6cf4d7}

  /* the void: one object, nothing else */
  .body{flex:1;display:grid;place-items:center;padding:0 24px;position:relative}

  .halo{position:absolute;width:900px;height:500px;left:50%;top:44%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(98,145,255,.10),transparent 72%);
    filter:blur(20px);pointer-events:none}

  .core{width:min(600px,100%);position:relative}

  h1{font-size:clamp(30px,4.4vw,42px);font-weight:500;letter-spacing:-.04em;
    margin:0 0 34px;text-align:center;text-wrap:balance;line-height:1.12;
    opacity:0;transform:translateY(12px);animation:rise .7s cubic-bezier(.2,.9,.3,1) .1s forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:17px 17px 12px;transition:border-color .25s,box-shadow .25s;
    opacity:0;transform:translateY(12px);animation:rise .7s cubic-bezier(.2,.9,.3,1) .2s forwards}
  .box:focus-within{border-color:rgba(98,145,255,.45);box-shadow:0 0 0 4px rgba(98,145,255,.07)}
  .box textarea{width:100%;background:none;border:0;outline:0;resize:none;color:var(--text);
    font-family:var(--sans);font-size:16px;line-height:1.5;padding:2px 2px 14px;max-height:140px}
  .box textarea::placeholder{color:var(--faint)}
  .row{display:flex;align-items:center;gap:8px}
  .tool{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;
    cursor:pointer;transition:color .15s,border-color .15s}
  .tool:hover{color:var(--text);border-color:var(--line-2)}
  .send{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--blue);
    color:#04122e;cursor:pointer;display:grid;place-items:center;
    transition:transform .16s cubic-bezier(.3,1.5,.5,1),filter .16s}
  .send:hover{filter:brightness(1.1);transform:scale(1.06)}
  .send:active{transform:scale(.93)}

  /* dock: floats at the bottom, an OS element not page furniture */
  .dockwrap{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    display:flex;gap:9px;align-items:center;
    opacity:0;animation:rise .7s cubic-bezier(.2,.9,.3,1) .34s forwards}
  .dock{display:flex;align-items:center;gap:2px;padding:5px;background:rgba(20,22,26,.9);
    border:1px solid var(--line);border-radius:999px;position:relative;
    backdrop-filter:blur(20px);box-shadow:0 12px 34px rgba(0,0,0,.5)}
  .glide{position:absolute;top:5px;bottom:5px;left:5px;background:#fff;border-radius:999px;z-index:0;
    transition:transform .42s cubic-bezier(.2,.9,.25,1),width .42s cubic-bezier(.2,.9,.25,1)}
  .dock button{position:relative;z-index:1;font-family:var(--sans);font-size:13px;color:var(--muted);
    background:none;border:0;padding:9px 15px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:color .3s;white-space:nowrap}
  .dock button.on{color:#050506;font-weight:500}
  .dock button:not(.on):hover{color:var(--text)}
  .solo{width:40px;height:40px;border-radius:50%;background:rgba(20,22,26,.9);border:1px solid var(--line);
    display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(20px);
    box-shadow:0 12px 34px rgba(0,0,0,.5);transition:border-color .15s,transform .15s}
  .solo:hover{border-color:var(--line-2);transform:translateY(-1px)}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="win">
  <div class="tbar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="tright">
      <button class="tchip"><span class="d"></span>Claude</button>
    </div>
  </div>

  <div class="body">
    <div class="halo"></div>
    <div class="core">
      <h1>What should we make?</h1>
      <div class="box">
        <textarea rows="1" placeholder="A habit tracker that saves my streaks…"></textarea>
        <div class="row">
          <button class="tool">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M13 7.5l-4.9 4.9a3.2 3.2 0 01-4.5-4.5l5.3-5.3a2.1 2.1 0 013 3l-5.3 5.3a1 1 0 01-1.5-1.5L9.8 4.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Add a picture
          </button>
          <button class="tool">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 5.5A1.5 1.5 0 013.5 4h2.6l1.2 1.5h5.2A1.5 1.5 0 0114 7v4.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 11.5v-6z" stroke="currentColor" stroke-width="1.3"/></svg>
            Open a .krate
          </button>
          <button class="send" aria-label="Make it">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 13V3.5M8 3.5L3.8 7.7M8 3.5l4.2 4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="dockwrap">
      <nav class="dock" id="dock">
        <span class="glide" id="glide"></span>
        <button class="on">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2.5 7L8 2.5L13.5 7v6a1 1 0 01-1 1h-9a1 1 0 01-1-1V7z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>
          Home
        </button>
        <button>Recent</button>
        <button>Cloud</button>
        <button>Settings</button>
      </nav>
      <button class="solo" aria-label="Account">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.6" r="2.6" stroke="rgba(255,255,255,.45)" stroke-width="1.3"/><path d="M3.2 13.2a4.9 4.9 0 019.6 0" stroke="rgba(255,255,255,.45)" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const dock=document.getElementById("dock"),glide=document.getElementById("glide");
  const btns=[...dock.querySelectorAll("button")];
  function move(b){glide.style.width=b.offsetWidth+"px";glide.style.transform=`translateX(${b.offsetLeft-5}px)`}
  requestAnimationFrame(()=>move(btns[0]));
  btns.forEach(b=>b.addEventListener("click",()=>{btns.forEach(x=>x.classList.remove("on"));b.classList.add("on");move(b)}));
  const ta=document.querySelector("textarea");
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,140)+"px"});
</script>
</body>
</html>
