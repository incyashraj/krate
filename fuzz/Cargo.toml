[package]
name = "krate-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
krate-adapter-common = { path = "../crates/adapter-common" }
krate-manifest = { path = "../crates/manifest" }
krate-policy = { path = "../crates/policy" }
krate-bundle = { path = "../crates/bundle" }

[workspace]
members = ["."]

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logical_path_parse"
path = "fuzz_targets/logical_path_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_match"
path = "fuzz_targets/policy_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_open"
path = "fuzz_targets/bundle_open.rs"
test = false
doc = false
bench = false
