# Timesheets: hours logged per project per day, with weekly totals (a starter
# an organisation releases in its first minute on Krate). Its data is the
# team's, kept with store.org, and it asks for nothing else.

[app]
id = "dev.krate.timesheets"
name = "Timesheets"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_timesheets.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's hours"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the hours with your team, encrypted, so everyone in it sees the same totals"
required = true
