[app]
id = "com.acme.serve-probe"
name = "serve-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_serve_probe.wasm"
world = "krate:app/cli@0.1.0"

[[capabilities]]
cap = "io.stdout"
rationale = "Say what happened"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read which check to run and on which port"
required = true

[[capabilities]]
cap = "net.listen:8080"
rationale = "Serve a page to the devices on your network that open it"
required = true
