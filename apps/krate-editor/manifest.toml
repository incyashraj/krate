[app]
id = "dev.krate.editor"
name = "Editor"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_editor.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the editor window"
required = true

[[capabilities]]
cap = "time.clock"
rationale = "Blink the caret and pace the typing against real time"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the document state on exit for automated runs"
required = false

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated checks"
required = false
