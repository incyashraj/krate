[app]
id = "dev.krate.slowfetch"
name = "Slowfetch"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_slowfetch.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the comparison window"
required = true

# No network capability, deliberately.
#
# The app teaches what a slow request does to a window, and the timings it
# shows were measured on a real run. Asking for the network to make a
# teaching point would be asking for a permission it does not need -- which
# is the opposite of what this runtime is for, and check-app would refuse it
# anyway because the code never imports the net interface.

[[capabilities]]
cap = "io.stdout"
rationale = "Report state on exit for automated runs"
required = false

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated checks"
required = false
