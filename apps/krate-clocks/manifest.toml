[app]
id = "dev.krate.clocks"
name = "World Clock"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_clocks.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the world clock window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the status line for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
