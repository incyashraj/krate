[app]
id = "dev.krate.contacts"
name = "Contacts"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_contacts.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the contacts window"
required = true

[[capabilities]]
cap = "store.sql"
rationale = "Keep contacts in an application database and query them back"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the queried row count for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
