[app]
id = "dev.krate.tray-probe"
name = "Tray Probe"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_tray_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window that says what the tray icon did"
required = true

[[capabilities]]
cap = "ui.tray"
rationale = "A counter in the menu bar that keeps running with its window closed"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report each choice and click, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
