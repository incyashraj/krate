[app]
id = "dev.krate.darkroom"
name = "Darkroom"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_darkroom.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the editing window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the run for automated checks"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run and stress flags"
required = true
