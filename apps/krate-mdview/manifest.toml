[app]
id = "dev.krate.mdview"
name = "Mdview"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_mdview.wasm"
world = "krate:app/gui@0.2.0"

# The window is the app. Without it there is nothing to read a document in,
# so this is the capability that gates the whole thing.
[[capabilities]]
cap = "ui.window:create"
rationale = "Show the document and its reading surface"
required = true

# The app has a `docs/` directory of its own inside the sandbox, and the
# explorer lists that. Narrower than the original by design: no path outside
# `docs/` is nameable.
[[capabilities]]
cap = "fs.list:docs/**"
rationale = "List the markdown files shown in the file explorer"
required = false

[[capabilities]]
cap = "fs.read:docs/**"
rationale = "Read the markdown files the explorer opens"
required = false

# `Save a copy` writes the document the person opened via the dialog into
# `docs/`, which is how a chosen file becomes one the explorer can reopen.
[[capabilities]]
cap = "fs.write:docs/**"
rationale = "Save an opened document into the app's docs folder"
required = false

[[capabilities]]
cap = "fs.mkdir:docs/**"
rationale = "Create the docs folder on first run"
required = false

[[capabilities]]
cap = "fs.remove:docs/**"
rationale = "Delete a document from the docs folder"
required = false

# Replaces the source's rfd native picker. The person's click is the grant,
# so this reaches files outside `docs/` without any path-shaped capability.
[[capabilities]]
cap = "ui.dialog:file-open"
rationale = "Let you pick a markdown file to open from anywhere"
required = false

# Session persistence: open tabs, theme, zoom, outline visibility, recents.
[[capabilities]]
cap = "store.kv"
rationale = "Remember your open document, theme, and zoom"
required = false

# `Copy document`, from the source's clipboard use.
[[capabilities]]
cap = "ui.clipboard:write"
rationale = "Copy the document text to the clipboard"
required = false

# Report state on exit for automated runs.
[[capabilities]]
cap = "io.stdout"
rationale = "Report state on exit for automated runs"
required = false

# Read the quick-run flag used by automated checks.
[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated checks"
required = false
