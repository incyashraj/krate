[package]
name = "krate-fetch"
version = "0.1.0-dev"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/incyashraj/krate"
rust-version = "1.91"

[dependencies]
# The SDK's gui world: krate::ui, krate::gfx, and every Phase 2 helper (IC-298).
krate = { path = "../../crates/bindings-rust", features = ["gui"] }
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

# Standalone: this app builds on its own, so it carries an empty workspace table
# to stop cargo walking up to a parent workspace manifest.
[workspace]

[lib]
crate-type = ["cdylib"]

# Gate the generated `impl std::error::Error` behind a feature nobody turns
# on, so a GUI app that needs a real dependency can be `#![no_std]`.
[package.metadata.component.bindings]
std_feature = true

[package.metadata.component]
package = "krate:fetch"

[package.metadata.component.target]
path = "../../wit/krate/phase4"
world = "gui"

[package.metadata.component.target.dependencies]
"krate:io" = { path = "../../wit/krate/phase4/deps/io" }
"krate:fs" = { path = "../../wit/krate/phase4/deps/fs" }
"krate:net" = { path = "../../wit/krate/phase4/deps/net" }
"krate:time" = { path = "../../wit/krate/phase4/deps/time" }
"krate:locale" = { path = "../../wit/krate/phase4/deps/locale" }
"krate:resources" = { path = "../../wit/krate/phase4/deps/resources" }
"krate:store" = { path = "../../wit/krate/phase4/deps/store" }
"krate:random" = { path = "../../wit/krate/phase4/deps/random" }
"krate:ui" = { path = "../../wit/krate/phase4/deps/ui" }
"krate:gfx" = { path = "../../wit/krate/phase4/deps/gfx" }
"krate:audio" = { path = "../../wit/krate/phase4/deps/audio" }
"krate:camera" = { path = "../../wit/krate/phase4/deps/camera" }
"krate:speech" = { path = "../../wit/krate/phase4/deps/speech" }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
