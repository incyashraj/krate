[app]
id = "com.acme.loop-probe"
name = "loop-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_loop_probe.wasm"
world = "krate:app/cli@0.1.0"

[[capabilities]]
cap = "io.stdout"
rationale = "Say it started"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read which loop to run"
required = true
