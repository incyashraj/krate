[app]
id = "dev.krate.code"
name = "Krate Code"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_code.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the editor window"
required = true

# No fs capability, deliberately. The person picks a project folder and the
# pick is the grant: every file is read and written through picked/<token>/
# for this run only, so the editor can touch nothing they did not choose.
[[capabilities]]
cap = "ui.dialog:open-folder"
rationale = "Open a project folder you choose -- the editor can read and save only inside it, and only while it is open"
required = true

[[capabilities]]
cap = "store.kv"
rationale = "Remember your editor settings (theme, how a click behaves, panel sizes) between runs"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the editor state on exit for automated runs"
required = false

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated checks"
required = false
