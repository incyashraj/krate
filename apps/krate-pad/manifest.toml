[app]
id = "dev.krate.pad"
name = "Pad"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_pad.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the pad window"
required = true

# The point of the app. Optional on purpose: without it the pad still opens
# and shows what a share looks like, and says it is not joined -- an app that
# refuses to start because one capability was declined teaches the person
# nothing about what they declined.
[[capabilities]]
cap = "store.shared"
rationale = "Keep these notes in step with the other machines holding the invite code"
required = false

[[capabilities]]
cap = "io.stdout"
rationale = "Report state on exit for automated runs"
required = false

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated checks"
required = false
