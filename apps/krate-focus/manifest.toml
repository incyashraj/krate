[app]
id = "dev.krate.focus"
name = "Focus"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_focus.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the focus timer window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report timer status for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true

[[capabilities]]
cap = "store.kv"
rationale = "Remember completed focus sessions across restarts"
required = true
