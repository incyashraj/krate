[app]
id = "dev.krate.relay"
name = "Relay"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_relay.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the game window"
required = true

[[capabilities]]
cap = "store.kv"
rationale = "Remember which level you reached and your best time"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the run for automated checks"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag"
required = true
