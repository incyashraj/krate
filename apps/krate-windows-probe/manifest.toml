[app]
id = "dev.krate.twowin-probe"
name = "krate-windows-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_windows_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the two probe windows"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Say whether the second window opened"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick flag"
required = true
