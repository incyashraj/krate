[app]
id = "dev.krate.notice-probe"
name = "Notice Board"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_notice_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window with three buttons"
required = true

[[capabilities]]
cap = "ui.notify"
rationale = "Show a notification, replace it, and take it back"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report each answer, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
