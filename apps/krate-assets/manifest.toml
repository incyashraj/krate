# Assets: the team's equipment, who has each thing, and its history (a starter
# an organisation releases in its first minute on Krate). Its data is the
# team's, kept with store.org, and it asks for nothing else.

[app]
id = "dev.krate.assets"
name = "Assets"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_assets.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's equipment"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the list of equipment with your team, encrypted, so everyone in it sees who has what"
required = true
