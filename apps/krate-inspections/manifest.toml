# Inspections: checklists of things to check, inspections run against them,
# and what failed (a starter an organisation releases in its first minute on
# Krate). Its data is the team's, kept with store.org, and it asks for nothing
# else.

[app]
id = "dev.krate.inspections"
name = "Inspections"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_inspections.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's inspections"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the checklists and inspections with your team, encrypted, so everyone in it sees the same ones"
required = true
