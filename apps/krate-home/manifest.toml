# Krate's own screens on a phone: your apps, and the apps on the hub. A
# trusted guest the phone player runs; the player does the network and the
# picture decoding, writes what to show into this app's folder, and reads
# back from stdout which app the person opened or asked to get.

[app]
id = "dev.krate.home"
name = "Krate"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_home.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Draw your apps and the hub"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Tell the player which app to open"
required = true

[[capabilities]]
cap = "fs.read:./library.txt"
rationale = "Read the list of your apps the player prepared"
required = true

[[capabilities]]
cap = "fs.read:./discover.txt"
rationale = "Read the list of apps on the hub the player prepared"
required = true

[[capabilities]]
cap = "fs.read:./start.txt"
rationale = "Open on the screen the player asked for"
required = false

[[capabilities]]
cap = "fs.read:./hub-state.txt"
rationale = "Show whether the hub is loading, offline or failed"
required = false

[[capabilities]]
cap = "fs.read:./progress.txt"
rationale = "Show how far a download has got"
required = false

[[capabilities]]
cap = "fs.read:./account.txt"
rationale = "Show who is signed in, their organisations and published apps"
required = false

[[capabilities]]
cap = "fs.read:./sync.txt"
rationale = "Show whether your apps' data is the same on your other devices"
required = false

[[capabilities]]
cap = "io.args"
rationale = "Show the recovery code once, without it ever touching a file"
required = false

[[capabilities]]
cap = "fs.read:./perms/**"
rationale = "Show what each of your apps may use"
required = false

[[capabilities]]
cap = "fs.read:./art/**"
rationale = "Show the pictures of the apps the player prepared"
required = true
