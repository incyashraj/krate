# Requests: anyone asks, the person they name approves or declines with a
# note (a starter an organisation releases in its first minute on Krate). Its
# data is the team's, kept with store.org, and it asks for nothing else.

[app]
id = "dev.krate.requests"
name = "Requests"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_requests.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's requests"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the requests and their answers with your team, encrypted, so everyone in it sees the same ones"
required = true
