[app]
id = "dev.krate.player"
name = "Player"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_player.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the player window"
required = true

[[capabilities]]
cap = "audio.playback"
rationale = "Play the music through the speakers"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report what is playing on a quick run"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run argument used by automated checks"
required = true
