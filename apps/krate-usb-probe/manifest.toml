[app]
id = "com.acme.usb-probe"
name = "usb-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_usb_probe.wasm"
world = "krate:app/cli@0.1.0"

[[capabilities]]
cap = "io.stdout"
rationale = "Print what the device said"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read which check to run"
required = true

[[capabilities]]
cap = "device.usb:1915:7777"
rationale = "Talk to the radio dongle you pick"
required = true
