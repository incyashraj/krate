[app]
id = "dev.krate.bounce"
name = "krate-bounce"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_bounce.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the animation window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report what was drawn for automated verification"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run argument used by automated verification"
required = true
