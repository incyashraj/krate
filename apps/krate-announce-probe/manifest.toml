[app]
id = "com.acme.announce-probe"
name = "Shop Floor"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_announce_probe.wasm"
world = "krate:app/cli@0.1.0"

[[capabilities]]
cap = "io.stdout"
rationale = "Say what happened"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read which check to run and on which port"
required = true

[[capabilities]]
cap = "net.listen:8080"
rationale = "The floor's tablets open the checklist and find it by name"
required = true
