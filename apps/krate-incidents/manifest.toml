# Incidents: what went wrong, how bad it was, and the actions taken until it
# is closed (a starter an organisation releases in its first minute on Krate).
# Its data is the team's, kept with store.org, and it asks for nothing else.

[app]
id = "dev.krate.incidents"
name = "Incidents"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_incidents.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's incident log"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the incident log with your team, encrypted, so everyone in it sees the same one"
required = true
