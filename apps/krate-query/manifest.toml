[app]
id = "dev.krate.query"
name = "Query"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_query.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the query window"
required = true

[[capabilities]]
cap = "store.sql"
rationale = "The database this client reads and writes"
required = false

[[capabilities]]
cap = "io.stdout"
rationale = "Report state on exit for automated runs"
required = false

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated checks"
required = false
