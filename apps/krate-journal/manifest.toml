[app]
id = "dev.krate.journal"
name = "Journal"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_journal.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the journal chat window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report a status line for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true

[[capabilities]]
cap = "store.kv"
rationale = "Keep your journal entries between runs"
required = true
