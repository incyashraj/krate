[app]
id = "com.acme.watch-probe"
name = "watch-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_watch_probe.wasm"
world = "krate:app/cli@0.1.0"

[[capabilities]]
cap = "io.stdout"
rationale = "Print what the watch saw"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read which folder to watch"
required = true

[[capabilities]]
cap = "fs.list:./inbox/**"
rationale = "Watch the inbox folder"
required = false

[[capabilities]]
cap = "fs.write:./inbox/**"
rationale = "Drop a file into the inbox to see it noticed"
required = false

[[capabilities]]
cap = "fs.remove:./inbox/**"
rationale = "Take the file away again"
required = false
