[app]
id = "com.acme.pointer-probe"
name = "pointer-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_pointer_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window for the pointer to be over"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Print what the pointer reports"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read how long to watch"
required = true
