# Shift Rota: a week of shifts per person, and swaps (a starter an
# organisation releases in its first minute on Krate). Its data is the team's,
# kept with store.org, and it asks for nothing else.

[app]
id = "dev.krate.shift-rota"
name = "Shift Rota"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_shift_rota.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's rota"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the rota with your team, encrypted, so everyone in it sees the same shifts"
required = true
