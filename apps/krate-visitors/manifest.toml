# Visitors: who signed in, who they came to see, and who is on site now (a
# starter an organisation releases in its first minute on Krate). Its data is
# the team's, kept with store.org, and it asks for nothing else.

[app]
id = "dev.krate.visitors"
name = "Visitors"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_visitors.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's visitor log"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the visitor log with your team, encrypted, so reception and hosts see the same one"
required = true
