# An empty [workspace] table makes this app its own workspace root, so it
# resolves the same wherever the directory sits -- including inside a git
# worktree, where the repo's root Cargo.toml exclude list does not apply and
# cargo otherwise fails with "current package believes it's in a workspace
# when it's not". A shared app has no parent workspace, so this matches how
# the app is actually used.
[workspace]

[package]
name = "krate-clock"
version = "0.1.0-dev"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/incyashraj/krate"
rust-version = "1.91"

[dependencies]
krate = { path = "../../crates/bindings-rust" }
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "krate:clock"

[package.metadata.component.target]
path = "../../wit/krate/phase2"
world = "cli"

[package.metadata.component.target.dependencies]
"krate:io" = { path = "../../wit/krate/phase2/deps/io" }
"krate:fs" = { path = "../../wit/krate/phase2/deps/fs" }
"krate:net" = { path = "../../wit/krate/phase2/deps/net" }
"krate:time" = { path = "../../wit/krate/phase2/deps/time" }
"krate:locale" = { path = "../../wit/krate/phase2/deps/locale" }
"krate:resources" = { path = "../../wit/krate/phase2/deps/resources" }
"krate:store" = { path = "../../wit/krate/phase2/deps/store" }
"krate:random" = { path = "../../wit/krate/phase2/deps/random" }

[profile.release]
panic = "abort"
