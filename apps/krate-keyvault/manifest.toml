[app]
id = "dev.krate.keyvault"
name = "Run Counter"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_keyvault.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the counter window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the count on exit for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true

[[capabilities]]
cap = "store.kv"
rationale = "Remember how many times the app has been opened"
required = true
