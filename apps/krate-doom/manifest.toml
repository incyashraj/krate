[app]
id = "dev.krate.doom"
name = "Doom"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_doom.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the game window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Doom prints its start-up lines"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run argument used by automated verification"
required = true
