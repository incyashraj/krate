[app]
id = "dev.krate.nova"
name = "Krate Nova"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_nova.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the game window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the score"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag"
required = true
