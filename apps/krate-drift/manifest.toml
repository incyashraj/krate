[app]
id = "dev.krate.drift"
name = "Drift"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_drift.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the game window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report frame timings for automated checks"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run and bench flags"
required = true
