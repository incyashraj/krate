[app]
id = "dev.krate.savings"
name = "Budget Splitter"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_savings.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Open the budget splitter window"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the split on exit for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true

[[capabilities]]
cap = "store.kv"
rationale = "Remember your last entered income"
required = true
