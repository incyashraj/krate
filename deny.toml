[advisories]
# Path to the advisory database; fetched on first run.
version = 2
ignore = [
    # RUSTSEC-2026-0222: wasmtime type-index confusion BETWEEN engines. The
    # runtime builds exactly one Engine per process (runtime/src/lib.rs), so
    # the cross-engine mixing the advisory describes has no surface here.
    # Temporary regardless: the patched trains (46.0.2/47.0.3) require rustc
    # 1.94 and we pin 1.91.1 -- the paired upgrade is K-118 on the board.
    "RUSTSEC-2026-0222",
    # Unmaintained notices on transitive tooling deps (bitmaps, im-rc,
    # sized-chunks); nothing runtime-side links them. Reviewed 2026-08-16.
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0250",
    "RUSTSEC-2026-0251",
]

[licenses]
version = 2
# Licenses we explicitly allow.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    # webpki-roots ships Mozilla's CA certificate store, which Mozilla
    # publishes under CDLA-Permissive-2.0. It is certificate data rather than
    # code, and it arrives with the TLS stack that lets `krate run <https url>`
    # verify who it is downloading a bundle from.
    "CDLA-Permissive-2.0",
    # clipboard-win (arboard's Windows clipboard backend, pulled in to give the
    # drawn path Cut/Copy/Paste) is published under the Boost Software License,
    # a permissive OSI-approved license with no copyleft or attribution burden.
    "BSL-1.0",
    # whisper-rs and its whisper.cpp bindings use the Unlicense. It is an
    # OSI-approved public-domain dedication and permissive fallback license.
    "Unlicense",
]
# Confidence threshold for license expression detection.
confidence-threshold = 0.8
# Phase 0 has no dependencies yet, so most future-facing allow-list entries are
# naturally unused. Keep CI quiet until real crates arrive in Phase 1.
unused-allowed-license = "allow"

[bans]
# Warn when the same crate version appears multiple times.
multiple-versions = "warn"
# Deny wildcard dependencies (e.g. `dep = "*"`).
wildcards = "deny"
# List of crates that are never allowed.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
