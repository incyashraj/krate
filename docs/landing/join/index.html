<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Your invitation</title>
<meta name="description" content="Accept an invitation to an organisation on Krate.">
<link rel="icon" href="/krate-favicon.png" />
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)">
<script>(() => { const d = document.documentElement; d.classList.add('js'); let t = null; try { t = localStorage.getItem('krate-theme'); } catch (e) {} if (t !== 'light' && t !== 'dark') t = null; d.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();</script>
<link rel="preload" href="/fonts/geist-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/kit/site.css">
<style>
.auth { padding-bottom: 8px; }
.jtile { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center; font-weight: 600; font-size: 23px; color: var(--accent); background: var(--accent-soft); }
.panel h1 { text-wrap: balance; overflow-wrap: anywhere; }
.panel p { text-wrap: pretty; }
.jrole { display: grid; gap: 4px; margin-top: 20px; padding: 14px 16px; border-radius: 14px; text-align: left; background: var(--soft); }
.jrole b { font-weight: 500; font-size: 14.5px; }
.jrole span { font-size: 13.5px; color: var(--mute); }
.jfine { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); }
.org-why { margin-top: 18px; text-align: left; }
.org-why b { display: block; font-weight: 500; color: var(--ink); }
.org-why p { margin-top: 2px; }
.org-why .btn { margin-top: 10px; }
.loading { margin-top: 10px; font-size: 14.5px; color: var(--ink-3); }
.panel .stack .btn.link { justify-self: center; width: auto; font-size: 14px; color: var(--ink-2); }
.jtrouble { margin-top: 14px; text-align: left; border-radius: 14px; }
.jtrouble[open] { background: var(--soft); }
.jtrouble > summary { min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 14px; font-size: 13px; color: var(--ink-3); cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 3px; }
.jtrouble > summary::-webkit-details-marker { display: none; }
.jcompany { display: grid; gap: 12px; margin-bottom: 12px; }
.jcompany .btn { width: 100%; }
.jtrouble[open] > summary { color: var(--ink); }
.jtrouble .jt { padding: 0 16px 16px; }
.jtrouble .jt p { margin-top: 0; font-size: 13.5px; }
.jtrouble pre.k { margin: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; }
@media (max-width: 480px) { .panel { padding: 30px 20px 26px; margin-top: 40px; } .panel h1 { font-size: 25px; } }
</style>
</head>
<body data-kit="app">
<header class="fbar">
  <a class="brand" href="/"><img src="/krate-mark-3d-96.png" alt="" width="24" height="24">Krate</a>
  <div class="fr">
    <button class="thm" id="thm" type="button" aria-label="Switch between light and dark"><svg class="sun" width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="3.4"/><path d="M9 1.8v1.6M9 14.6v1.6M1.8 9h1.6M14.6 9h1.6M3.9 3.9l1.1 1.1M13 13l1.1 1.1M3.9 14.1L5 13M13 5l1.1-1.1"/></svg><svg class="moon" width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M15.2 11.2A6.6 6.6 0 0 1 6.8 2.8a6.6 6.6 0 1 0 8.4 8.4z"/></svg></button>
    <a class="signin" href="/login/">Sign in</a>
  </div>
</header>

<main>
<section class="auth">
  <div class="panel" id="card">
    <div class="jtile" id="jTile" aria-hidden="true">K</div>
    <h1 id="jH">Your invitation</h1>
    <p id="jP" class="loading">Reading it</p>
    <div id="jBody"></div>
  </div>
  <noscript><div class="panel"><h1>Your invitation</h1><p>Accepting needs JavaScript. The command line does it too: <code class="k">krate org join &lt;organisation&gt; &lt;code&gt;</code>, with the two parts of your link.</p></div></noscript>
</section>
</main>

<script src="/kit/site.js"></script>
<script src="/kit/org.js"></script>
<script src="/join/join.js"></script>
</body>
</html>
