# Krate organisation policy, version 1. A sample with every key.
#
# Place it at:
#   Linux    /etc/krate/policy.toml
#   macOS    /Library/Application Support/Krate/policy.toml
#   Windows  %ProgramData%\Krate\policy.toml
# A configuration profile (macOS) or Group Policy (Windows) carrying the
# same keys takes precedence over the file. `krate policy` shows which
# one is in force.
#
# A policy only narrows what Krate allows. A key Krate does not know, or
# a value it cannot read, refuses to open apps until it is fixed.
# Generated by scripts/build-policy-templates.py; https://krate.tech/docs/running-in-an-organisation.html

# Required. Always 1 for this version of the policy. An unknown version
# refuses to open apps.
version = 1

# Your organisation's name. Every message Krate shows about the policy uses
# it, for example "Acme Labs does not allow this app". Optional.
name = "Acme Labs"

[org]
# The organisation on Krate's hub that these computers belong to: its short
# name, as in krate.tech/org/acme-labs. Krate shows that organisation's apps
# to the people signed in to it. Optional.
slug = "acme-labs"

[trust]
# The signing roots this computer trusts: each a name and the public half of
# an Ed25519 root key, as 64 hex characters. An app passes when its
# signature verifies and its root (the delegation's root, or the signing key
# itself) is listed. Empty or absent: no limit on roots.
roots = [
  { name = "Acme Labs", key = "REPLACE-WITH-YOUR-ROOT-PUBLIC-KEY-64-HEX-CHARACTERS" },
]

# Whether an app with no signature may open. Default: allowed when there is
# no [trust] section, refused when roots are listed. A signature that is
# present but damaged never passes, whatever this says.
allow_unsigned = false

# Whether an app signed by a root that is not listed may open. Default:
# allowed when no roots are listed, refused when they are.
allow_other_signed = false

[capabilities]
# Capabilities no app may be given on this computer, spelled as an app's
# manifest spells them (camera.capture, audio.capture, location.read,
# ui.clipboard, fs.write ...). Matched on the name before ':', so fs.write
# blocks every fs.write grant. A blocked capability is shown as blocked by
# your organisation and cannot be granted.
deny = ["camera.capture", "audio.capture", "location.read"]

[network]
# The only hosts any app may connect to, whatever its manifest asks for.
# Same patterns as a manifest: host or *.host, then :port or :*. Absent: no
# ceiling.
allow = ["*.acme.com:443", "api.github.com:443"]

# The proxy every connection Krate makes goes through, for http and https
# alike, as http://host:port (user:password@ allowed), or "direct" to use
# none. When set, it replaces the proxy variables (HTTPS_PROXY, HTTP_PROXY,
# ALL_PROXY, NO_PROXY) and the system's own proxy settings, so a person's
# shell cannot route around it; absent, the variables apply when set and the
# system's static proxy otherwise. This computer's own services (localhost)
# are always reached directly. Krate does not run a PAC script or WPAD; if
# your computers rely on one, set the proxy here.
# proxy = "http://proxy.acme.com:3128"

# Used with proxy: hosts reached directly, separated by commas, as NO_PROXY
# is written: an entry covers the host and every name under it (acme.com
# covers git.acme.com), * covers every host. Address ranges such as
# 10.0.0.0/8 are not read; name the hosts.
# no_proxy = "internal.acme.com,git.acme.com"

[usage]
# Whether Krate sends its anonymous usage counts (install, make, open,
# publish) to Krate's hub. false: none are sent and the first-run question
# about them is not asked.
counting = false

[hub]
# The only Krate hub this computer talks to for private apps, publishing and
# sign-in. Any other hub, from a flag or an environment variable, is
# refused.
url = "https://hub.krate.tech"

[studio]
# false: Krate Studio and krate create refuse to start an AI build, before
# any AI provider is contacted.
ai = true

# When present, only these AI providers may be used for a build. Provider
# ids: claude, codex, gemini, copilot, grok.
providers = ["claude", "codex"]

[updates]
# auto (the default): updates are offered as usual. notify: Krate checks for
# a new version and says so, and never installs one. off: Krate never
# checks.
mode = "notify"

# [audit]
# Where Krate appends its record of every app opened or refused on this
# computer, one JSON line each. Default: /var/log/krate/opens.jsonl on macOS
# and Linux, %ProgramData%\Krate\logs\opens.jsonl on Windows.
# path = "/var/log/krate/opens.jsonl"

[runtime]
# true: every app runs on Krate's interpreter (Pulley) instead of compiled
# machine code, so Krate never makes executable memory. For endpoint
# protection that blocks code generated at run time, and Windows Arbitrary
# Code Guard. Apps may run slower this way.
interpreter = false

# Device-side data rules for your organisation's own apps: [apps."*"] for
# every one of them, or [apps."<app id>"] for one app. Each only narrows; a
# key left out keeps Krate's default. Uncomment to use.
# [apps."*"]
# false: the app cannot read the clipboard, and a paste the person makes
# into it is refused too.
# clipboard_read = false
# false: nothing leaves the app by the clipboard.
# clipboard_write = false
# false: the app cannot print, or save as PDF from the print dialog.
# printing = false
# false: the app's windows are kept out of screenshots, screen recordings
# and screen sharing where the system allows it (macOS and Windows; not
# Linux), and Krate takes no picture of the app itself.
# screen_capture = false
# true: when the app's offline access runs out, the app's team data on this
# computer is deleted at the next open.
# wipe_when_offline_ends = true
# [apps."dev.acme.payroll"]
# clipboard_write = false
