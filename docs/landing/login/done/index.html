<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex" />
  <title>Signed in</title>
  <link rel="icon" href="/krate-favicon.png" />
  <style>
  @font-face { font-family: "Geist"; src: url("/fonts/geist-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Geist"; src: url("/fonts/geist-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg: #0a0a0a; --panel: #0f1012; --panel-raised: #16171b;
    --line: #1f2228; --line-strong: #2e323a; --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.55); --quiet: rgba(255, 255, 255, 0.35);
    --sans: "Geist", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; }
  .hidden { display: none; }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 400px; text-align: center;
    padding: 40px 34px; border: 1px solid var(--line); border-radius: 18px;
    background: var(--panel);
  }
  .login-card > img { margin: 0 auto; display: block; }
  .login-card h1 { margin-top: 18px; font-size: 24px; font-weight: 500; letter-spacing: -0.015em; }
  .login-sub { margin: 10px 0 26px; color: var(--muted); font-size: 14px; }
  .btn-login {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 16px; margin-bottom: 10px;
    border-radius: 12px; border: 1px solid var(--line-strong);
    background: var(--text); color: #0a0a0a;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: transform 0.15s ease;
  }
  .btn-login:hover { transform: translateY(-1px); }
  .btn-google { background: var(--panel-raised); color: var(--text); }
  .login-or { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--quiet); font-size: 11px; }
  .login-or::before, .login-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .login-email { display: flex; gap: 8px; }
  .login-email input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; font-size: 13.5px;
  }
  .login-email button {
    padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: none; color: var(--muted); font: inherit; font-size: 13.5px; cursor: pointer;
  }
  .login-note { margin-top: 14px; color: var(--muted); font-size: 12.5px; }
  .login-foot { margin-top: 22px; color: var(--quiet); font-size: 12px; }
  </style>
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <img src="/krate-glyph-white.png" alt="" width="34" height="34" />
    <h1 id="doneH">You're signed in</h1>
    <p class="login-sub" id="doneSub">Your Krate account is ready.</p>
    <a class="btn-login hidden" id="openApp" href="#">Open Krate</a>
  </div>
</main>
<script>
// The sign-in lands here with the identity in the URL fragment, which never
// leaves this browser. Coming from the desktop app (?app=1), hand it straight
// to Krate through its URL scheme and say so; the button stays as the manual
// path if the automatic hop is blocked.
(function () {
  var fromApp = new URLSearchParams(location.search).get("app") === "1";
  var hash = location.hash.replace(/^#/, "");
  if (hash) {
    // Query, not fragment: fragments never leave a BROWSER, but this URL
    // leaves the browser on purpose -- and Windows' scheme plumbing drops
    // fragments on the way to the handler. A local URI has no logs to
    // protect the token from.
    var target = "krate://signed-in?" + hash;
    var a = document.getElementById("openApp");
    a.href = target;
    a.classList.remove("hidden");
    if (fromApp) {
      // Started from the desktop app: hop back automatically; the button
      // stays as the manual path if the hop is blocked.
      document.getElementById("doneSub").textContent =
        "All set. Krate on your desktop is signed in too; you can close this tab.";
      location.href = target;
    } else {
      // Started on the web. The identity is right here, so offer the hop
      // rather than pretending the desktop app learned about it by itself.
      document.getElementById("doneSub").textContent =
        "All set. If Krate is installed on this computer, Open Krate signs the app in too.";
    }
  } else {
    document.getElementById("doneSub").textContent =
      "All set. To sign in the desktop app, use Sign in from inside Krate.";
  }
  // The token never belongs in history.
  history.replaceState(null, "", location.pathname + location.search);
})();
</script>
</body>
</html>
