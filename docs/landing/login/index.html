<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex" />
  <title>Sign in to Krate</title>
  <link rel="icon" href="/krate-favicon.png" />

  <!-- Decide BEFORE the first paint.
       The redirect for an already-signed-in person used to live in the
       script at the bottom of the body, which runs only after the sign-in
       UI has been parsed and painted. On a phone that showed the full
       "Sign in with GitHub or Google" screen for a beat, then replaced it
       -- so the site appeared to ask for an account and then change its
       mind. Reading the token here, in the head, means the navigation
       starts before there is anything on screen to flash.

       `krate-booting` on <html> keeps the sign-in form hidden while we do
       not yet know, and the loader visible in its place. Both are undone
       below the moment we know a redirect is NOT happening, so a person
       who does need to sign in never waits on this. -->
  <script>
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      var next = q.get("next") || "";
      var fromApp = q.get("from") === "app";
      if (next === "studio" && !fromApp) {
        var token = null;
        try { token = localStorage.getItem("krate_tok"); } catch (e) {}
        if (token) {
          document.documentElement.className += " krate-booting";
          location.replace("/app/");
        }
      }
    } catch (e) {
      /* Any failure here just means the normal sign-in page renders,
         which is the correct fallback. */
    }
  })();
  </script>
  <style>
  /* While a redirect is in flight: no sign-in UI, just the loader. */
  html.krate-booting .login-card { display: none; }
  html.krate-booting .booting { display: flex; }
  .booting {
    display: none;
    flex-direction: column; align-items: center; gap: 14px;
    text-align: center; color: var(--text);
    font-family: var(--sans); padding: 30px 24px;
  }
  .booting p { font-size: 15px; font-weight: 500; }
  .booting .booting-sub { font-size: 13px; font-weight: 400; color: var(--muted); }
  .booting .spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line-strong); border-top-color: var(--text);
    animation: krate-spin 0.7s linear infinite;
  }
  @keyframes krate-spin { to { transform: rotate(360deg); } }
  .booting .dots i { animation: krate-dot 1.2s infinite; opacity: 0; font-style: normal; }
  .booting .dots i:nth-child(2) { animation-delay: 0.2s; }
  .booting .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes krate-dot { 0%, 60%, 100% { opacity: 0; } 30% { opacity: 1; } }
  /* Someone who asked for less motion gets a still loader, not a stalled
     one: the text still says what is happening. */
  @media (prefers-reduced-motion: reduce) {
    .booting .spin { animation: none; border-top-color: var(--line-strong); }
    .booting .dots i { animation: none; opacity: 1; }
  }
  @font-face { font-family: "Geist"; src: url("/fonts/geist-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Geist"; src: url("/fonts/geist-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg: #0a0a0a; --panel: #0f1012; --panel-raised: #16171b;
    --line: #1f2228; --line-strong: #2e323a; --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.55); --quiet: rgba(255, 255, 255, 0.35);
    --sans: "Geist", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; }
  .hidden { display: none; }
  /* `place-items: center` + `width: 100%` sizes the card to the grid area,
     which this padding does not shrink -- so at 375px the card ran to 387
     and the page scrolled sideways. justify-items: stretch with a max-width
     keeps it inside on a phone and centred everywhere else. */
  .login-wrap {
    min-height: 100vh; display: grid; align-items: center; justify-items: center;
    padding: 24px; box-sizing: border-box;
  }
  .login-card {
    width: 100%; max-width: min(400px, 100%); text-align: center;
    padding: 40px 34px; border: 1px solid var(--line); border-radius: 18px;
    background: var(--panel); box-sizing: border-box;
  }
  /* A phone has no room for 34px of side padding inside a card that is
     already inset 24px from the screen. */
  @media (max-width: 480px) {
    .login-wrap { padding: 16px; }
    .login-card { padding: 30px 20px; }
    .login-card h1 { font-size: 21px; }
  }
  .login-card > img { margin: 0 auto; display: block; }
  .login-card h1 { margin-top: 18px; font-size: 24px; font-weight: 500; letter-spacing: -0.015em; }
  .login-sub { margin: 10px 0 26px; color: var(--muted); font-size: 14px; }
  .btn-login {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 16px; margin-bottom: 10px;
    border-radius: 12px; border: 1px solid var(--line-strong);
    background: var(--text); color: #0a0a0a;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: transform 0.15s ease;
  }
  .btn-login:hover { transform: translateY(-1px); }
  .btn-google { background: var(--panel-raised); color: var(--text); }
  .login-or { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--quiet); font-size: 11px; }
  .login-or::before, .login-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .login-email { display: flex; gap: 8px; }
  .login-email input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; font-size: 13.5px;
  }
  .login-email button {
    padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: none; color: var(--muted); font: inherit; font-size: 13.5px; cursor: pointer;
  }
  .login-note { margin-top: 14px; color: var(--muted); font-size: 12.5px; }
  .login-foot { margin-top: 22px; color: var(--quiet); font-size: 12px; }
  </style>
</head>
<body>
<main class="login-wrap">
  <!-- Shown INSTEAD of the sign-in card when the head script found a
       session and started the trip to the Studio. It says where the person
       is going, because a bare spinner reads as a stall. -->
  <div class="booting" aria-live="polite">
    <img src="/krate-logo.png" alt="" width="34" height="34" />
    <div class="spin" aria-hidden="true"></div>
    <p>Opening your Studio<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
    <p class="booting-sub">You are already signed in.</p>
  </div>

  <div class="login-card">
    <img src="/krate-logo.png" alt="" width="34" height="34" />
    <h1 id="loginH">Sign in to Krate</h1>
    <p class="login-sub" id="loginSub">One account for the apps you make and publish.</p>
    <p class="login-note hidden" id="refBadge" style="margin:0 0 18px;border:1px solid #2e323a;border-radius:10px;padding:9px 13px;color:rgba(255,255,255,0.7)"></p>

    <a class="btn-login" id="ghBtn" href="https://hub.krate.tech/login/start">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      Continue with GitHub
    </a>
    <a class="btn-login btn-google" id="googleBtn" href="https://hub.krate.tech/login/google/start">
      <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
    <div class="login-or"><span>or</span></div>
    <form class="login-email" id="emailForm">
      <input type="email" id="emailInput" placeholder="you@example.com" required />
      <button type="submit" id="emailGo">Continue</button>
    </form>
    <p class="login-note hidden" id="emailNote"></p>
    <!-- True of every door above, not just the first: GitHub and Google
         ask for the password themselves, and the email link has none.
         The same sentence is on /make's sign-in sheet; change both. -->
    <p class="login-foot">Krate never sees your password. GitHub or Google ask you
    directly, and the email link needs no password at all.</p>
  </div>
</main>
<script>
// Signing in FROM the app carries from=app through, so the hub hands the
// identity back to the desktop through the krate:// scheme.
(function () {
  var fromApp = new URLSearchParams(location.search).get("from") === "app";
  // Where to continue AFTER sign-in (the desk, a checkout). Kept in this
  // origin's storage so it survives the provider round trip.
  var next = new URLSearchParams(location.search).get("next") || "";
  try { if (next) localStorage.setItem("krate_next", next); } catch (e) {}
  // Already signed in and on the way somewhere? The head script has
  // already started that navigation -- before the first paint, so the
  // sign-in card never flashes. This one only has to stand down while it
  // completes, so nothing below rewrites a card that is on its way out.
  //
  // Every "Make an app" door on the site points here rather than straight
  // at /app, so that signing in happens before the Studio opens instead of
  // interrupting the first sentence somebody types. For a person who
  // signed in last week that would otherwise mean a sign-in page they do
  // not need, asking for an account they already have. The token is this
  // origin's, written by /login/done; if it has expired the Studio's own
  // check sends them back here, and `stay` stops that becoming a loop.
  if (document.documentElement.classList.contains("krate-booting")) { return; }
  // A referral link lands here directly. The code is noted NOW -- before
  // any provider round trip -- and claimed automatically on the first
  // sign-in, whichever button they pick. Nothing for them to type.
  var ref = new URLSearchParams(location.search).get("ref") || "";
  if (!ref) { try { ref = localStorage.getItem("krate_ref") || ""; } catch (e) {} }
  if (/^[A-Za-z0-9]{4,16}$/.test(ref)) {
    try { localStorage.setItem("krate_ref", ref); } catch (e) {}
    document.getElementById("loginH").textContent = "You're invited to Krate";
    document.getElementById("loginSub").textContent =
      "Sign up free. Every app you make is a file that is yours forever.";
    var badge = document.getElementById("refBadge");
    badge.textContent = "Invite " + ref + " noted -- it counts the moment you sign up.";
    badge.classList.remove("hidden");
  }
  if (fromApp) {
    document.getElementById("ghBtn").href = "https://hub.krate.tech/login/start?from=app";
    document.getElementById("googleBtn").href = "https://hub.krate.tech/login/google/start?from=app";
  }
  var form = document.getElementById("emailForm");
  var note = document.getElementById("emailNote");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var go = document.getElementById("emailGo");
    go.disabled = true;
    go.textContent = "Sending";
    fetch("https://hub.krate.tech/login/email", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("emailInput").value.trim(),
        from: fromApp ? "app" : "web",
      }),
    })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t }; }); })
      .then(function (res) {
        note.textContent = res.ok
          ? "Check your inbox: the sign-in link works once and expires in 15 minutes."
          : res.t;
        note.classList.remove("hidden");
      })
      .catch(function () {
        note.textContent = "The hub could not be reached. Check your connection.";
        note.classList.remove("hidden");
      })
      .finally(function () {
        go.disabled = false;
        go.textContent = "Continue";
      });
  });
})();
</script>
</body>
</html>
