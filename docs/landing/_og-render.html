<!doctype html>
<!--
  Source for og-v3.png, the link preview card.

  Not a published page. It exists so the preview can be regenerated from the
  same tokens the hero uses instead of being redrawn by hand. It paints to a
  1200x630 canvas, which is the size every platform wants, and leaves the PNG
  on window.__png.

    krate/docs/landing $ python3 -m http.server 8765
    open http://localhost:8765/_og-render.html, then in the console:
      const a = document.createElement("a");
      a.href = window.__png; a.download = "og-v3.png"; a.click();

  Keep the headline, the glyph and the colors in step with index.html.
-->
<html><head><meta charset="utf-8"><title>render</title>
<style>
  @font-face { font-family: "Geist"; src: url("/fonts/geist-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Geist"; src: url("/fonts/geist-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Syne"; src: url("/fonts/syne-var.woff2") format("woff2"); font-weight: 400 800; }
  body { background:#333; margin:0; }
  canvas { display:block; }
  /* force the faces to load before we draw */
  .pre { position:absolute; opacity:0; pointer-events:none; }
  .s { font-family:"Syne"; font-weight:600; }
  .g4 { font-family:"Geist"; font-weight:400; }
  .g5 { font-family:"Geist"; font-weight:500; }
</style></head>
<body>
<div class="pre"><span class="s">x</span><span class="g4">x</span><span class="g5">x</span></div>
<canvas id="c" width="1200" height="630"></canvas>
<script>
const W = 1200, H = 630;
const PURPLE = "#A558FB", INDIGO = "#4922E5", DIM = "#a1a1aa";

function roundRect(x, y, w, h, r) {
  const p = new Path2D();
  p.moveTo(x + r, y);
  p.arcTo(x + w, y, x + w, y + h, r);
  p.arcTo(x + w, y + h, x, y + h, r);
  p.arcTo(x, y + h, x, y, r);
  p.arcTo(x, y, x + w, y, r);
  p.closePath();
  return p;
}

async function draw() {
  await document.fonts.load('600 86px Syne');
  await document.fonts.load('400 25px Geist');
  await document.fonts.load('500 20px Geist');
  await document.fonts.ready;

  const logo = new Image();
  await new Promise(res => { logo.onload = res; logo.onerror = res; logo.src = "/krate-logo.png"; });

  const c = document.getElementById('c'), x = c.getContext('2d');

  // ---- ground
  x.fillStyle = "#000"; x.fillRect(0, 0, W, H);

  // ---- the eclipse: a huge disc low on the card. Bright rim, purple and
  // indigo bleeding out of it, black core so only the arc survives.
  const CX = W / 2, R = 1100, CY = H - 74 + R;   // matches _og-source.html

  x.save();
  // outer bloom
  const bloom = x.createRadialGradient(CX, CY, R * 0.86, CX, CY, R * 1.10);
  bloom.addColorStop(0.00, "rgba(73,34,229,0)");
  bloom.addColorStop(0.62, "rgba(73,34,229,0.30)");
  bloom.addColorStop(0.80, "rgba(165,88,251,0.42)");
  bloom.addColorStop(0.92, "rgba(190,140,255,0.30)");
  bloom.addColorStop(1.00, "rgba(165,88,251,0)");
  x.fillStyle = bloom;
  x.beginPath(); x.arc(CX, CY, R * 1.10, 0, Math.PI * 2); x.fill();

  // the disc body, purple to indigo inward
  const body = x.createRadialGradient(CX, CY, R * 0.90, CX, CY, R);
  body.addColorStop(0.00, "rgba(0,0,0,1)");
  body.addColorStop(0.45, "rgba(43,20,120,1)");
  body.addColorStop(0.72, INDIGO);
  body.addColorStop(0.92, PURPLE);
  body.addColorStop(1.00, "rgba(214,180,255,1)");
  x.fillStyle = body;
  x.beginPath(); x.arc(CX, CY, R, 0, Math.PI * 2); x.fill();

  // the hot rim itself
  x.lineWidth = 1.8;
  x.strokeStyle = "rgba(255,255,255,0.80)";
  x.shadowColor = "rgba(255,255,255,0.55)"; x.shadowBlur = 30;
  x.beginPath(); x.arc(CX, CY, R - 1, 0, Math.PI * 2); x.stroke();
  x.shadowColor = "rgba(165,88,251,0.50)"; x.shadowBlur = 72;
  x.beginPath(); x.arc(CX, CY, R - 1, 0, Math.PI * 2); x.stroke();
  x.restore();

  // ---- brand row
  const bw = 30, by = 46;
  const label = "KRATE";
  x.font = '500 20px Geist, sans-serif';
  const track = 0.22 * 20;
  let lw = 0;
  for (const ch of label) lw += x.measureText(ch).width + track;
  lw -= track;
  const groupW = bw + 13 + lw;
  let bx = (W - groupW) / 2;
  if (logo.width) x.drawImage(logo, bx, by, bw, bw);
  x.fillStyle = "#fff"; x.textBaseline = "middle";
  let tx = bx + bw + 13;
  for (const ch of label) { x.fillText(ch, tx, by + bw / 2 + 1); tx += x.measureText(ch).width + track; }

  // ---- headline: "Build once."  >_  "Ship one file."
  const FS = 86, hy = 182 + FS * 0.55;
  const a = "Build once.", b = "Ship one file.";
  x.font = `600 ${FS}px Syne, sans-serif`;  const aw = x.measureText(a).width;
  x.font = `500 ${FS}px Syne, sans-serif`;  const bw2 = x.measureText(b).width;
  const gw = FS * 1.06 + FS * 0.25;         // glyph slot + its margins
  let hx = (W - (aw + gw + bw2)) / 2;

  x.textBaseline = "middle";
  x.font = `600 ${FS}px Syne, sans-serif`; x.fillStyle = "#fff";
  x.fillText(a, hx, hy);
  hx += aw + gw / 2;

  // the terminal glyph, drawn as strokes on a 24-unit grid
  const gs = FS * 0.62, u = gs / 24;
  x.save();
  x.translate(hx - gs / 2, hy - gs / 2);
  x.strokeStyle = "#fff"; x.lineWidth = 2 * u;
  x.lineCap = "round"; x.lineJoin = "round";
  x.beginPath();
  x.moveTo(4 * u, 17 * u); x.lineTo(10 * u, 11 * u); x.lineTo(4 * u, 5 * u);
  x.stroke();
  x.beginPath();
  x.moveTo(12 * u, 19 * u); x.lineTo(20 * u, 19 * u);
  x.stroke();
  x.restore();

  hx += gw / 2;
  x.font = `500 ${FS}px Syne, sans-serif`; x.fillStyle = DIM;
  x.fillText(b, hx, hy);

  // ---- subhead
  x.font = '400 25px Geist, sans-serif'; x.fillStyle = DIM;
  x.textAlign = "center";
  const lines = ["Desktop software in tens of kilobytes. One file that runs on Mac,",
                 "Windows and Linux, and cannot touch anything it did not declare."];
  let sy = hy + FS * 0.55 + 30 + 19;
  for (const ln of lines) { x.fillText(ln, W / 2, sy); sy += 25 * 1.55; }

  // ---- the three chips
  x.textAlign = "left";
  x.font = '400 19px Geist, sans-serif';
  const chips = ["One file", "Three platforms", "Sandboxed by default"];
  const icons = ["cube", "screen", "lock"];
  const padX = 19, gap = 9, ico = 18, chGap = 12, chH = 42;
  const widths = chips.map(t => padX + ico + gap + x.measureText(t).width + padX);
  let total = widths.reduce((s, w) => s + w, 0) + chGap * (chips.length - 1);
  let cx0 = (W - total) / 2;
  const cy0 = sy - 25 * 1.55 + 46 - 4;

  chips.forEach((t, i) => {
    const w = widths[i];
    const p = roundRect(cx0, cy0, w, chH, chH / 2);
    x.fillStyle = "rgba(255,255,255,0.05)"; x.fill(p);
    x.strokeStyle = "rgba(255,255,255,0.12)"; x.lineWidth = 1; x.stroke(p);

    // icon
    const ix = cx0 + padX, iy = cy0 + (chH - ico) / 2, s = ico / 24;
    x.save(); x.translate(ix, iy); x.scale(s, s);
    x.strokeStyle = PURPLE; x.lineWidth = 2 / s * (s / s) * 2;
    x.lineWidth = 2; x.lineCap = "round"; x.lineJoin = "round";
    x.beginPath();
    if (icons[i] === "cube") {
      x.moveTo(21,16); x.lineTo(21,8); x.lineTo(12,3); x.lineTo(3,8); x.lineTo(3,16); x.lineTo(12,21); x.closePath();
      x.moveTo(3.27,6.96); x.lineTo(12,12.01); x.lineTo(20.73,6.96);
      x.moveTo(12,22.08); x.lineTo(12,12);
    } else if (icons[i] === "screen") {
      x.moveTo(4,3); x.lineTo(20,3); x.lineTo(20,17); x.lineTo(4,17); x.closePath();
      x.moveTo(8,21); x.lineTo(16,21);
      x.moveTo(12,17); x.lineTo(12,21);
    } else {
      x.moveTo(3,11); x.lineTo(21,11); x.lineTo(21,22); x.lineTo(3,22); x.closePath();
      x.moveTo(7,11); x.lineTo(7,7); x.arc(12,7,5,Math.PI,0); x.lineTo(17,11);
    }
    x.stroke();
    x.restore();

    x.fillStyle = "#f4f4f5"; x.textBaseline = "middle";
    x.fillText(t, cx0 + padX + ico + gap, cy0 + chH / 2 + 1);
    cx0 += w + chGap;
  });

  window.__png = c.toDataURL("image/png");
  document.title = "done";
}
draw();
</script>
</body></html>
