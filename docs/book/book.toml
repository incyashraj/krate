[book]
title = "Krate docs"
description = "Build a desktop app in Rust, compile it to a WebAssembly component, and ship it as one file that runs on macOS, Windows and Linux and reaches nothing it did not declare."
authors = ["Krate contributors"]
language = "en"
multilingual = false
src = "src"

[output.html]
# The site is served from the root of krate.tech, so the book lives at /docs/.
# It was "/krate/docs/" while the only home was the project page at
# incyashraj.github.io/krate/, which is a subpath. Leaving that prefix in place
# would make every generated link resolve to krate.tech/krate/docs/... and 404.
site-url = "/docs/"
git-repository-url = "https://github.com/incyashraj/krate"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/incyashraj/krate/edit/main/docs/book/{path}"
no-section-label = false
# The site is one dark brand (site.css, the 2026 shell); the book must not
# open in a different one. Navy is the base we restyle in krate-theme.css.
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["krate-theme.css"]
additional-js = ["mermaid-render.js", "krate-theme.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
