<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>An app on Krate</title>
<meta name="description" content="What this app is, what it asks for, and how to run it." />
<link rel="icon" href="/krate-favicon.png" />
<style>
@font-face { font-family: "Geist"; src: url("/fonts/geist-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Geist"; src: url("/fonts/geist-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Syne"; src: url("/fonts/syne-var.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
:root { color-scheme: dark; --purple: #A558FB; --indigo: #4922E5;
  --sans: "Geist", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  --disp: "Syne", var(--sans); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: var(--sans); font-size: 15px;
  line-height: 1.65; -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { max-width: 100%; }
.hidden { display: none !important; }
::selection { background: rgba(165, 88, 251, 0.35); }
.topblur { position: fixed; top: 0; left: 0; width: 100%; height: 120px; z-index: 40;
  pointer-events: none; user-select: none;
  background: linear-gradient(to top, transparent, #000);
  -webkit-mask-image: linear-gradient(to bottom, #000 50%, transparent);
          mask-image: linear-gradient(to bottom, #000 50%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.bloom { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(60% 50% at 50% 0%, rgba(73,34,229,0.20), transparent 70%); }
.brandbar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 14px; }
.brandbar .name { display: flex; align-items: center; gap: 0.34em; font-size: 17px;
  font-weight: 500; color: #e4e4e7; letter-spacing: 0.02em; }
.brandbar .name img { height: 19px; width: auto; }
.bnav { display: flex; align-items: center; gap: 2px; margin-left: 6px;
  padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.12); }
.bnav a { font-size: 12.5px; color: #a1a1aa; padding: 5px 9px; border-radius: 999px;
  transition: color 0.15s ease, background 0.15s ease; }
.bnav a:hover { color: #fff; background: rgba(255,255,255,0.06); }
@media (max-width: 760px) { .bnav { display: none; } }

.wrap { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto;
  padding: 140px 24px 90px; }

.back { display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
  color: #a1a1aa; margin-bottom: 26px; transition: color 0.15s; }
.back:hover { color: #fff; }

/* The screenshot IS the page. A gallery visitor is deciding whether to open
   something, and the picture answers that faster than any prose. */
.shot { border-radius: 20px; overflow: hidden; background: #0b0b0d;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.09), 0 40px 90px -40px rgba(0,0,0,0.9); }
.shot img { width: 100%; display: block; }
.shot.empty { aspect-ratio: 16/10; display: grid; place-items: center;
  color: #52525b; font-size: 13px; }

.head { display: flex; align-items: flex-start; gap: 20px; margin: 34px 0 0; flex-wrap: wrap; }
h1.nm { font-family: var(--disp); font-weight: 700; letter-spacing: -0.02em;
  font-size: clamp(26px, 4vw, 38px); line-height: 1.08; }
.desc { color: #a1a1aa; margin-top: 10px; max-width: 62ch; }
.by { display: flex; align-items: center; gap: 8px; margin-top: 14px;
  font-size: 13px; color: #a1a1aa; }
.by img { width: 20px; height: 20px; border-radius: 50%; }

.acts { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 20px;
  border-radius: 999px; font-size: 14px; font-weight: 500;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
  transition: background 0.2s ease, box-shadow 0.2s ease, scale 0.15s ease; }
.btn:hover { background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3); }
.btn:active { scale: 0.985; }
.btn.primary { background: #fff; color: #09090b; box-shadow: none; }
.btn.primary:hover { background: #e4e4e7; }

.facts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.fact { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
  border-radius: 999px; background: rgba(255,255,255,0.05);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
  font-size: 12.5px; color: #d4d4d8; }

/* What it asks for. This is the section a gallery has and an app store does
   not: the permissions are listed BEFORE anyone runs anything, from the
   app's own manifest, so the page cannot claim less than the runtime will. */
.asks { margin-top: 40px; border-radius: 18px; padding: 22px 24px;
  background: rgba(24,24,27,0.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.asks h2 { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.asks .sub { font-size: 12.5px; color: #71717a; margin-bottom: 16px; }
.cap { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid rgba(255,255,255,0.06); }
.cap:first-of-type { border-top: 0; }
.cap code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  color: #c4b5fd; white-space: nowrap; }
.cap .why { font-size: 13px; color: #a1a1aa; }
.cap .req { margin-left: auto; font-size: 11px; color: #71717a; white-space: nowrap; }
.none { font-size: 13px; color: #a1a1aa; }

.run { margin-top: 32px; font-size: 13px; color: #71717a; }
.run code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  color: #d4d4d8; background: rgba(255,255,255,0.06); padding: 3px 9px; border-radius: 7px; }

.foot { position: relative; z-index: 1; border-top: 1px solid rgba(255,255,255,0.08);
  padding: 26px 24px; display: flex; gap: 18px; flex-wrap: wrap;
  justify-content: center; font-size: 12.5px; color: #71717a; }
.foot a { color: #a1a1aa; }
.foot a:hover { color: #fff; }
</style>
</head>
<body>
<div class="bloom"></div>
<div class="topblur"></div>
<div class="brandbar">
  <a class="name" href="/"><img src="/krate-glyph-white.png" alt="" /> KRATE</a>
  <nav class="bnav" aria-label="Primary">
    <a href="/#receipts">Why Krate</a>
    <a href="/cloud/">Apps</a>
    <a href="/docs/">Docs</a>
    <a href="/account/">Account</a>
  </nav>
</div>

<div class="wrap" id="wrap">
  <a class="back" href="/cloud/">&larr; All apps</a>
  <div id="body"><p style="color:#71717a;font-size:13px">Loading…</p></div>
</div>

<footer class="foot">
  <span>© 2026 Krate Labs</span>
  <nav>
    <a href="/">Home</a>
    <a href="/cloud/">Gallery</a>
    <a href="/open/">Received an app?</a>
    <a href="/faq/">FAQ</a>
    <a href="/contact/">Contact</a>
    <a href="https://github.com/incyashraj/krate">GitHub</a>
  </nav>
</footer>

<script>
/* An app's own page.
 *
 * This exists because clicking a card in the gallery used to go straight to
 * /a/<hash>, which a desktop browser answers with the RECEIVE page -- "someone
 * sent you an app", install Krate, here is how it opens. That page is right
 * when somebody was actually sent a link and wrong when they were browsing:
 * they had not been sent anything, they clicked a picture in a gallery and
 * wanted to know what the thing was.
 *
 * So browsing lands here -- screenshot, description, and the permissions the
 * app declares -- and the receive page is left for the case it was built for.
 * The Download button still goes to /a/<hash>?dl=1, which hands over the bytes
 * without the walkthrough.
 */
(function () {
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  var id = new URLSearchParams(location.search).get("a") || "";
  var body = document.getElementById("body");
  if (!/^[0-9a-f]{6,64}$/.test(id)) {
    body.innerHTML = '<p class="none">No app named. <a href="/cloud/" style="color:#c4b5fd">Browse the gallery</a>.</p>';
    return;
  }

  fetch("https://hub.krate.tech/meta/" + encodeURIComponent(id))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) throw new Error("no meta");
      var m = d.meta || d;
      var name = m.name || "An app";
      document.title = name + " -- on Krate";

      var kb = m.size ? Math.round(m.size / 1024) : 0;
      var caps = m.capabilities === undefined ? null : m.capabilities;

      var shot = d.shot
        ? '<div class="shot"><img src="' + esc(d.shot) + '" alt="' + esc(name) + '" onerror="this.parentNode.className=\'shot empty\';this.parentNode.textContent=\'No screenshot\'" /></div>'
        : '<div class="shot empty">No screenshot</div>';

      var by = m.author
        ? '<div class="by">' + (m.avatar_url ? '<img src="' + esc(m.avatar_url) + '" alt="" onerror="this.remove()" />' : '')
          + 'by ' + esc(m.author) + '</div>'
        : "";

      var facts = "";
      if (kb) facts += '<span class="fact">' + kb + ' KB, one file</span>';
      facts += '<span class="fact">Mac, Windows and Linux</span>';
      facts += '<span class="fact">Asks before it does anything</span>';

      // The permission list, from the app's own manifest.
      //
      // Three states, not two. `null` means this app was published before
      // the hub started recording capabilities, and saying "asks for
      // nothing" there would be a claim the page cannot support -- an
      // absent list and an empty one mean very different things, and only
      // one of them is reassuring.
      var asks;
      if (caps === null) {
        asks = '<p class="none">Not recorded for this app -- it was published '
             + 'before the gallery kept them. Krate still shows you every '
             + 'permission before it runs, and grants nothing you decline.</p>';
      } else if (caps.length) {
        asks = caps.map(function (c) {
          var cap = typeof c === "string" ? c : (c.cap || c.name || "");
          var why = typeof c === "string" ? "" : (c.rationale || c.why || "");
          var req = typeof c === "object" && c.required ? "required" : "optional";
          return '<div class="cap"><code>' + esc(cap) + '</code>'
            + '<span class="why">' + esc(why) + '</span>'
            + '<span class="req">' + req + '</span></div>';
        }).join("");
      } else {
        asks = '<p class="none">Nothing beyond a window. It cannot reach your files, '
             + 'your network, or anything else on this machine.</p>';
      }

      body.innerHTML = shot
        + '<div class="head"><div>'
        + '<h1 class="nm">' + esc(name) + '</h1>'
        + (m.description ? '<p class="desc">' + esc(m.description) + '</p>' : "")
        + by
        + '</div><div class="acts">'
        + '<a class="btn primary" href="https://hub.krate.tech/a/' + esc(id) + '?dl=1">Download</a>'
        + '<a class="btn" href="/open/?a=' + esc(id) + '">How it opens</a>'
        + '</div></div>'
        + '<div class="facts">' + facts + '</div>'
        + '<div class="asks"><h2>What it asks for</h2>'
        + '<p class="sub">Declared in the app itself. Krate shows you this again before it runs, and grants nothing you decline.</p>'
        + asks + '</div>'
        + '<p class="run">Already have Krate? <code>krate run https://hub.krate.tech/a/' + esc(id) + '</code></p>';
    })
    .catch(function () {
      body.innerHTML = '<p class="none">That app could not be found. '
        + '<a href="/cloud/" style="color:#c4b5fd">Browse the gallery</a>.</p>';
    });
})();
</script>
</body>
</html>
