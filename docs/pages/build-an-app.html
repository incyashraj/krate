       choosing between them with no way to tell the difference. Kept as a
       redirect so links already out in the world still land somewhere. -->

<body>
  <p>This page has moved to
    <a href="/docs/pages/make-an-app-with-ai.html">Make an app by describing it</a>.</p>
<script>
// One anonymous page view -- the page name and the day, to our own hub.
// No cookie, no id, no referrer; strictly less than any analytics vendor.
(function () {
  try {
    fetch("https://hub.krate.tech/view", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: location.pathname }),
      keepalive: true,
      mode: "cors",
    }).catch(function () {});
  } catch (e) {}
})();
</script>
</body>
