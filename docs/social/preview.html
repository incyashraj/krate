<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex">
  <title>Krate social preview source</title>
  <style>
    @font-face { font-family: Geist; src: url('../landing/fonts/geist-400.woff2'); font-weight: 400; }
    @font-face { font-family: Geist; src: url('../landing/fonts/geist-500.woff2'); font-weight: 500; }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { font-family: Geist, sans-serif; color: #fafafa; background: #090909; }
    main { width: 100%; height: 100%; padding: 94px 80px; position: relative; isolation: isolate; }
    main::before { content: ''; position: absolute; z-index: -1; right: -120px; bottom: -140px; width: 660px; height: 500px; background: radial-gradient(ellipse at 65% 65%, #304cbe38 0%, #683db02b 33%, transparent 70%); }
    header { display: flex; align-items: center; gap: 23px; font-size: 60px; font-weight: 500; letter-spacing: -.045em; }
    header img { width: 90px; height: 90px; object-fit: contain; }
    h1 { font-size: 66px; font-weight: 400; line-height: 1.17; letter-spacing: -.045em; margin: 66px 0 0; }
    h1 span { display: block; }
    footer { position: absolute; bottom: 57px; left: 80px; font-size: 23px; color: #999; }
  </style>
</head>
<body>
  <main>
    <header><img src="../landing/krate-glyph-blue.png" alt="">Krate</header>
    <h1>One app file for<span>Mac, Windows and Linux.</span></h1>
    <footer>krate.tech</footer>
  </main>
</body>
</html>
