<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="230" viewBox="0 0 480 230">
  <defs>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#3182ce"/>
    </pattern>
    <pattern id="dots" width="0.1" height="0.1" patternContentUnits="objectBoundingBox">
      <circle cx="0.05" cy="0.05" r="0.03" fill="#e53e3e"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38a169"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="5" fill="#d69e2e"/>
    </marker>
    <filter id="soft"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff00ff"/></filter>
  </defs>
  <rect x="10" y="10" width="120" height="100" rx="8" fill="url(#stripes)"/>
  <rect x="150" y="10" width="120" height="100" rx="8" fill="url(#dots)" stroke="#e53e3e"/>
  <polyline points="300,100 340,20 380,100 420,20" fill="none" stroke="#38a169" stroke-width="3" marker-start="url(#arrow)" marker-mid="url(#dot)" marker-end="url(#arrow)"/>
  <image x="10" y="130" width="90" height="90" href="data:image/png;base64,"/>
  <image x="120" y="130" width="90" height="90" preserveAspectRatio="none" xlink:href="data:image/png;base64," opacity="0.5"/>
  <image x="230" y="130" width="120" height="90" href="chart.png"/>
  <g filter="url(#soft)"><rect x="380" y="140" width="60" height="60" fill="#00ffff"/></g>
</svg>
