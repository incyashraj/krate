# Link the C runtime statically on Windows.
#
# Without this, krate.exe imports vcruntime140.dll and msvcp140.dll from the
# Visual C++ Redistributable. Windows 11 does not ship that, so on a clean
# machine the loader refuses to start the process and the program exits with
# 0xC0000135 (STATUS_DLL_NOT_FOUND) before `main` runs -- no menu, no error,
# no output at all, not even from `--version`. It looks like the command does
# nothing. (K-037, found on a fresh Windows 11 Pro install.)
#
# Static linking is the fix that cannot regress on a machine we never see. The
# alternatives -- installing the redistributable, or shipping the DLLs beside
# the exe -- both leave a way for the binary to meet a machine that lacks them.
# The cost is a few hundred KB of binary, against a product that does not start.

# And give the main thread a stack the size Unix gives it.
#
# Windows reserves 1 MiB for a main thread where Linux and macOS give 8, and a
# debug build's unoptimised frames are several times larger than a release
# build's. `krate pack` overflowed on the Windows CI lane -- "thread 'main' has
# overflowed its stack", exit 127 -- while the same code packed fine on every
# other system and in release everywhere.
#
# /STACK sets it at link time, so nothing about how the program runs changes.
# Moving the work onto a spawned thread would also have fixed it and was tried
# first: it breaks every GUI app, because macOS requires windows to be created
# on the main thread, and hello-gui went straight to exit 30.
#
# 8 MiB, matching Unix, so the three platforms have the same headroom rather
# than one of them being the odd case that overflows first.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/STACK:8388608"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/STACK:8388608"]
